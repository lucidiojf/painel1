<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Suite Pro</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Motores de Manipulação de PDF via Cloudflare CDN (Compatível com Telegram) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Word (.docx) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>

  <!-- Fallback para garantir o carregamento do PDFLib se o primeiro falhar -->
  <script>
    if (typeof PDFLib === 'undefined') {
      const fallbackScript = document.createElement('script');
      fallbackScript.src = 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.9/dist/pdf-lib.min.js';
      document.head.appendChild(fallbackScript);
    }
  </script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--tg-theme-bg-color, #0f172a);
      color: var(--tg-theme-text-color, #e2e8f0);
      margin: 0; padding: 12px;
      display: flex; justify-content: center;
    }
    .container {
      width: 100%; max-width: 540px;
      background: var(--tg-theme-secondary-bg-color, #1e293b);
      padding: 18px; border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    h2 { margin: 0 0 14px 0; font-size: 1.2rem; text-align: center; color: #38bdf8; }
    .nav-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 14px; }
    .nav-scroll::-webkit-scrollbar { height: 4px; }
    .nav-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    .tab-btn {
      padding: 7px 12px; font-size: 0.8rem; font-weight: 600;
      border: 1px solid #334155; background: #0f172a; color: #94a3b8;
      border-radius: 8px; cursor: pointer; white-space: nowrap;
    }
    .tab-btn.active { background: #0284c7; color: #ffffff; border-color: #38bdf8; }
    .panel { display: none; }
    .panel.active { display: block; }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; color: #cbd5e1; }
    input[type="file"], input[type="text"], input[type="password"], textarea {
      width: 100%; padding: 9px; border: 1px solid #334155; border-radius: 8px;
      background: #0f172a; color: #f8fafc; font-size: 0.85rem;
    }
    button.action-btn {
      width: 100%; padding: 11px; margin-top: 6px;
      background: #0284c7; color: #ffffff;
      border: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem;
      cursor: pointer; transition: background 0.2s;
    }
    button.action-btn:hover { background: #0369a1; }
    #status {
      margin-top: 14px; padding: 10px; border-radius: 8px; font-size: 0.85rem; display: none;
      word-break: break-word;
    }
    .ok { background: #064e3b; color: #6ee7b7; border: 1px solid #059669; }
    .err { background: #7f1d1d; color: #fca5a5; border: 1px solid #dc2626; }
  </style>
</head>
<body>

<div class="container">
  <h2>⚡ PDF Tools Ultra</h2>

  <div class="nav-scroll">
    <button class="tab-btn active" onclick="tab('t-unlock', this)">🔓 Unlock CPF</button>
    <button class="tab-btn" onclick="tab('t-merge', this)">📑 Merge</button>
    <button class="tab-btn" onclick="tab('t-split', this)">✂️ Split</button>
    <button class="tab-btn" onclick="tab('t-edit', this)">✏️ Editar</button>
    <button class="tab-btn" onclick="tab('t-form', this)">📝 Formulário</button>
    <button class="tab-btn" onclick="tab('t-pdf2word', this)">📝 PDF → Word</button>
    <button class="tab-btn" onclick="tab('t-word', this)">📄 Word → PDF</button>
    <button class="tab-btn" onclick="tab('t-excel', this)">📊 PDF → Excel</button>
  </div>

  <!-- ABA: UNLOCK CPF -->
  <div id="t-unlock" class="panel active">
    <div class="field">
      <label>Arquivo PDF protegido:</label>
      <input type="file" id="u-file" accept="application/pdf">
    </div>
    <div class="field">
      <label>Senha ou CPF (com ou sem pontuação):</label>
      <input type="text" id="u-pass" placeholder="Ex: 12345678900 ou 123.456.789-00">
    </div>
    <button class="action-btn" onclick="runUnlock()">Remover Senha e Baixar</button>
  </div>

  <!-- ABA: MERGE -->
  <div id="t-merge" class="panel">
    <div class="field">
      <label>Selecione 2 ou mais PDFs:</label>
      <input type="file" id="m-files" accept="application/pdf" multiple>
    </div>
    <button class="action-btn" onclick="runMerge()">Unir Documentos (Merge)</button>
  </div>

  <!-- ABA: SPLIT -->
  <div id="t-split" class="panel">
    <div class="field">
      <label>Arquivo PDF:</label>
      <input type="file" id="s-file" accept="application/pdf">
    </div>
    <div class="field">
      <label>Páginas (Ex: 1-3 ou 1, 4):</label>
      <input type="text" id="s-range" placeholder="Ex: 1-2 ou 1, 3">
    </div>
    <button class="action-btn" onclick="runSplit()">Extrair Páginas (Split)</button>
  </div>

  <!-- ABA: EDITAR / ANOTAR (BLINDADO) -->
  <div id="t-edit" class="panel">
    <div class="field">
      <label>Arquivo PDF:</label>
      <input type="file" id="e-file" accept="application/pdf">
    </div>
    <div class="field">
      <label>Texto a adicionar:</label>
      <input type="text" id="e-text" placeholder="Ex: Aprovado, Cópia Autenticada, etc.">
    </div>
    <div style="display:flex; gap:8px;">
      <div class="field" style="flex:1;">
        <label>Página:</label>
        <input type="text" id="e-page" value="1">
      </div>
      <div class="field" style="flex:1;">
        <label>Posição:</label>
        <input type="text" value="Cabeçalho (Topo)" readonly style="color:#94a3b8;">
      </div>
    </div>
    <button class="action-btn" onclick="runEdit()">Inserir Texto e Baixar</button>
  </div>

  <!-- ABA: FORMULÁRIO (BLINDADO) -->
  <div id="t-form" class="panel">
    <div class="field">
      <label>Arquivo PDF com Formulário:</label>
      <input type="file" id="f-file" accept="application/pdf">
    </div>
    <button class="action-btn" style="background:#475569; margin-bottom:10px;" onclick="runListFields()">🔍 Identificar Campos Existentes</button>
    <div class="field">
      <label>Preenchimento (NomeDoCampo=Valor):</label>
      <textarea id="f-data" rows="3" placeholder="campo1=Valor Aqui&#10;nome=Maria Silva"></textarea>
    </div>
    <button class="action-btn" onclick="runFormFill()">Salvar Formulário Preenchido</button>
  </div>

  <!-- ABA: PDF PARA WORD -->
  <div id="t-pdf2word" class="panel">
    <div class="field">
      <label>Arquivo PDF com texto:</label>
      <input type="file" id="p2w-file" accept="application/pdf">
    </div>
    <button class="action-btn" onclick="runPdfToWord()">Converter para Word (.docx)</button>
  </div>

  <!-- ABA: WORD PARA PDF -->
  <div id="t-word" class="panel">
    <div class="field">
      <label>Documento Word (.docx):</label>
      <input type="file" id="w-file" accept=".docx">
    </div>
    <button class="action-btn" onclick="runWordToPdf()">Converter para PDF</button>
  </div>

  <!-- ABA: PDF PARA EXCEL -->
  <div id="t-excel" class="panel">
    <div class="field">
      <label>Arquivo PDF com tabela:</label>
      <input type="file" id="x-file" accept="application/pdf">
    </div>
    <button class="action-btn" onclick="runPdfToExcel()">Extrair para Excel (.csv)</button>
  </div>

  <div id="status"></div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  function tab(id, element) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (element) element.classList.add('active');
  }

  function msg(text, success = true) {
    const el = document.getElementById("status");
    el.style.display = "block";
    el.className = success ? "ok" : "err";
    el.innerText = text;
  }

function download(blob, filename) {
  const fileUrl = URL.createObjectURL(blob);

  // 1. Tenta usar o botão nativo de compartilhar do celular (Android/iOS)
  // Permite salvar no WhatsApp, Drive, Arquivos, etc.
  if (navigator.canShare && navigator.canShare({ files: [new File([blob], filename, { type: blob.type })] })) {
    const file = new File([blob], filename, { type: blob.type });
    navigator.share({
      files: [file],
      title: filename,
      text: 'Seu arquivo pronto:'
    }).catch((err) => {
      console.log('Compartilhamento cancelado ou não suportado', err);
      fallbackDownload(fileUrl, filename);
    });
    return;
  }

  // 2. Se não suportar Web Share API, usa o fallback com abertura direta
  fallbackDownload(fileUrl, filename);
}

function fallbackDownload(fileUrl, filename) {
  // Cria link direto
  const link = document.createElement("a");
  link.href = fileUrl;
  link.download = filename;
  link.target = "_blank"; // Garante que se o Telegram barrar o download direto, ele abre a tela de pré-visualização
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

  // --- UNLOCK CPF ---
  async function runUnlock() {
    const file = document.getElementById("u-file").files[0];
    const rawPass = document.getElementById("u-pass").value.trim();
    if (!file) return msg("Selecione um arquivo PDF.", false);
    if (!rawPass) return msg("Informe a senha ou CPF.", false);

    const digits = rawPass.replace(/\D/g, "");
    const testList = [rawPass];
    if (digits && digits !== rawPass) testList.push(digits);
    if (digits.length === 11) {
      testList.push(digits.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4"));
      testList.push(digits.slice(0, 5));
      testList.push(digits.slice(0, 6));
    }

    msg("Autenticando...");
    const arrayBuffer = await file.arrayBuffer();
    let pdfDoc = null;

    for (const pwd of testList) {
      try {
        const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer.slice(0), password: pwd });
        pdfDoc = await loadingTask.promise;
        break;
      } catch (err) {}
    }

    if (!pdfDoc) return msg("Senha/CPF incorreto.", false);

    try {
      msg(`Descriptografado! Reconstruindo ${pdfDoc.numPages} página(s)...`);
      const { jsPDF } = window.jspdf;
      let outDoc = null;

      for (let i = 1; i <= pdfDoc.numPages; i++) {
        const page = await pdfDoc.getPage(i);
        const viewport = page.getViewport({ scale: 2.0 });
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = viewport.width;
        canvas.height = viewport.height;

        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        const imgData = canvas.toDataURL("image/jpeg", 0.95);
        const orientation = viewport.width > viewport.height ? "l" : "p";

        if (i === 1) {
          outDoc = new jsPDF(orientation, "pt", [viewport.width, viewport.height]);
        } else {
          outDoc.addPage([viewport.width, viewport.height], orientation);
        }
        outDoc.addImage(imgData, "JPEG", 0, 0, viewport.width, viewport.height);
      }

      download(outDoc.output("blob"), `desbloqueado_${file.name}`);
      msg("PDF desbloqueado com sucesso!");
    } catch (err) {
      msg("Erro ao reconstruir PDF: " + err.message, false);
    }
  }

  // --- MERGE ---
  async function runMerge() {
    const fileInput = document.getElementById("m-files");
    if (!fileInput.files || fileInput.files.length < 2) return msg("Selecione no mínimo 2 PDFs.", false);

    msg("Unindo PDFs...");
    try {
      if (typeof PDFLib !== 'undefined') {
        const mergedPdf = await PDFLib.PDFDocument.create();
        for (const f of fileInput.files) {
          const bytes = await f.arrayBuffer();
          const src = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
          const copied = await mergedPdf.copyPages(src, src.getPageIndices());
          copied.forEach(p => mergedPdf.addPage(p));
        }
        const finalBytes = await mergedPdf.save();
        download(new Blob([finalBytes], { type: "application/pdf" }), "documentos_unidos.pdf");
        return msg("PDFs unidos com sucesso!");
      }
    } catch (e) {
      console.warn("Acionando fallback visual para merge...", e);
    }

    // Fallback garantido via jsPDF + PDF.js
    try {
      const { jsPDF } = window.jspdf;
      let outDoc = null;
      for (const f of fileInput.files) {
        const buf = await f.arrayBuffer();
        const doc = await pdfjsLib.getDocument({ data: buf }).promise;
        for (let i = 1; i <= doc.numPages; i++) {
          const page = await doc.getPage(i);
          const vp = page.getViewport({ scale: 2.0 });
          const canvas = document.createElement("canvas");
          canvas.width = vp.width; canvas.height = vp.height;
          await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
          const img = canvas.toDataURL("image/jpeg", 0.95);
          const orient = vp.width > vp.height ? "l" : "p";
          if (!outDoc) {
            outDoc = new jsPDF(orient, "pt", [vp.width, vp.height]);
          } else {
            outDoc.addPage([vp.width, vp.height], orient);
          }
          outDoc.addImage(img, "JPEG", 0, 0, vp.width, vp.height);
        }
      }
      download(outDoc.output("blob"), "documentos_unidos.pdf");
      msg("PDFs unidos com sucesso!");
    } catch (err2) {
      msg("Erro ao unir: " + err2.message, false);
    }
  }

  // --- SPLIT ---
  async function runSplit() {
    const file = document.getElementById("s-file").files[0];
    const range = document.getElementById("s-range").value.trim();
    if (!file || !range) return msg("Informe o arquivo e as páginas.", false);

    msg("Extraindo páginas...");
    try {
      if (typeof PDFLib !== 'undefined') {
        const bytes = await file.arrayBuffer();
        const srcPdf = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
        const total = srcPdf.getPageCount();
        const indices = [];

        range.split(",").forEach(part => {
          if (part.includes("-")) {
            const [s, e] = part.split("-").map(n => parseInt(n.trim(), 10));
            for (let i = s; i <= e; i++) {
              if (i >= 1 && i <= total && !indices.includes(i - 1)) indices.push(i - 1);
            }
          } else {
            const p = parseInt(part.trim(), 10);
            if (p >= 1 && p <= total && !indices.includes(p - 1)) indices.push(p - 1);
          }
        });

        if (indices.length > 0) {
          const splitDoc = await PDFLib.PDFDocument.create();
          const copied = await splitDoc.copyPages(srcPdf, indices);
          copied.forEach(p => splitDoc.addPage(p));
          const splitBytes = await splitDoc.save();
          download(new Blob([splitBytes], { type: "application/pdf" }), `dividido_${file.name}`);
          return msg("Páginas extraídas com sucesso!");
        }
      }
    } catch (e) {
      console.warn("Acionando fallback visual para split...", e);
    }

    // Fallback garantido via jsPDF + PDF.js
    try {
      const { jsPDF } = window.jspdf;
      const buf = await file.arrayBuffer();
      const doc = await pdfjsLib.getDocument({ data: buf }).promise;
      const targetPages = [];

      range.split(",").forEach(part => {
        if (part.includes("-")) {
          const [s, e] = part.split("-").map(n => parseInt(n.trim(), 10));
          for (let i = s; i <= e; i++) {
            if (i >= 1 && i <= doc.numPages && !targetPages.includes(i)) targetPages.push(i);
          }
        } else {
          const p = parseInt(part.trim(), 10);
          if (p >= 1 && p <= doc.numPages && !targetPages.includes(p)) targetPages.push(p);
        }
      });

      let outDoc = null;
      for (let idx of targetPages) {
        const page = await doc.getPage(idx);
        const vp = page.getViewport({ scale: 2.0 });
        const canvas = document.createElement("canvas");
        canvas.width = vp.width; canvas.height = vp.height;
        await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
        const img = canvas.toDataURL("image/jpeg", 0.95);
        const orient = vp.width > vp.height ? "l" : "p";
        if (!outDoc) {
          outDoc = new jsPDF(orient, "pt", [vp.width, vp.height]);
        } else {
          outDoc.addPage([vp.width, vp.height], orient);
        }
        outDoc.addImage(img, "JPEG", 0, 0, vp.width, vp.height);
      }
      download(outDoc.output("blob"), `dividido_${file.name}`);
      msg("Páginas extraídas com sucesso!");
    } catch (err2) {
      msg("Erro ao dividir: " + err2.message, false);
    }
  }

  // --- EDITAR / ANOTAR (BLINDADO CONTRA QUALQUER ERRO) ---
  async function runEdit() {
    const file = document.getElementById("e-file").files[0];
    const text = document.getElementById("e-text").value.trim();
    const pageNum = parseInt(document.getElementById("e-page").value, 10);

    if (!file || !text) return msg("Selecione o PDF e informe o texto.", false);

    msg("Processando documento...");

    // Tentativa 1: Via PDFLib se disponível
    if (typeof PDFLib !== 'undefined') {
      try {
        const pdf = await PDFLib.PDFDocument.load(await file.arrayBuffer(), { ignoreEncryption: true });
        const font = await pdf.embedFont(PDFLib.StandardFonts.HelveticaBold);
        const pages = pdf.getPages();
        if (pageNum >= 1 && pageNum <= pages.length) {
          const target = pages[pageNum - 1];
          const safeText = text.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
          target.drawText(safeText, {
            x: 40,
            y: target.getHeight() - 40,
            size: 16,
            font: font,
            color: PDFLib.rgb(0.9, 0.1, 0.1),
          });
          const bytes = await pdf.save();
          download(new Blob([bytes], { type: "application/pdf" }), `editado_${file.name}`);
          return msg("Texto adicionado com sucesso!");
        }
      } catch (e) {
        console.warn("PDFLib falhou na edição, usando motor jsPDF...", e);
      }
    }

    // Tentativa 2: Fallback 100% garantido com PDF.js + jsPDF (nunca quebra)
    try {
      const { jsPDF } = window.jspdf;
      const doc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      let outDoc = null;

      for (let i = 1; i <= doc.numPages; i++) {
        const page = await doc.getPage(i);
        const vp = page.getViewport({ scale: 2.0 });
        const canvas = document.createElement("canvas");
        canvas.width = vp.width; canvas.height = vp.height;
        await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
        const img = canvas.toDataURL("image/jpeg", 0.95);
        const orient = vp.width > vp.height ? "l" : "p";

        if (i === 1) {
          outDoc = new jsPDF(orient, "pt", [vp.width, vp.height]);
        } else {
          outDoc.addPage([vp.width, vp.height], orient);
        }
        outDoc.addImage(img, "JPEG", 0, 0, vp.width, vp.height);

        // Se for a página escolhida, escreve o texto em vermelho no topo
        if (i === pageNum) {
          outDoc.setFontSize(22);
          outDoc.setTextColor(230, 25, 25);
          outDoc.text(text, 50, 60);
        }
      }

      download(outDoc.output("blob"), `editado_${file.name}`);
      msg("Texto adicionado com sucesso!");
    } catch (err) {
      msg("Erro ao editar: " + err.message, false);
    }
  }

  // --- FORMULÁRIO: LISTAR CAMPOS ---
  async function runListFields() {
    const file = document.getElementById("f-file").files[0];
    if (!file) return msg("Selecione um PDF de formulário.", false);

    if (typeof PDFLib === 'undefined') {
      return msg("Módulo de formulários ainda carregando. Tente novamente em alguns segundos.", false);
    }

    try {
      msg("Lendo campos...");
      const pdf = await PDFLib.PDFDocument.load(await file.arrayBuffer(), { ignoreEncryption: true });
      const form = pdf.getForm();
      const fields = form.getFields();

      if (fields.length === 0) {
        return msg("Nenhum campo interativo detectado neste PDF.", false);
      }

      document.getElementById("f-data").value = fields.map(f => `${f.getName()}=`).join("\n");
      msg(`Encontrado(s) ${fields.length} campo(s). Preencha os valores abaixo:`);
    } catch (err) {
      msg("Erro ao ler formulário: " + err.message, false);
    }
  }

  // --- FORMULÁRIO: PREENCHER E SALVAR ---
  async function runFormFill() {
    const file = document.getElementById("f-file").files[0];
    const lines = document.getElementById("f-data").value.split("\n");
    if (!file) return msg("Selecione um PDF.", false);

    if (typeof PDFLib === 'undefined') {
      return msg("Módulo de formulários ainda carregando. Tente novamente em alguns segundos.", false);
    }

    try {
      msg("Preenchendo...");
      const pdf = await PDFLib.PDFDocument.load(await file.arrayBuffer(), { ignoreEncryption: true });
      const form = pdf.getForm();
      let count = 0;

      for (const line of lines) {
        if (!line.includes("=")) continue;
        const [k, ...vParts] = line.split("=");
        const key = k.trim();
        const val = vParts.join("=").trim();
        if (key && val) {
          try {
            const field = form.getTextField(key);
            field.setText(val);
            count++;
          } catch (e) {
            try {
              const chk = form.getCheckBox(key);
              if (val.toLowerCase() === "true" || val === "1" || val.toLowerCase() === "sim") chk.check();
              count++;
            } catch (e2) {}
          }
        }
      }

      if (count === 0) return msg("Nenhum campo correspondente encontrado para preencher.", false);

      const bytes = await pdf.save();
      download(new Blob([bytes], { type: "application/pdf" }), `preenchido_${file.name}`);
      msg(`${count} campo(s) preenchido(s) com sucesso!`);
    } catch (err) {
      msg("Erro no formulário: " + err.message, false);
    }
  }

  // --- PDF PARA WORD ---
  async function runPdfToWord() {
    const file = document.getElementById("p2w-file").files[0];
    if (!file) return msg("Selecione um arquivo PDF.", false);

    try {
      msg("Processando PDF...");
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const paragraphs = [];

      for (let p = 1; p <= pdf.numPages; p++) {
        const page = await pdf.getPage(p);
        const textContent = await page.getTextContent();
        const lines = {};

        textContent.items.forEach(item => {
          const y = Math.round(item.transform[5] / 4) * 4;
          if (!lines[y]) lines[y] = [];
          lines[y].push(item);
        });

        const sortedY = Object.keys(lines).sort((a, b) => b - a);
        sortedY.forEach(y => {
          const sortedItems = lines[y].sort((a, b) => a.transform[4] - b.transform[4]);
          const lineStr = sortedItems.map(it => it.str).join(" ").trim();
          if (lineStr) {
            paragraphs.push(
              new docx.Paragraph({
                children: [new docx.TextRun({ text: lineStr, font: "Calibri", size: 22 })],
                spacing: { after: 120 }
              })
            );
          }
        });

        if (p < pdf.numPages) {
          paragraphs.push(new docx.Paragraph({ children: [new docx.PageBreak()] }));
        }
      }

      if (paragraphs.length === 0) return msg("Nenhum texto detectado.", false);

      const doc = new docx.Document({ sections: [{ children: paragraphs }] });
      const docxBlob = await docx.Packer.toBlob(doc);
      download(docxBlob, `${file.name.replace(/\.pdf$/i, "")}.docx`);
      msg("Word (.docx) gerado com sucesso!");
    } catch (err) {
      msg("Erro: " + err.message, false);
    }
  }

  // --- WORD PARA PDF ---
  async function runWordToPdf() {
    const file = document.getElementById("w-file").files[0];
    if (!file) return msg("Selecione um arquivo .docx.", false);

    try {
      msg("Lendo DOCX...");
      const res = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
      const rawText = res.value;
      if (!rawText.trim()) return msg("O arquivo Word está vazio.", false);

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF("p", "pt", "a4");
      const margin = 40;
      const maxLineWidth = doc.internal.pageSize.getWidth() - (margin * 2);
      const splitText = doc.splitTextToSize(rawText, maxLineWidth);

      let cursorY = 50;
      const lineHeight = 16;
      const pageHeight = doc.internal.pageSize.getHeight();

      for (const line of splitText) {
        if (cursorY + lineHeight > pageHeight - margin) {
          doc.addPage();
          cursorY = 50;
        }
        doc.text(line, margin, cursorY);
        cursorY += lineHeight;
      }

      download(doc.output("blob"), `${file.name.replace(/\.docx$/i, "")}.pdf`);
      msg("Word convertido para PDF com sucesso!");
    } catch (err) {
      msg("Erro: " + err.message, false);
    }
  }

  // --- PDF PARA EXCEL ---
  async function runPdfToExcel() {
    const file = document.getElementById("x-file").files[0];
    if (!file) return msg("Selecione um arquivo PDF.", false);

    try {
      msg("Extraindo dados tabulares...");
      const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      let csvOutput = "\uFEFF";

      for (let p = 1; p <= pdf.numPages; p++) {
        const page = await pdf.getPage(p);
        const content = await page.getTextContent();
        const rows = {};

        content.items.forEach(item => {
          const y = Math.round(item.transform[5]);
          if (!rows[y]) rows[y] = [];
          rows[y].push(item.str);
        });

        const sortedY = Object.keys(rows).sort((a, b) => b - a);
        sortedY.forEach(y => {
          const rowData = rows[y].map(c => `"${c.replace(/"/g, '""')}"`);
          csvOutput += rowData.join(";") + "\r\n";
        });
      }

      download(new Blob([csvOutput], { type: "text/csv;charset=utf-8;" }), `${file.name.replace(/\.pdf$/i, "")}.csv`);
      msg("Planilha extraída com sucesso!");
    } catch (err) {
      msg("Erro: " + err.message, false);
    }
  }
</script>
