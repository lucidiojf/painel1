<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISTEMA HM - AIH Oficial</title>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f1f5f9; margin: 0; padding: 20px; color: #1e293b; }
    .container { max-width: 950px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #0369a1; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; font-size: 22px; }
    fieldset { border: 1px solid #cbd5e1; border-radius: 8px; padding: 16px; margin-bottom: 20px; background: #fafafa; }
    legend { font-weight: 700; color: #0284c7; padding: 0 8px; font-size: 15px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .form-group { margin-bottom: 8px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #475569; }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; background: #fff; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #0284c7; }
    .btn-template { background: #e2e8f0; border: 1px solid #cbd5e1; padding: 4px 10px; font-size: 12px; border-radius: 4px; cursor: pointer; font-weight: 600; margin-right: 5px; }
    .btn-submit { background: #0284c7; color: #fff; border: none; padding: 14px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }
    .btn-submit:hover { background: #0369a1; }
    #msgStatus { margin-top: 15px; font-weight: bold; text-align: center; font-size: 15px; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.75); z-index: 9999; justify-content: center; align-items: center; padding: 15px; }
    .modal-content { background: #fff; width: 100%; max-width: 950px; height: 92vh; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { background: #0284c7; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { margin: 0; font-size: 17px; }
    .modal-body { flex: 1; background: #525659; }
    .modal-body iframe { width: 100%; height: 100%; border: none; }
    .modal-footer { padding: 12px 20px; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 10px; }
    .btn-modal { padding: 8px 18px; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; border: 1px solid transparent; }
    .btn-close { background: #e2e8f0; color: #334155; }
    .btn-print { background: #16a34a; color: #fff; }
    .btn-download { background: #0284c7; color: #fff; }
  </style>
</head>
<body>

<div class="container">
  <h2>Emissão de AIH Hospitalar - Modelo Oficial</h2>

  <form id="formAih">
    <fieldset>
      <legend>Identificação do Paciente e Internação</legend>
      <div class="grid-3">
        <div class="form-group">
          <label>Nº Prontuário:</label>
          <input type="text" id="prontuario" value="5286" required>
        </div>
        <div class="form-group">
          <label>Nome Completo:</label>
          <input type="text" id="nomePaciente" value="MANOEL" required>
        </div>
        <div class="form-group">
          <label>Cartão SUS (CNS):</label>
          <input type="text" id="cns" value="704006647751551">
        </div>
      </div>
      <div class="grid-4">
        <div class="form-group">
          <label>Data de Nascimento:</label>
          <input type="text" id="dataNasc" value="10/12/1960">
        </div>
        <div class="form-group">
          <label>Sexo:</label>
          <select id="sexo">
            <option value="M" selected>Masculino</option>
            <option value="F">Feminino</option>
          </select>
        </div>
        <div class="form-group">
          <label>Raça / Cor:</label>
          <input type="text" id="racaCor" value="PARDA">
        </div>
        <div class="form-group">
          <label>Telefone:</label>
          <input type="text" id="telefone" value="84 99980 5728">
        </div>
      </div>
      <div class="grid-3">
        <div class="form-group">
          <label>Nome da Mãe:</label>
          <input type="text" id="nomeMae" value="MARIA JOSE">
        </div>
        <div class="form-group">
          <label>Endereço Completo:</label>
          <input type="text" id="endereco" value="ST ARROJADO, SN - ZONA RURAL">
        </div>
        <div class="form-group">
          <label>Município:</label>
          <input type="text" id="municipio" value="FRUTUOSO GOMES - RN">
        </div>
      </div>
      <div class="grid-4">
        <div class="form-group">
          <label>Data Internação:</label>
          <input type="text" id="dataInternacao" value="19/03/23">
        </div>
        <div class="form-group">
          <label>Data Saída (Alta):</label>
          <input type="text" id="dataSaida" value="02/04/23">
        </div>
        <div class="form-group">
          <label>Diagnóstico Inicial:</label>
          <input type="text" id="diagInicial" value="ERISIPELA">
        </div>
        <div class="form-group">
          <label>CID-10 Principal:</label>
          <input type="text" id="cidPrincipal" value="A 46">
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Procedimento SIGTAP:</label>
          <input type="text" id="procCod" value="0303080078">
        </div>
        <div class="form-group">
          <label>Enfermaria / Leito:</label>
          <input type="text" id="leito" value="01 / MASC">
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Boletim Operatório / Descrição Cirúrgica</legend>
      <div class="grid-2">
        <div class="form-group">
          <label>Cirurgião Operador:</label>
          <input type="text" id="cirurgiaoOperador" value="DR LUCIDIO">
        </div>
        <div class="form-group">
          <label>Médico Anestesista:</label>
          <input type="text" id="anestesistaNome" value="DR HIAGO - CRM: 8.830">
        </div>
      </div>

      <div style="margin: 10px 0 6px 0;">
        <span style="font-size: 13px; font-weight: bold; margin-right: 8px;">Modelos:</span>
        <button type="button" class="btn-template" onclick="inserirModelo('cesariana')">Cesariana</button>
        <button type="button" class="btn-template" onclick="inserirModelo('colecistectomia')">Colecistectomia</button>
      </div>

      <div class="form-group">
        <label>Relatório Cirúrgico:</label>
        <textarea id="relatorioCirurgico" rows="4"></textarea>
      </div>
    </fieldset>

    <button type="submit" class="btn-submit" id="btnSalvar">Salvar no Sheets e Gerar AIH Oficial</button>
    <div id="msgStatus"></div>
  </form>
</div>

<div class="modal-overlay" id="pdfModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Visualizador da AIH Oficial Preenchida</h3>
      <span style="cursor: pointer; font-size: 20px;" onclick="fecharViewer()">&times;</span>
    </div>
    <div class="modal-body">
      <iframe id="pdfFrame"></iframe>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn-modal btn-close" onclick="fecharViewer()">Fechar</button>
      <button type="button" class="btn-modal btn-download" id="btnDownload">Baixar PDF</button>
      <button type="button" class="btn-modal btn-print" onclick="dispararImpressao()">Imprimir</button>
    </div>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzReK2XpvU3AgoGojdjB0vQqxl8hZEO9xVyHzaUC3juON_W0elUkTSSpgWRrWEbuI1s/exec";

  let matrizLimpaBytes = null;
  let currentBlobUrl = null;

  const MODELOS = {
    cesariana: `Incisão Pfannenstiel transversa arciforme. Abertura por planos. Histerotomia transversa semicircular segmento inferior útero. Concepto vivo, em boas condições. Extração manual da placenta. Revisão da cavidade uterina. Histerorrafia em 02 planos. Fechamento de parede por planos anatômicos. Pele suturada com mononylon 3-0. Curativo estéril.`,
    colecistectomia: `Incisão paramediana supraumbilical à direita. Abertura da cavidade peritoneal. Identificação da vesícula biliar. Dissecção do triângulo de Calot. Ligadura dupla do ducto cístico e artéria cística com fio inabsorvível 00. Colecistectomia retrógrada. Revisão da hemostasia do leito hepático. Fechamento da cavidade peritoneal por planos. Pele suturada com mononylon 3-0. Curativo estéril.`
  };

  function inserirModelo(tipo) {
    if (MODELOS[tipo]) document.getElementById('relatorioCirurgico').value = MODELOS[tipo];
  }

  async function carimbarNoPdfBranco(dados) {
    if (!matrizLimpaBytes) {
      const nomes = ['AIH COMPLETA.pdf', 'AIH%20COMPLETA.pdf', 'AIH-FG.pdf'];
      for (const n of nomes) {
        try {
          const res = await fetch(`./${n}`);
          if (res.ok) { matrizLimpaBytes = await res.arrayBuffer(); break; }
        } catch (e) {}
      }
    }

    if (!matrizLimpaBytes) {
      throw new Error("Arquivo AIH COMPLETA.pdf não encontrado no repositório.");
    }

    const { PDFDocument, StandardFonts } = PDFLib;
    const pdfDoc = await PDFDocument.load(matrizLimpaBytes);
    const font = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
    const fontNorm = await pdfDoc.embedFont(StandardFonts.Helvetica);
    const pages = pdfDoc.getPages();

    // =========================================================================
    // PÁGINA 1: AIH PRINCIPAL (Calibrada Linha por Linha)
    // =========================================================================
    if (pages[0]) {
      const p1 = pages[0];

      // Topo: Prontuário e Datas (Prontuário puxado para a caixa certa)
      p1.drawText(dados.prontuario || '', { x: 240, y: 692, size: 9, font });
      p1.drawText(dados.dataInternacao || '', { x: 160, y: 659, size: 9, font: fontNorm });
      p1.drawText(dados.dataSaida || '', { x: 440, y: 659, size: 9, font: fontNorm });

      // Linha 1: Nome do Paciente (Desceu para a linha Nome do Paciente:)
      p1.drawText(dados.nomePaciente || '', { x: 130, y: 610, size: 9.5, font });

      // Linha 2: Sexo, Nascimento, Raça/Cor, CNS (Desceram para a linha correta)
      p1.drawText(dados.sexo || '', { x: 55, y: 588, size: 9, font: fontNorm });
      p1.drawText(dados.dataNasc || '', { x: 155, y: 588, size: 9, font: fontNorm });
      p1.drawText(dados.racaCor || '', { x: 310, y: 588, size: 9, font: fontNorm });
      p1.drawText(dados.cns || '', { x: 420, y: 588, size: 9, font: fontNorm });

      // Linha 3: Nome da Mãe (Desceu para a linha Nome da mãe:)
      p1.drawText(dados.nomeMae || '', { x: 110, y: 570, size: 8.5, font: fontNorm });

      // Linha 4: Endereço (Desceu para a linha Endereço:)
      p1.drawText(dados.endereco || '', { x: 85, y: 552, size: 8.5, font: fontNorm });

      // Linha 5: Município e Telefone (Desceram para a linha Município / Telefone)
      p1.drawText(dados.municipio || '', { x: 85, y: 534, size: 8.5, font: fontNorm });
      p1.drawText(dados.telefone || '', { x: 420, y: 534, size: 8.5, font: fontNorm });

      // Procedimento Solicitado e CID Principal
      p1.drawText(dados.procCod || '', { x: 165, y: 494, size: 9, font });
      p1.drawText(dados.cidPrincipal || '', { x: 110, y: 438, size: 9, font });

      // Linhas Inferiores
      p1.drawText("ALTA CURADO", { x: 150, y: 418, size: 8.5, font: fontNorm });
      p1.drawText("08.349.052/0001-80", { x: 260, y: 404, size: 8, font: fontNorm });
      p1.drawText(dados.dataInternacao || '', { x: 475, y: 404, size: 8, font: fontNorm });

      // Tabela de Procedimentos Realizados (Linha 1 perfeitamente centrada na grade)
      p1.drawText("01", { x: 52, y: 336, size: 8, font: fontNorm });
      p1.drawText(dados.procCod || '', { x: 105, y: 336, size: 8, font });
      p1.drawText("1", { x: 212, y: 336, size: 8, font: fontNorm });
      p1.drawText("08.349.052", { x: 250, y: 336, size: 7.5, font: fontNorm });
      p1.drawText("225125", { x: 325, y: 336, size: 8, font: fontNorm });
      p1.drawText("2380846", { x: 395, y: 336, size: 8, font: fontNorm });
      p1.drawText("08.349.052/0001-80", { x: 462, y: 336, size: 7.5, font: fontNorm });
    }

    // =========================================================================
    // PÁGINA 2: LAUDO DE SOLICITAÇÃO SUS (Ajuste Fino das Caixas Cinzas)
    // =========================================================================
    if (pages[1]) {
      const p2 = pages[1];
      
      // Bloco Identificação do Paciente
      p2.drawText(dados.nomePaciente || '', { x: 50, y: 642, size: 9, font });
      p2.drawText(dados.prontuario || '', { x: 390, y: 642, size: 9, font });
      p2.drawText(dados.cns || '', { x: 50, y: 602, size: 9, font: fontNorm });
      p2.drawText(dados.dataNasc || '', { x: 275, y: 602, size: 9, font: fontNorm });

      // Caixa de Sexo (Masc / Fem)
      if (dados.sexo === 'M') p2.drawText('X', { x: 374, y: 602, size: 9, font });
      if (dados.sexo === 'F') p2.drawText('X', { x: 416, y: 602, size: 9, font });

      p2.drawText(dados.racaCor || '', { x: 445, y: 602, size: 8.5, font: fontNorm });
      p2.drawText(dados.nomeMae || '', { x: 50, y: 482, size: 8.5, font: fontNorm });
      p2.drawText(dados.telefone || '', { x: 385, y: 482, size: 8.5, font: fontNorm });
      p2.drawText(dados.endereco || '', { x: 50, y: 448, size: 8.5, font: fontNorm });
      p2.drawText(dados.municipio || '', { x: 50, y: 414, size: 8.5, font: fontNorm });

      // Bloco Justificativa da Internação
      p2.drawText(dados.diagInicial || '', { x: 50, y: 325, size: 8.5, font });
      p2.drawText(dados.cidPrincipal || '', { x: 260, y: 325, size: 9, font });
      p2.drawText(dados.procCod || '', { x: 370, y: 288, size: 9, font });
    }

    // =========================================================================
    // PÁGINA 5: BOLETIM CIRÚRGICO (Alinhamento do Bloco de Texto)
    // =========================================================================
    if (pages[4]) {
      const p5 = pages[4];
      p5.drawText(dados.nomePaciente || '', { x: 80, y: 755, size: 9, font });
      p5.drawText(dados.prontuario || '', { x: 460, y: 700, size: 9, font });
      p5.drawText(dados.cirurgiaoOperador || '', { x: 100, y: 645, size: 8.5, font: fontNorm });
      p5.drawText(dados.anestesistaNome || '', { x: 100, y: 590, size: 8.5, font: fontNorm });

      if (dados.relatorioCirurgico) {
        p5.drawText(dados.relatorioCirurgico, {
          x: 90, y: 430, size: 7.5, font: fontNorm, maxWidth: 465, lineHeight: 10.5
        });
      }
    }

    return await pdfDoc.save();
  }

  // Envio para o Google Sheets e Abertura do PDF
  document.getElementById('formAih').addEventListener('submit', async function(e) {
    e.preventDefault();
    const st = document.getElementById('msgStatus');
    const btn = document.getElementById('btnSalvar');

    st.style.color = '#0284c7';
    st.innerText = 'Gravando no Google Sheets e gerando visualizador...';
    btn.disabled = true;

    const payload = {
      prontuario: document.getElementById('prontuario').value,
      nomePaciente: document.getElementById('nomePaciente').value,
      cns: document.getElementById('cns').value,
      dataNasc: document.getElementById('dataNasc').value,
      sexo: document.getElementById('sexo').value,
      racaCor: document.getElementById('racaCor').value,
      telefone: document.getElementById('telefone').value,
      nomeMae: document.getElementById('nomeMae').value,
      endereco: document.getElementById('endereco').value,
      municipio: document.getElementById('municipio').value,
      dataInternacao: document.getElementById('dataInternacao').value,
      dataSaida: document.getElementById('dataSaida').value,
      diagInicial: document.getElementById('diagInicial').value,
      cidPrincipal: document.getElementById('cidPrincipal').value,
      procCod: document.getElementById('procCod').value,
      cirurgiaoOperador: document.getElementById('cirurgiaoOperador').value,
      anestesistaNome: document.getElementById('anestesistaNome').value,
      relatorioCirurgico: document.getElementById('relatorioCirurgico').value
    };

    if (SCRIPT_URL && !SCRIPT_URL.includes("SUA_URL_DO_GOOGLE")) {
      const p = new URLSearchParams(payload);
      fetch(`${SCRIPT_URL}?${p.toString()}`, {
        method: 'GET',
        mode: 'no-cors'
      }).catch(err => console.warn("Aviso Sheets:", err));
    }

    try {
      const pdfBytes = await carimbarNoPdfBranco(payload);
      const blob = new Blob([pdfBytes], { type: 'application/pdf' });
      
      if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
      currentBlobUrl = URL.createObjectURL(blob);

      document.getElementById('pdfFrame').src = currentBlobUrl;
      
      const btnDl = document.getElementById('btnDownload');
      btnDl.onclick = function() {
        const link = document.createElement('a');
        link.href = currentBlobUrl;
        link.download = `AIH_${payload.prontuario || 'Documento'}.pdf`;
        link.click();
      };

      document.getElementById('pdfModal').style.display = 'flex';
      st.style.color = '#16a34a';
      st.innerText = 'Concluído! Registro gravado e AIH gerada com sucesso.';
    } catch (pdfErr) {
      st.style.color = '#dc2626';
      st.innerText = 'Erro: ' + pdfErr.message;
    } finally {
      btn.disabled = false;
    }
  });

  function fecharViewer() {
    document.getElementById('pdfModal').style.display = 'none';
  }

  function dispararImpressao() {
    const iframe = document.getElementById('pdfFrame');
    if (iframe && iframe.contentWindow) {
      iframe.focus();
      iframe.contentWindow.print();
    }
  }
</script>

</body>
</html>
