<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emissão AIH Oficial</title>
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --success: #16a34a;
      --success-hover: #15803d;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text: #1e293b;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
    .container { max-width: 1000px; margin: 0 auto; background: var(--card-bg); border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); padding: 24px; }
    
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 16px; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; color: #0f172a; }
    
    /* Barra de Navegação */
    .nav-bar { display: flex; align-items: center; justify-content: space-between; background: #e0f2fe; padding: 12px 16px; border-radius: 8px; margin-bottom: 24px; gap: 12px; flex-wrap: wrap; }
    .nav-group { display: flex; align-items: center; gap: 8px; }
    .btn-nav { background: var(--primary); color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.95rem; }
    .btn-nav:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-nav:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-ultimo { background: var(--success); }
    .btn-ultimo:hover { background: var(--success-hover); }
    .lbl-registro { font-weight: 600; color: #0369a1; min-width: 80px; text-align: center; }
    
    .busca-box { display: flex; gap: 6px; }
    .busca-box input { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; min-width: 200px; }
    
    /* Estrutura do Formulário */
    fieldset { border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 20px; background: #fff; }
    legend { font-weight: 600; color: var(--primary); padding: 0 8px; font-size: 1.05rem; }
    .grid { display: grid; gap: 12px; }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }
    
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.82rem; font-weight: 600; color: var(--text-muted); }
    input, select, textarea { border: 1px solid var(--border); padding: 8px; border-radius: 6px; font-size: 0.9rem; color: #0f172a; width: 100%; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px #bae6fd; }
    textarea { resize: vertical; }

    /* Barra de Ações */
    .actions-bar { display: flex; gap: 12px; margin-top: 24px; align-items: center; flex-wrap: wrap; }
    .btn-action { padding: 12px 20px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; color: white; display: flex; align-items: center; gap: 8px; font-size: 0.95rem; }
    .btn-save { background: var(--primary); }
    .btn-save:hover { background: var(--primary-hover); }
    .btn-print { background: var(--success); }
    .btn-print:hover { background: var(--success-hover); }
    
    #msgStatus { font-size: 0.9rem; font-weight: 600; }

    /* Modal de Impressão */
    .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); z-index: 9999; justify-content: center; align-items: center; }
    .modal-content { background: white; width: 90%; height: 90%; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #f1f5f9; border-bottom: 1px solid var(--border); }
    .modal-body { flex: 1; }
    .modal-body iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Emissão AIH Oficial</h1>
    <button type="button" class="btn-nav" onclick="location.reload()">↻ Recarregar</button>
  </header>

  <!-- Barra de Navegação -->
  <div class="nav-bar">
    <div class="nav-group">
      <button type="button" id="btnAnt" class="btn-nav" onclick="navegarRegistro(-1)">◀</button>
      <span id="lblRegistro" class="lbl-registro">1 / 1</span>
      <button type="button" id="btnProx" class="btn-nav" onclick="navegarRegistro(1)">▶</button>
      <button type="button" class="btn-nav btn-ultimo" onclick="carregarUltimoRegistro()">Último</button>
    </div>
    <div class="busca-box">
      <input type="text" id="campoBusca" placeholder="Buscar por Nome ou Prontuário...">
      <button type="button" class="btn-nav" onclick="buscarPorTermo()">Buscar</button>
    </div>
  </div>

  <form id="formAih">
    <!-- Identificação do Paciente -->
    <fieldset>
      <legend>Identificação do Paciente</legend>
      <div class="grid grid-3">
        <div class="form-group">
          <label for="prontuario">Nº Prontuário:</label>
          <input type="text" id="prontuario" required>
        </div>
        <div class="form-group">
          <label for="nomePaciente">Nome Completo:</label>
          <input type="text" id="nomePaciente" required>
        </div>
        <div class="form-group">
          <label for="cns">Cartão SUS (CNS):</label>
          <input type="text" id="cns">
        </div>
      </div>

      <div class="grid grid-4" style="margin-top: 10px;">
        <div class="form-group">
          <label for="dataNasc">Data de Nascimento:</label>
          <input type="text" id="dataNasc" placeholder="DD/MM/AAAA">
        </div>
        <div class="form-group">
          <label for="sexo">Sexo:</label>
          <select id="sexo">
            <option value="F">Feminino</option>
            <option value="M">Masculino</option>
          </select>
        </div>
        <div class="form-group">
          <label for="racaCor">Raça / Cor:</label>
          <input type="text" id="racaCor" value="PARDA">
        </div>
        <div class="form-group">
          <label for="telefone">Telefone:</label>
          <input type="text" id="telefone" value="84 99980 5728">
        </div>
      </div>

      <div class="grid grid-3" style="margin-top: 10px;">
        <div class="form-group">
          <label for="nomeMae">Nome da Mãe:</label>
          <input type="text" id="nomeMae">
        </div>
        <div class="form-group">
          <label for="nomePai">Nome do Pai:</label>
          <input type="text" id="nomePai">
        </div>
        <div class="form-group">
          <label for="profissao">Profissão:</label>
          <input type="text" id="profissao" value="AGRICULTORA">
        </div>
      </div>

      <div class="grid grid-4" style="margin-top: 10px;">
        <div class="form-group" style="grid-column: span 2;">
          <label for="endereco">Endereço Completo:</label>
          <input type="text" id="endereco" value="SITIO MUMBAÇA, SN - ZONA RURAL">
        </div>
        <div class="form-group">
          <label for="numEndereco">Nº:</label>
          <input type="text" id="numEndereco" value="SN">
        </div>
        <div class="form-group">
          <label for="bairro">Bairro:</label>
          <input type="text" id="bairro" value="ZONA RURAL">
        </div>
      </div>

      <div class="grid grid-4" style="margin-top: 10px;">
        <div class="form-group">
          <label for="municipio">Município:</label>
          <input type="text" id="municipio" value="FRUTUOSO GOMES">
        </div>
        <div class="form-group">
          <label for="estado">Estado / UF:</label>
          <input type="text" id="estado" value="RN">
        </div>
        <div class="form-group">
          <label for="cep">CEP:</label>
          <input type="text" id="cep" value="59890-000">
        </div>
        <div class="form-group">
          <label for="rg">RG / Documento:</label>
          <input type="text" id="rg">
        </div>
      </div>
    </fieldset>

    <!-- Dados da Internação e Procedimento -->
    <fieldset>
      <legend>Dados Clínicos e Internação</legend>
      <div class="grid grid-3">
        <div class="form-group">
          <label for="dataInternacao">Data Internação:</label>
          <input type="text" id="dataInternacao" placeholder="DD/MM/AAAA">
        </div>
        <div class="form-group">
          <label for="dataSaida">Data Saída (Alta):</label>
          <input type="text" id="dataSaida" placeholder="DD/MM/AAAA">
        </div>
        <div class="form-group">
          <label for="dataSolicitacao">Data Solicitação:</label>
          <input type="text" id="dataSolicitacao" placeholder="DD/MM/AAAA">
        </div>
      </div>

      <div class="grid grid-3" style="margin-top: 10px;">
        <div class="form-group">
          <label for="diagInicial">Diagnóstico Inicial:</label>
          <input type="text" id="diagInicial">
        </div>
        <div class="form-group">
          <label for="cidPrincipal">CID-10 Principal:</label>
          <input type="text" id="cidPrincipal">
        </div>
        <div class="form-group">
          <label for="especialidade">Especialidade / Clínica:</label>
          <select id="especialidade">
            <option value="CLINICA CIRURGICA">CLINICA CIRURGICA</option>
            <option value="CLINICA MEDICA">CLINICA MEDICA</option>
            <option value="OBSTETRICIA">OBSTETRICIA</option>
            <option value="PEDIATRIA">PEDIATRIA</option>
          </select>
        </div>
      </div>

      <div class="grid grid-2" style="margin-top: 10px;">
        <div class="form-group">
          <label for="procedimento">Descrição do Procedimento:</label>
          <input type="text" id="procedimento">
        </div>
        <div class="form-group">
          <label for="codProcedimento">Código SIGTAP:</label>
          <input type="text" id="codProcedimento">
        </div>
      </div>

      <div class="grid grid-2" style="margin-top: 10px;">
        <div class="form-group">
          <label for="medicoSolicitante">Nome do Solicitante:</label>
          <input type="text" id="medicoSolicitante" value="LUCIDIO JÁCOME FERREIRA">
        </div>
        <div class="form-group">
          <label for="cpfSolicitante">CPF do Solicitante:</label>
          <input type="text" id="cpfSolicitante" value="175.499.574-87">
        </div>
      </div>
    </fieldset>

    <!-- Laudo Justificativo -->
    <fieldset>
      <legend>Laudo e Justificativa de Internação</legend>
      <div class="form-group">
        <label for="sinaisSintomas">17. Principais Sinais e Sintomas Clínicos:</label>
        <textarea id="sinaisSintomas" rows="2"></textarea>
      </div>
      <div class="form-group" style="margin-top: 10px;">
        <label for="justificativa">18. Condições que Justificam a Internação:</label>
        <textarea id="justificativa" rows="2"></textarea>
      </div>
      <div class="form-group" style="margin-top: 10px;">
        <label for="exames">19. Principais Resultados de Provas Diagnósticas (Exames):</label>
        <textarea id="exames" rows="2"></textarea>
      </div>
    </fieldset>

    <!-- Bloco Operatório -->
    <fieldset>
      <legend>Anestesia e Relatório de Internação</legend>
      <div class="grid grid-2">
        <div class="form-group">
          <label for="txtAnestesia">Drogas Usadas / Prescrição Anestésica (Folha 4):</label>
          <textarea id="txtAnestesia" rows="2">Lidocaina a 2% - 20 ml SF - 500 ml EV</textarea>
        </div>
        <div class="form-group">
          <label for="txtCirurgia">Descrição do Boletim / Relatório (Folha 5):</label>
          <textarea id="txtCirurgia" rows="2">SEM INTERCORRÊNCIAS OPERATÓRIAS.</textarea>
        </div>
      </div>
    </fieldset>

    <!-- Barra de Ações Dividida -->
    <div class="actions-bar">
      <!-- Salva na Planilha + Gera PDF (Novos Cadastros) -->
      <button type="submit" id="btnSalvarEGerar" class="btn-action btn-save">
        💾 Salvar na Planilha e Gerar AIH
      </button>

      <!-- Apenas Gera PDF / Imprime (Para a fila do Sheets) -->
      <button type="button" id="btnApenasGerarPdf" class="btn-action btn-print">
        🖨️ Apenas Gerar PDF / Imprimir (Sem Salvar)
      </button>

      <span id="msgStatus"></span>
    </div>
  </form>
</div>

<!-- Modal de Visualização do PDF -->
<div id="modalVisualizacao" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 style="color: #0f172a;">Visualização da AIH Gerada</h3>
      <div style="display: flex; gap: 8px;">
        <button type="button" class="btn-nav btn-ultimo" onclick="imprimirPdf()">Imprimir</button>
        <button type="button" class="btn-nav" id="btnDownload">Baixar PDF</button>
        <button type="button" class="btn-nav" style="background:#ef4444;" onclick="fecharModal()">Fechar</button>
      </div>
    </div>
    <div class="modal-body">
      <iframe id="pdfFrame"></iframe>
    </div>
  </div>
</div>

<script>
  const URL_PDF_BASE = 'AIH_FORM.pdf?v=' + Date.now();
  const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbyxbtbbTXdDl2jp3I2Ka9w0VWV4n3FwlokJsYi2yzR6yYL0JLFpUuNn8sGZjYiT4bKohQ/exec';

  let pdfBytesGerado = null;
  let pdfBlobUrl = null;
  let indiceAtual = 1;
  let totalRegistros = 1;

  window.addEventListener('DOMContentLoaded', () => {
    carregarUltimoRegistro();
  });

  /* =========================================================================
     CONSULTA E NAVEGAÇÃO
  ========================================================================= */
  async function carregarRegistroPorIndice(idx) {
    const msg = document.getElementById('msgStatus');
    msg.style.color = '#0284c7';
    msg.innerText = 'Carregando registro da planilha...';

    try {
      const res = await fetch(`${URL_APPS_SCRIPT}?index=${idx}`);
      const data = await res.json();

      if (data && data.sucesso && data.paciente) {
        indiceAtual = data.indiceAtual;
        totalRegistros = data.total;
        atualizarControlesNav(data.paciente);
        msg.style.color = '#16a34a';
        msg.innerText = `Registro ${indiceAtual} de ${totalRegistros} carregado.`;
      } else {
        msg.style.color = '#dc2626';
        msg.innerText = 'Nenhum registro encontrado.';
      }
    } catch (e) {
      msg.style.color = '#dc2626';
      msg.innerText = 'Erro ao consultar: ' + e.message;
    }
  }

  function navegarRegistro(delta) {
    const novoIdx = indiceAtual + delta;
    if (novoIdx >= 1 && novoIdx <= totalRegistros) {
      carregarRegistroPorIndice(novoIdx);
    }
  }

  function carregarUltimoRegistro() {
    carregarRegistroPorIndice(999999);
  }

  async function buscarPorTermo() {
    const termo = document.getElementById('campoBusca').value.trim();
    if (!termo) {
      alert('Digite o nome ou prontuário para buscar.');
      return;
    }

    const msg = document.getElementById('msgStatus');
    msg.style.color = '#0284c7';
    msg.innerText = 'Buscando...';

    try {
      const res = await fetch(`${URL_APPS_SCRIPT}?busca=${encodeURIComponent(termo)}`);
      const data = await res.json();

      if (data && data.sucesso && data.paciente) {
        indiceAtual = data.indiceAtual;
        totalRegistros = data.total;
        atualizarControlesNav(data.paciente);
        msg.style.color = '#16a34a';
        msg.innerText = `Encontrado: Registro ${indiceAtual} de ${totalRegistros}.`;
      } else {
        msg.style.color = '#dc2626';
        msg.innerText = 'Nenhum paciente encontrado com: ' + termo;
      }
    } catch (e) {
      msg.style.color = '#dc2626';
      msg.innerText = 'Erro na busca: ' + e.message;
    }
  }

  /* =========================================================================
     PREENCHIMENTO INTELIGENTE E ANTI-DESALINHAMENTO
  ========================================================================= */
  function atualizarControlesNav(p) {
    document.getElementById('lblRegistro').innerText = `${indiceAtual} / ${totalRegistros}`;
    document.getElementById('btnAnt').disabled = (indiceAtual <= 1);
    document.getElementById('btnProx').disabled = (indiceAtual >= totalRegistros);

    const endStr = (p.endereco || '').toString().toUpperCase();
    const munStr = (p.municipio || '').toString().toUpperCase();
    
    // Detecta se a coluna da mãe deslocou o endereço para a direita
    const deslocado = endStr.includes('SILVA') || endStr.includes('SOARES') || endStr.includes('BATISTA') || munStr.includes('SITIO') || munStr.includes('RUA') || munStr.includes('SN');

    let mae = p.mae || '';
    let endereco = p.endereco || '';
    let municipio = p.municipio || 'FRUTUOSO GOMES';
    let estado = p.estado || 'RN';
    let dtInternacao = p.dtInternacao || '';
    let dtSaida = p.dtSaida || '';
    let diag = p.diag || '';
    let cid = p.cid || '';
    let procedimento = p.procedimento || '';
    let codProced = p.codProced || '';
    let medico = p.medico || 'LUCIDIO JÁCOME FERREIRA';
    let cpfMed = p.cpfMed || '175.499.574-87';

    if (deslocado) {
      mae = p.endereco;
      endereco = p.municipio;
      municipio = (p.estado && p.estado.length > 3) ? p.estado : 'FRUTUOSO GOMES';
      estado = 'RN';
      dtInternacao = p.dtSaida || '08/07/2026';
      dtSaida = p.dtSaida || dtInternacao;
      diag = p.cid;
      cid = p.procedimento;
      procedimento = p.codProced;
      codProced = p.medico;
      medico = p.cpfMed || 'LUCIDIO JÁCOME FERREIRA';
      cpfMed = '175.499.574-87';
    }

    // 1. Identificação
    document.getElementById('prontuario').value = p.prontuario || '';
    document.getElementById('nomePaciente').value = p.nome || '';
    document.getElementById('cns').value = p.cns || '';
    document.getElementById('dataNasc').value = p.nasc || '';
    document.getElementById('sexo').value = (p.sexo && p.sexo.toString().toUpperCase().startsWith('M')) ? 'M' : 'F';
    document.getElementById('racaCor').value = p.raca || 'PARDA';
    document.getElementById('telefone').value = '84 99980 5728';
    document.getElementById('nomeMae').value = mae;
    document.getElementById('nomePai').value = p.pai || '';
    document.getElementById('profissao').value = 'AGRICULTORA';

    // 2. Endereço
    document.getElementById('endereco').value = endereco || 'SITIO ARROJADO';
    document.getElementById('numEndereco').value = 'SN';
    document.getElementById('bairro').value = 'ZONA RURAL';
    document.getElementById('municipio').value = municipio;
    document.getElementById('estado').value = estado;
    document.getElementById('cep').value = '59890-000';
    document.getElementById('rg').value = '';

    // 3. Datas
    document.getElementById('dataInternacao').value = dtInternacao;
    document.getElementById('dataSaida').value = dtSaida;
    document.getElementById('dataSolicitacao').value = dtInternacao;

    // 4. Clínicos
    document.getElementById('diagInicial').value = diag;
    document.getElementById('cidPrincipal').value = cid;
    document.getElementById('procedimento').value = procedimento;
    document.getElementById('codProcedimento').value = codProced;
    if (p.especialidade) document.getElementById('especialidade').value = p.especialidade;

    // 5. Solicitante
    document.getElementById('medicoSolicitante').value = medico;
    document.getElementById('cpfSolicitante').value = cpfMed;

    // 6. Laudos
    document.getElementById('sinaisSintomas').value = (p.sinais && !p.sinais.includes('175.')) ? p.sinais : 
      'LESÕES DE PELE DE MMSS POSSIVELMENTE BENIGNA. EVOLUIU SEM ANORMALIDADES.';
    document.getElementById('justificativa').value = p.justificativa || 
      'NECESSIDADE DE REALIZAR BIOPSIA / EXERESE.';
    document.getElementById('exames').value = p.exames || 
      'EXS SEM ANORMALIDADES';

    document.getElementById('txtAnestesia').value = 'Lidocaina a 2% - 20 ml SF - 500 ml EV';
    document.getElementById('txtCirurgia').value = 'SEM INTERCORRÊNCIAS OPERATÓRIAS.';
  }

  document.getElementById('campoBusca').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      buscarPorTermo();
    }
  });

  /* =========================================================================
     BOTÕES DE AÇÃO: SALVAR VS APENAS IMPRIMIR
  ========================================================================= */
  // Botão 1: Salva no Sheets + Gera PDF
  document.getElementById('formAih').addEventListener('submit', async function(e) {
    e.preventDefault();
    const msg = document.getElementById('msgStatus');
    msg.style.color = '#0284c7';
    msg.innerText = 'Salvando na planilha e gerando AIH...';

    try {
      await gerarAihAdobeForm(true); // true = SALVA
      msg.style.color = '#16a34a';
      msg.innerText = 'Salvo na planilha e AIH gerada!';
    } catch (err) {
      console.error(err);
      msg.style.color = '#dc2626';
      msg.innerText = 'Erro: ' + err.message;
    }
  });

  // Botão 2: Apenas Gera PDF / Imprime (Fila do Sheets)
  document.getElementById('btnApenasGerarPdf').addEventListener('click', async function() {
    const msg = document.getElementById('msgStatus');
    msg.style.color = '#0284c7';
    msg.innerText = 'Montando documento para impressão...';

    try {
      await gerarAihAdobeForm(false); // false = NÃO SALVA
      msg.style.color = '#16a34a';
      msg.innerText = 'Pronto para impressão!';
    } catch (err) {
      console.error(err);
      msg.style.color = '#dc2626';
      msg.innerText = 'Erro ao gerar PDF: ' + err.message;
    }
  });

  /* =========================================================================
     MONTAGEM DEFINITIVA DO PDF (PDF-LIB)
  ========================================================================= */
  async function gerarAihAdobeForm(salvarNaPlanilha = false) {
    const { PDFDocument, StandardFonts } = PDFLib;

    const res = await fetch(URL_PDF_BASE);
    if (!res.ok) throw new Error('Não encontrou o arquivo AIH_FORM.pdf no repositório.');
    const buffer = await res.arrayBuffer();

    const pdfDoc = await PDFDocument.load(buffer);
    const helvetica = await pdfDoc.embedFont(StandardFonts.Helvetica);

    const form = pdfDoc.getForm();
    const fields = form.getFields();

    const nomeProced = document.getElementById('procedimento').value || '';
    const codProced = document.getElementById('codProcedimento').value || '';

    const procedCompleto = (nomeProced && codProced && !nomeProced.includes(codProced))
      ? `${nomeProced} - ${codProced}`
      : nomeProced;

    const d = {
      prontuario: document.getElementById('prontuario').value || '',
      nome: document.getElementById('nomePaciente').value || '',
      cns: document.getElementById('cns').value || '',
      nasc: document.getElementById('dataNasc').value || '',
      sexo: document.getElementById('sexo').value || 'F',
      raca: document.getElementById('racaCor').value || 'PARDA',
      tel: document.getElementById('telefone').value || '',
      mae: document.getElementById('nomeMae').value || '',
      pai: document.getElementById('nomePai').value || '',
      profissao: document.getElementById('profissao').value || 'AGRICULTORA',
      endereco: document.getElementById('endereco').value || '',
      num: document.getElementById('numEndereco').value || 'SN',
      bairro: document.getElementById('bairro').value || 'ZONA RURAL',
      municipio: document.getElementById('municipio').value || 'FRUTUOSO GOMES',
      estado: document.getElementById('estado').value || 'RN',
      cep: document.getElementById('cep').value || '59890-000',
      rg: document.getElementById('rg').value || '',
      dtInternacao: document.getElementById('dataInternacao').value || '',
      dtSaida: document.getElementById('dataSaida').value || '',
      diag: document.getElementById('diagInicial').value || '',
      cid: document.getElementById('cidPrincipal').value || '',
      procedimento: nomeProced,
      codProced: codProced,
      procedComCodigo: procedCompleto,
      especialidade: document.getElementById('especialidade').value || 'CLINICA MEDICA',
      medico: document.getElementById('medicoSolicitante').value || 'LUCIDIO JÁCOME FERREIRA',
      cpfMed: document.getElementById('cpfSolicitante').value || '175.499.574-87',
      dtSol: document.getElementById('dataSolicitacao').value || '',
      sinais: document.getElementById('sinaisSintomas').value || '',
      justificativa: document.getElementById('justificativa').value || '',
      exames: document.getElementById('exames').value || '',
      anestesia: document.getElementById('txtAnestesia').value || '',
      cirurgia: document.getElementById('txtCirurgia').value || ''
    };

    const normalizar = (txt) => {
      return (txt || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/[^a-z0-9]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    };

    fields.forEach(f => {
      const originalName = f.getName();
      const n = normalizar(originalName);

      try {
        const tf = form.getTextField(originalName);
        if (tf) {
          let val = null;
          let fontSize = 8.5;
          let isMulti = false;

          // 24. Descrição do Procedimento
          if (
            n.startsWith('24') ||
            n.includes('24 descricao') ||
            n.includes('24 desc') ||
            (n.includes('descricao') && n.includes('procedimento')) ||
            (n.includes('desc') && n.includes('procedimento')) ||
            (n.includes('procedimento solicitado') && !n.includes('codigo') && !n.includes('cod')) ||
            n === 'procedimento solicitado' ||
            n === 'descricao do procedimento solicitado' ||
            n === 'campo24 procedimento' ||
            n === 'campo24'
          ) {
            val = d.procedComCodigo;
            fontSize = 7.8;
            isMulti = true;
          }
          // 25. Código SIGTAP
          else if (
            n.startsWith('25') ||
            n.includes('codigo do procedimento') ||
            n.includes('codigo procedimento') ||
            n.includes('cod proced') ||
            n.includes('proced solic') ||
            n.includes('proced realiz')
          ) {
            val = d.codProced;
            fontSize = 9.0;
          }
          // 18. Justificativa
          else if (
            n.startsWith('18') || 
            n.includes('justificam') || 
            n.includes('justificativa') || 
            n.includes('condicoes que') || 
            n.includes('condicoes') ||
            n === 'campo18 justificativa' ||
            n === 'campo18'
          ) {
            val = d.justificativa; 
            fontSize = 7.8; 
            isMulti = true;
          }
          // 19. Provas Diagnósticas / Exames
          else if (
            n.startsWith('19') || 
            n.includes('provas') || 
            n.includes('diagnosticas') || 
            n.includes('exames') || 
            n.includes('resultado de exames') || 
            n.includes('principais resultados') ||
            n === 'campo19 exames' ||
            n === 'campo19'
          ) {
            val = d.exames; 
            fontSize = 7.8; 
            isMulti = true;
          }
          // 20. Diagnóstico Inicial
          else if (
            n.startsWith('20') || 
            n.includes('20 diagnostico') || 
            (n.includes('diagnostico') && !n.includes('cid') && !n.includes('pre') && !n.includes('final')) || 
            n === 'diagnostico inicial' ||
            n.includes('diag inicial') ||
            n === 'campo20 diagnostico' ||
            n === 'campo20'
          ) {
            val = d.diag; 
            fontSize = 8.5;
          }
          // 21. CID Principal
          else if (
            n.startsWith('21') || 
            n.includes('cid 10 principal') || 
            n.includes('cid principal') || 
            n === 'cid' || 
            n.includes('cid 10') ||
            n.includes('cid princ')
          ) {
            val = d.cid; 
            fontSize = 9.5;
          }
          // 17. Sinais e Sintomas
          else if (n.startsWith('17') || n.includes('sinais') || n.includes('sintomas')) {
            val = d.sinais; 
            fontSize = 7.8; 
            isMulti = true;
          }
          // DATAS BLINDADAS (Rejeitam qualquer texto)
          else if (n.includes('dt intern') || n.includes('admissao') || n === 'data da internacao') {
            val = (d.dtInternacao && !/[a-zA-Z]/.test(d.dtInternacao)) ? d.dtInternacao : '';
            fontSize = 8.5;
          }
          else if (n.includes('dt saida') || n.includes('alta') || n === 'data da saida') {
            val = (d.dtSaida && !/[a-zA-Z]/.test(d.dtSaida)) ? d.dtSaida : '';
            fontSize = 8.5;
          }
          else if (n.includes('data autz') || n.includes('dt exped') || n.includes('dt cir') || n.includes('dt sol') || n.includes('data da solicitacao')) {
            val = (d.dtSol && !/[a-zA-Z]/.test(d.dtSol)) ? d.dtSol : (d.dtInternacao || '');
            fontSize = 8.5;
          }
          else if (n.includes('dn') || n.includes('nasc') || n === 'data de nascimento') {
            val = (d.nasc && !/[a-zA-Z]/.test(d.nasc)) ? d.nasc : '';
            fontSize = 8.5;
          }
          // Identificação Geral
          else if (n.includes('prontuario')) { val = d.prontuario; fontSize = 9.5; }
          else if (n.includes('nome') && !n.includes('mae') && !n.includes('pai') && !n.includes('med') && !n.includes('cirurg') && !n.includes('solicitante')) { val = d.nome; fontSize = 8.8; }
          else if (n.includes('sus') || n.includes('cns')) { val = d.cns; fontSize = 9.0; }
          else if (n.includes('sexo')) { val = d.sexo; fontSize = 9.0; }
          else if (n.includes('cor') || n.includes('raca')) { val = d.raca; fontSize = 8.5; }
          else if (n.includes('mae')) { val = d.mae; fontSize = 8.5; }
          else if (n.includes('pai')) { val = d.pai; fontSize = 8.5; }
          else if (n.includes('profiss')) { val = d.profissao; fontSize = 8.5; }
          else if (n.includes('endereco')) { val = `${d.endereco}, ${d.num} - ${d.bairro}`; fontSize = 8.0; }
          else if (n === 'n' || n.startsWith('n ') || n.includes('numero')) { val = d.num; fontSize = 9.0; }
          else if (n.includes('bairro')) { val = d.bairro; fontSize = 8.5; }
          else if (n.includes('municipio') || n.includes('naturalidade')) { val = d.municipio; fontSize = 8.5; }
          else if (n.includes('estado') || n === 'uf' || n.includes('15 uf')) { val = d.estado; fontSize = 9.0; }
          else if (n.includes('cep')) { val = d.cep; fontSize = 8.5; }
          else if (n.includes('telefone')) { val = d.tel; fontSize = 8.5; }
          else if (n.includes('doc') || n === 'rg') { val = d.rg; fontSize = 9.0; }
          else if (n.includes('mud proc')) { val = 'N'; fontSize = 9.0; }
          else if (n.includes('especialidade') || n.includes('clinica') || n.includes('servico')) { val = d.especialidade; fontSize = 8.2; }
          else if (n.includes('enferm')) { val = 'M'; fontSize = 9.0; }
          else if (n.includes('leito')) { val = '1'; fontSize = 9.0; }
          else if (n.includes('mot saida')) { val = 'ALTA'; fontSize = 8.5; }
          else if (n.includes('cpf sol') || n.includes('cpf med') || n.includes('documento cns cpf do profissional')) { val = d.cpfMed; fontSize = 9.0; }
          else if (n.includes('nome med') || n.includes('profissional solicitante')) { val = d.medico; fontSize = 8.5; }
          else if (n.includes('tecnica') || n.includes('tipo anest')) { val = 'LOCAL'; fontSize = 8.5; }
          else if (n.includes('drogas usadas') || n.includes('anestesia')) { val = d.anestesia; fontSize = 7.5; isMulti = true; }
          else if (n.includes('boletim') || n.includes('relatorio de internacao') || n.includes('relatorio')) { val = d.cirurgia; fontSize = 7.5; isMulti = true; }

          if (val !== null && val !== '') {
            try { 
              if (isMulti && typeof tf.enableMultiline === 'function') {
                tf.enableMultiline();
              }
            } catch(e) {}
            try { tf.setFontSize(fontSize); } catch(e) {}
            tf.setText(String(val).toUpperCase());
          }
        }
      } catch (e) {}

      try {
        const cb = form.getCheckBox(originalName);
        if (cb) {
          const n = normalizar(originalName);
          if (n.includes('check box2') || n.includes('check box3') || n === 'rg' || n.includes('fem')) {
            cb.check();
          }
        }
      } catch (e) {}
    });

    form.updateFieldAppearances(helvetica);

    // Gravação condicional na Planilha
    if (salvarNaPlanilha) {
      fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(d)
      }).catch(err => console.warn('Erro Sheets:', err));
    }

    pdfBytesGerado = await pdfDoc.save();
    const blob = new Blob([pdfBytesGerado], { type: 'application/pdf' });
    if (pdfBlobUrl) URL.revokeObjectURL(pdfBlobUrl);
    pdfBlobUrl = URL.createObjectURL(blob);

    document.getElementById('pdfFrame').src = pdfBlobUrl;
    document.getElementById('modalVisualizacao').style.display = 'flex';

    const btnDown = document.getElementById('btnDownload');
    btnDown.onclick = () => {
      const a = document.createElement('a');
      a.href = pdfBlobUrl;
      a.download = `AIH_${d.prontuario}_${d.nome.replace(/\s+/g, '_')}.pdf`;
      a.click();
    };
  }

  function fecharModal() {
    document.getElementById('modalVisualizacao').style.display = 'none';
  }

  function imprimirPdf() {
    const frame = document.getElementById('pdfFrame');
    if (frame && frame.contentWindow) {
      frame.contentWindow.focus();
      frame.contentWindow.print();
    }
  }
</script>
</body>
</html>
