<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISTEMA HM - AIH 3 Guias</title>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f1f5f9; margin: 0; padding: 12px; color: #1e293b; }
    .container { max-width: 950px; margin: 0 auto; background: #fff; padding: 18px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #0369a1; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
    .btn-reload { background: #64748b; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    fieldset { border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa; }
    legend { font-weight: 700; color: #0284c7; padding: 0 6px; font-size: 13px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
    .form-group { margin-bottom: 6px; }
    label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 3px; color: #475569; }
    input, select, textarea { width: 100%; padding: 7px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 12px; background: #fff; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #0284c7; }
    .btn-template { background: #e2e8f0; border: 1px solid #cbd5e1; padding: 4px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; font-weight: 600; margin-right: 4px; }
    .btn-submit { background: #0284c7; color: #fff; border: none; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 7px; cursor: pointer; width: 100%; margin-top: 8px; }
    .btn-submit:hover { background: #0369a1; }
    #msgStatus { margin-top: 10px; font-weight: bold; text-align: center; font-size: 13px; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.75); z-index: 9999; justify-content: center; align-items: center; padding: 8px; }
    .modal-content { background: #fff; width: 100%; max-width: 950px; height: 95vh; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { background: #0284c7; color: #fff; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { margin: 0; font-size: 15px; }
    .modal-body { flex: 1; background: #525659; }
    .modal-body iframe { width: 100%; height: 100%; border: none; }
    .modal-footer { padding: 8px 14px; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 8px; }
    .btn-modal { padding: 7px 14px; border-radius: 5px; font-weight: 600; font-size: 12px; cursor: pointer; border: none; }
    .btn-close { background: #e2e8f0; color: #334155; }
    .btn-print { background: #16a34a; color: #fff; }
    .btn-download { background: #0284c7; color: #fff; }
  </style>
</head>
<body>

<div class="container">
  <h2>
    <span>Emissão AIH - 3 Guias (v5.0)</span>
    <button type="button" class="btn-reload" onclick="location.reload(true)">↻ Recarregar</button>
  </h2>

  <form id="formAih">
    <fieldset>
      <legend>Identificação do Paciente</legend>
      <div class="grid-3">
        <div class="form-group">
          <label>Nº Prontuário:</label>
          <input type="text" id="prontuario" value="444" required>
        </div>
        <div class="form-group">
          <label>Nome Completo:</label>
          <input type="text" id="nomePaciente" value="MARIA DE LOURDES" required>
        </div>
        <div class="form-group">
          <label>Cartão SUS (CNS):</label>
          <input type="text" id="cns" value="704006647751551">
        </div>
      </div>
      <div class="grid-4">
        <div class="form-group">
          <label>Data de Nascimento:</label>
          <input type="text" id="dataNasc" value="10/12/1960">
        </div>
        <div class="form-group">
          <label>Sexo:</label>
          <select id="sexo">
            <option value="M">Masculino</option>
            <option value="F" selected>Feminino</option>
          </select>
        </div>
        <div class="form-group">
          <label>Raça / Cor:</label>
          <input type="text" id="racaCor" value="PARDA">
        </div>
        <div class="form-group">
          <label>Telefone:</label>
          <input type="text" id="telefone" value="84 99980 5728">
        </div>
      </div>
      <div class="grid-3">
        <div class="form-group">
          <label>Nome da Mãe:</label>
          <input type="text" id="nomeMae" value="OLIVIA BATISTA">
        </div>
        <div class="form-group">
          <label>Endereço Completo:</label>
          <input type="text" id="endereco" value="ST ARROJADO, SN - ZONA RURAL">
        </div>
        <div class="form-group">
          <label>Município:</label>
          <input type="text" id="municipio" value="FRUTUOSO GOMES - RN">
        </div>
      </div>
      <div class="grid-4">
        <div class="form-group">
          <label>Data Internação:</label>
          <input type="text" id="dataInternacao" value="19/03/23">
        </div>
        <div class="form-group">
          <label>Data Saída (Alta):</label>
          <input type="text" id="dataSaida" value="02/04/23">
        </div>
        <div class="form-group">
          <label>Diagnóstico Inicial:</label>
          <input type="text" id="diagInicial" value="ERISIPELA">
        </div>
        <div class="form-group">
          <label>CID-10 Principal:</label>
          <input type="text" id="cidPrincipal" value="A46">
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Procedimento Solicitado / Descrição:</label>
          <input type="text" id="procedimento" value="TRATAMENTO DE OUTRAS DOENCAS INFECCIOSAS E PARASITARIAS">
        </div>
        <div class="form-group">
          <label>Código Procedimento (SIGTAP):</label>
          <input type="text" id="codProcedimento" value="03.03.01.019-3">
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Dados Clínicos / Justificativa</legend>
      <div class="form-group">
        <button type="button" class="btn-template" onclick="preencherTemplate('erisipela')">Template Erisipela</button>
        <button type="button" class="btn-template" onclick="preencherTemplate('pneumonia')">Template Pneumonia</button>
        <button type="button" class="btn-template" onclick="preencherTemplate('itu')">Template ITU</button>
      </div>
      <div class="form-group">
        <label>Sinais e Sintomas Clínicos:</label>
        <textarea id="sinaisSintomas" rows="2">PACIENTE COM QUADRO DE HIPEREMIA, EDEMA INTENSO, CALOR LOCAL EM MEMBRO INFERIOR, DOR E FEBRE.</textarea>
      </div>
      <div class="form-group">
        <label>Condições que Justificam a Internação:</label>
        <textarea id="justificativa" rows="2">NECESSIDADE DE ANTIBIOTICOTERAPIA PARENTERAL, VIGILÂNCIA CLÍNICA E REPOUSO EM ELEVAÇÃO.</textarea>
      </div>
      <div class="form-group">
        <label>Principais Resultados de Exames:</label>
        <textarea id="exames" rows="2">LEUCOGRAMA COM LEUCOCITOSE E DESVIO À ESQUERDA; PCR ELEVADO.</textarea>
      </div>
    </fieldset>

    <fieldset>
      <legend>Identificação do Estabelecimento e Solicitante</legend>
      <div class="grid-2">
        <div class="form-group">
          <label>Estabelecimento:</label>
          <input type="text" id="nomeHospital" value="HOSPITAL MATERNIDADE SEVERINA CARLOS DE ANDRADE" readonly>
        </div>
        <div class="form-group">
          <label>Código CNES:</label>
          <input type="text" id="cnesHospital" value="2408371">
        </div>
      </div>
      <div class="grid-3">
        <div class="form-group">
          <label>Médico Solicitante:</label>
          <input type="text" id="medicoSolicitante" value="LUCIDIO JACOME FERREIRA FILHO">
        </div>
        <div class="form-group">
          <label>CRM:</label>
          <input type="text" id="crmSolicitante" value="1675-RN">
        </div>
        <div class="form-group">
          <label>Data Solicitação:</label>
          <input type="text" id="dataSolicitacao" value="19/03/23">
        </div>
      </div>
    </fieldset>

    <button type="submit" class="btn-submit">Gerar as 3 Guias da AIH</button>
    <div id="msgStatus"></div>
  </form>
</div>

<div id="modalVisualizacao" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Visualização das 3 Guias da AIH</h3>
      <button class="btn-modal btn-close" onclick="fecharModal()">✕</button>
    </div>
    <div class="modal-body">
      <iframe id="pdfFrame"></iframe>
    </div>
    <div class="modal-footer">
      <button class="btn-modal btn-close" onclick="fecharModal()">Fechar</button>
      <button class="btn-modal btn-print" onclick="imprimirPdf()">Imprimir</button>
      <button class="btn-modal btn-download" id="btnDownload">Baixar PDF</button>
    </div>
  </div>
</div>

<script>
  // Carrega sempre o PDF original sem cache
  const URL_PDF_BASE = 'AIH%20COMPLETA.pdf?nocache=' + Date.now();

  let pdfBytesGerado = null;
  let pdfBlobUrl = null;

  function preencherTemplate(tipo) {
    if (tipo === 'erisipela') {
      document.getElementById('diagInicial').value = 'ERISIPELA';
      document.getElementById('cidPrincipal').value = 'A46';
      document.getElementById('procedimento').value = 'TRATAMENTO DE OUTRAS DOENCAS INFECCIOSAS E PARASITARIAS';
      document.getElementById('codProcedimento').value = '03.03.01.019-3';
      document.getElementById('sinaisSintomas').value = 'PACIENTE COM QUADRO DE HIPEREMIA, EDEMA INTENSO, CALOR LOCAL EM MEMBRO INFERIOR, DOR E FEBRE.';
      document.getElementById('justificativa').value = 'NECESSIDADE DE ANTIBIOTICOTERAPIA PARENTERAL, VIGILÂNCIA CLÍNICA E REPOUSO EM ELEVAÇÃO.';
      document.getElementById('exames').value = 'LEUCOGRAMA COM LEUCOCITOSE E DESVIO À ESQUERDA; PCR ELEVADO.';
    } else if (tipo === 'pneumonia') {
      document.getElementById('diagInicial').value = 'PNEUMONIA BACTERIANA';
      document.getElementById('cidPrincipal').value = 'J18.9';
      document.getElementById('procedimento').value = 'TRATAMENTO DE PNEUMONIAS OU INFLUENZA (GRIPE)';
      document.getElementById('codProcedimento').value = '03.03.01.018-5';
      document.getElementById('sinaisSintomas').value = 'TOSSE PRODUTIVA, FEBRE AFERIDA, DISPNEIA E CREPITANTES EM BASES PULMONARES.';
      document.getElementById('justificativa').value = 'INDICAÇÃO DE ANTIBIOTICOTERAPIA PARENTERAL E SUPORTE DE OXIGENOTERAPIA.';
      document.getElementById('exames').value = 'RX DE TÓRAX COM CONDENSAÇÃO PULMONAR; LEUCOCITOSE.';
    } else if (tipo === 'itu') {
      document.getElementById('diagInicial').value = 'INFECÇÃO DO TRATO URINÁRIO';
      document.getElementById('cidPrincipal').value = 'N39.0';
      document.getElementById('procedimento').value = 'TRATAMENTO DE OUTRAS DOENÇAS DO SISTEMA URINÁRIO';
      document.getElementById('codProcedimento').value = '03.03.01.017-7';
      document.getElementById('sinaisSintomas').value = 'DISÚRIA, POLACIÚRIA, DOR EM BAIXO VENTRE, URINA TURVA E FEBRE.';
      document.getElementById('justificativa').value = 'SINTOMATOLOGIA REFRATÁRIA, HIDRATAÇÃO VENOSA E ANTIBIOTICOTERAPIA.';
      document.getElementById('exames').value = 'EAS COM PIÚRIA MACIÇA E BACTERIÚRIA.';
    }
  }

  document.getElementById('formAih').addEventListener('submit', async function(e) {
    e.preventDefault();
    const msg = document.getElementById('msgStatus');
    msg.style.color = '#0284c7';
    msg.innerText = 'Preenchendo as 3 guias oficiais...';

    try {
      await gerarAihPdf();
      msg.innerText = '';
    } catch (err) {
      console.error(err);
      msg.style.color = '#dc2626';
      msg.innerText = 'Erro ao processar PDF: ' + err.message;
    }
  });

  async function gerarAihPdf() {
    const { PDFDocument, rgb, StandardFonts } = PDFLib;

    const res = await fetch(URL_PDF_BASE);
    if (!res.ok) throw new Error('Não foi possível carregar o modelo base AIH COMPLETA.pdf.');
    const buffer = await res.arrayBuffer();

    const pdfDoc = await PDFDocument.load(buffer);
    const fontRegular = await pdfDoc.embedFont(StandardFonts.Helvetica);
    const fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

    // Mantém exatamente as 3 primeiras guias
    while (pdfDoc.getPageCount() > 3) {
      pdfDoc.removePage(pdfDoc.getPageCount() - 1);
    }

    const pages = pdfDoc.getPages();
    const pag1 = pages[0]; // Folha 1: Autorização
    const pag2 = pages[1]; // Folha 2: Laudo Médico
    const pag3 = pages[2]; // Folha 3: Prontuário de Internação

    const d = {
      prontuario: document.getElementById('prontuario').value || '',
      nome: document.getElementById('nomePaciente').value || '',
      cns: document.getElementById('cns').value || '',
      dataNasc: document.getElementById('dataNasc').value || '',
      sexo: document.getElementById('sexo').value || 'M',
      racaCor: document.getElementById('racaCor').value || 'PARDA',
      telefone: document.getElementById('telefone').value || '',
      nomeMae: document.getElementById('nomeMae').value || '',
      endereco: document.getElementById('endereco').value || '',
      municipio: document.getElementById('municipio').value || 'FRUTUOSO GOMES - RN',
      dataInternacao: document.getElementById('dataInternacao').value || '',
      dataSaida: document.getElementById('dataSaida').value || '',
      diagInicial: document.getElementById('diagInicial').value || '',
      cidPrincipal: document.getElementById('cidPrincipal').value || '',
      procedimento: document.getElementById('procedimento').value || '',
      codProcedimento: document.getElementById('codProcedimento').value || '',
      sinais: document.getElementById('sinaisSintomas').value || '',
      justificativa: document.getElementById('justificativa').value || '',
      exames: document.getElementById('exames').value || '',
      medico: document.getElementById('medicoSolicitante').value || 'LUCIDIO JACOME FERREIRA FILHO',
      crm: document.getElementById('crmSolicitante').value || '1675-RN',
      cnes: document.getElementById('cnesHospital').value || '2408371',
      hospital: 'HOSPITAL MATERNIDADE SEVERINA CARLOS DE ANDRADE'
    };

    const print = (page, text, x, y, size, isBold) => {
      if (!text) return;
      page.drawText(String(text).toUpperCase(), {
        x: x,
        y: y,
        size: size || 7.5,
        font: isBold ? fontBold : fontRegular,
        color: rgb(0, 0, 0)
      });
    };

    /* =========================================================
       GUIA 1: AUTORIZAÇÃO PARA INTERNAÇÃO HOSPITALAR
       ========================================================= */
    // Topo Administrativo
    print(pag1, d.dataInternacao, 115, 680, 8, false);
    print(pag1, d.prontuario, 335, 680, 8.5, true);
    print(pag1, d.dataSaida, 485, 665, 8, false);

    // Bloco: Dados do Paciente
    print(pag1, d.nome, 125, 616, 8, true);
    print(pag1, d.sexo, 55, 600, 7.5, false);
    print(pag1, d.dataNasc, 225, 600, 7.5, false);
    print(pag1, d.cns, 395, 600, 8, false);

    print(pag1, d.nomeMae, 95, 584, 7.5, false);
    print(pag1, d.endereco, 80, 568, 7.5, false);
    print(pag1, d.municipio, 85, 552, 7.5, false);
    print(pag1, d.telefone, 430, 552, 7.5, false);

    // Bloco: Procedimento e Diagnóstico
    print(pag1, d.procedimento, 140, 494, 7, false);
    print(pag1, d.cidPrincipal, 85, 438, 8.5, true);
    print(pag1, d.medico, 115, 392, 7.5, false);

    // Grade Procedimentos Realizados (Linha 1)
    print(pag1, d.procedimento.substring(0, 36), 65, 325, 6.5, false);
    print(pag1, "01", 240, 325, 7.5, false);
    print(pag1, d.cnes, 380, 325, 7.5, false);


    /* =========================================================
       GUIA 2: LAUDO MÉDICO DE SOLICITAÇÃO (52 CAMPOS)
       ========================================================= */
    // 1 e 2 - Estabelecimento Solicitante
    print(pag2, d.hospital, 45, 585, 7, true);
    print(pag2, d.cnes, 380, 585, 7.5, false);

    // 3 e 4 - Estabelecimento Executante
    print(pag2, d.hospital, 45, 560, 7, true);
    print(pag2, d.cnes, 380, 560, 7.5, false);

    // 5, 6 e 7 - Paciente, Prontuário e CNS
    print(pag2, d.nome, 45, 528, 8, true);
    print(pag2, d.prontuario, 300, 528, 8, true);
    print(pag2, d.cns, 415, 528, 8, false);

    // 8, 9, 10, 11 e 12 - Nascimento, Sexo, Raça, Mãe, Telefone
    print(pag2, d.dataNasc, 45, 498, 7.5, false);
    if (d.sexo === 'M') {
      print(pag2, "X", 137, 498, 8.5, true);
    } else {
      print(pag2, "X", 175, 498, 8.5, true);
    }
    print(pag2, d.racaCor, 230, 498, 7.5, false);
    print(pag2, d.nomeMae, 45, 470, 7.5, false);
    print(pag2, d.telefone, 415, 470, 7.5, false);

    // 15, 16 e 18 - Endereço e Município
    print(pag2, d.endereco, 45, 442, 7.5, false);
    print(pag2, d.municipio, 45, 414, 7.5, false);
    print(pag2, "RN", 535, 414, 7.5, false);

    // 20, 21 e 22 - Justificativa da Internação
    print(pag2, d.sinais.substring(0, 115), 45, 380, 6.8, false);
    if (d.sinais.length > 115) print(pag2, d.sinais.substring(115, 230), 45, 370, 6.8, false);

    print(pag2, d.justificativa.substring(0, 115), 45, 342, 6.8, false);
    if (d.justificativa.length > 115) print(pag2, d.justificativa.substring(115, 230), 45, 332, 6.8, false);

    print(pag2, d.exames.substring(0, 115), 45, 304, 6.8, false);
    if (d.exames.length > 115) print(pag2, d.exames.substring(115, 230), 45, 294, 6.8, false);

    // 23 e 24 - Diagnóstico e CID
    print(pag2, d.diagInicial, 45, 268, 7.5, false);
    print(pag2, d.cidPrincipal, 345, 268, 8.5, true);

    // 27 e 28 - Procedimento e Código SIGTAP
    print(pag2, d.procedimento, 45, 232, 7, false);
    print(pag2, d.codProcedimento, 435, 232, 8, true);

    // 33, 34 e 35 - Médico Solicitante, Data e CRM
    print(pag2, d.medico, 45, 176, 7.5, true);
    print(pag2, d.dataInternacao, 350, 176, 7.5, false);
    print(pag2, d.crm, 460, 176, 7.5, false);


    /* =========================================================
       GUIA 3: PRONTUÁRIO DE INTERNAÇÃO
       ========================================================= */
    print(pag3, d.nome, 105, 646, 8, true);
    print(pag3, d.prontuario, 480, 646, 8.5, true);
    print(pag3, d.endereco, 95, 626, 7.5, false);
    print(pag3, d.municipio, 95, 608, 7.5, false);
    print(pag3, "RN", 380, 608, 7.5, false);
    print(pag3, d.dataNasc, 110, 590, 7.5, false);
    print(pag3, d.racaCor, 260, 590, 7.5, false);
    print(pag3, d.sexo, 360, 590, 7.5, false);
    print(pag3, d.nomeMae, 95, 572, 7.5, false);
    print(pag3, d.dataInternacao, 110, 536, 8, false);
    print(pag3, d.dataSaida, 260, 536, 8, false);
    print(pag3, d.diagInicial, 110, 501, 7.5, true);

    const textoProntuario = `${d.sinais} ${d.justificativa}`;
    print(pag3, textoProntuario.substring(0, 110), 45, 450, 7, false);
    if (textoProntuario.length > 110) print(pag3, textoProntuario.substring(110, 220), 45, 438, 7, false);

    /* Finalização */
    pdfBytesGerado = await pdfDoc.save();
    const blob = new Blob([pdfBytesGerado], { type: 'application/pdf' });
    if (pdfBlobUrl) URL.revokeObjectURL(pdfBlobUrl);
    pdfBlobUrl = URL.createObjectURL(blob);

    document.getElementById('pdfFrame').src = pdfBlobUrl;
    document.getElementById('modalVisualizacao').style.display = 'flex';

    const btnDown = document.getElementById('btnDownload');
    btnDown.onclick = () => {
      const a = document.createElement('a');
      a.href = pdfBlobUrl;
      a.download = `AIH_${d.prontuario}_${d.nome.replace(/\s+/g, '_')}.pdf`;
      a.click();
    };
  }

  function fecharModal() {
    document.getElementById('modalVisualizacao').style.display = 'none';
  }

  function imprimirPdf() {
    const frame = document.getElementById('pdfFrame');
    if (frame && frame.contentWindow) {
      frame.contentWindow.focus();
      frame.contentWindow.print();
    }
  }
</script>
</body>
</html>
