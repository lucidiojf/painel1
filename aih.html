<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emissão AIH Oficial — A4 (PDF &amp; DOCX)</title>
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --success: #16a34a;
      --success-hover: #15803d;
      --word: #1d4ed8;
      --word-hover: #1e40af;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text: #1e293b;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 14px; line-height: 1.45; }
    .container { max-width: 1000px; margin: 0 auto; background: var(--card-bg); border-radius: 10px; box-shadow: 0 4px 10px -1px rgb(0 0 0 / 0.1); padding: 18px; }
    
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
    h1 { font-size: 1.3rem; color: #0f172a; }
    
    .nav-bar { display: flex; align-items: center; justify-content: space-between; background: #e0f2fe; padding: 10px 14px; border-radius: 8px; margin-bottom: 18px; gap: 10px; flex-wrap: wrap; }
    .nav-group { display: flex; align-items: center; gap: 6px; }
    .btn-nav { background: var(--primary); color: white; border: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
    .btn-nav:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-nav:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-ultimo { background: var(--success); }
    .btn-ultimo:hover { background: var(--success-hover); }
    .lbl-registro { font-weight: 700; color: #0369a1; min-width: 72px; text-align: center; font-size: 0.9rem; }
    
    .busca-box { display: flex; gap: 6px; flex: 1; max-width: 340px; }
    .busca-box input { padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; width: 100%; }
    
    fieldset { border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 16px; background: #fff; }
    legend { font-weight: 700; color: var(--primary); padding: 0 8px; font-size: 0.98rem; }
    .grid { display: grid; gap: 10px; }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }
    
    @media (max-width: 680px) {
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      .span-2-desktop { grid-column: span 1 !important; }
    }

    .form-group { display: flex; flex-direction: column; gap: 3px; }
    label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    input, select, textarea { border: 1px solid var(--border); padding: 8px 10px; border-radius: 6px; font-size: 0.92rem; color: #0f172a; width: 100%; background: #fff; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px #bae6fd; }
    textarea { resize: vertical; }

    .actions-bar { display: flex; gap: 10px; margin-top: 20px; align-items: center; flex-wrap: wrap; }
    .btn-action { padding: 12px 16px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; color: white; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.92rem; }
    .btn-save { background: var(--primary); }
    .btn-save:hover { background: var(--primary-hover); }
    .btn-print { background: var(--success); }
    .btn-print:hover { background: var(--success-hover); }
    .btn-word { background: var(--word); }
    .btn-word:hover { background: var(--word-hover); }
    
    #msgStatus { font-size: 0.9rem; font-weight: 600; width: 100%; margin-top: 4px; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.75); z-index: 9999; justify-content: center; align-items: center; }
    .modal-content { background: white; width: 95%; height: 92%; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #f1f5f9; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 8px; }
    .modal-body { flex: 1; }
    .modal-body iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Emissão AIH Oficial — A4 (5 Folhas Separadas)</h1>
    <button type="button" class="btn-nav" onclick="location.reload()">↻ Recarregar</button>
  </header>

  <div class="nav-bar">
    <div class="nav-group">
      <button type="button" id="btnAnt" class="btn-nav" onclick="navegarRegistro(-1)">◀</button>
      <span id="lblRegistro" class="lbl-registro">1 / 1</span>
      <button type="button" id="btnProx" class="btn-nav" onclick="navegarRegistro(1)">▶</button>
      <button type="button" class="btn-nav btn-ultimo" onclick="carregarUltimoRegistro()">Último</button>
    </div>
    <div class="busca-box">
      <input type="text" id="campoBusca" placeholder="Buscar por Nome ou Prontuário...">
      <button type="button" class="btn-nav" onclick="buscarPorTermo()">Buscar</button>
    </div>
  </div>

  <form id="formAih">
    <fieldset>
      <legend>Identificação do Paciente</legend>
      <div class="grid grid-3">
        <div class="form-group">
          <label for="prontuario">Nº Prontuário:</label>
          <input type="text" id="prontuario" required>
        </div>
        <div class="form-group">
          <label for="nomePaciente">Nome Completo:</label>
          <input type="text" id="nomePaciente" required>
        </div>
        <div class="form-group">
          <label for="cns">Cartão SUS (CNS):</label>
          <input type="text" id="cns">
        </div>
      </div>

      <div class="grid grid-4" style="margin-top: 10px;">
        <div class="form-group">
          <label for="dataNasc">Data de Nascimento:</label>
          <input type="text" id="dataNasc" placeholder="DD/MM/AAAA">
        </div>
        <div class="form-group">
          <label for="sexo">Sexo:</label>
          <select id="sexo">
            <option value="F">Feminino</option>
            <option value="M">Masculino</option>
          </select>
        </div>
        <div class="form-group">
          <label for="racaCor">Raça / Cor:</label>
          <input type="text" id="racaCor" value="PARDA">
        </div>
        <div class="form-group">
          <label for="telefone">Telefone:</label>
          <input type="text" id="telefone" value="84 99980 5728">
        </div>
      </div>

      <div class="grid grid-3" style="margin-top: 10px;">
        <div class="form-group">
          <label for="nomeMae">Nome da Mãe:</label>
          <input type="text" id="nomeMae">
        </div>
        <div class="form-group">
          <label for="nomePai">Nome do Pai:</label>
          <input type="text" id="nomePai">
        </div>
        <div class="form-group">
          <label for="profissao">Profissão:</label>
          <input type="text" id="profissao" value="AGRICULTORA">
        </div>
      </div>

      <div class="grid grid-4" style="margin-top: 10px;">
        <div class="form-group span-2-desktop" style="grid-column: span 2;">
          <label for="endereco">Endereço Completo:</label>
          <input type="text" id="endereco" value="SITIO MUMBAÇA, SN - ZONA RURAL">
        </div>
        <div class="form-group">
          <label for="numEndereco">Nº:</label>
          <input type="text" id="numEndereco" value="SN">
        </div>
        <div class="form-group">
          <label for="bairro">Bairro:</label>
          <input type="text" id="bairro" value="ZONA RURAL">
        </div>
      </div>

      <div class="grid grid-4" style="margin-top: 10px;">
        <div class="form-group">
          <label for="municipio">Município:</label>
          <input type="text" id="municipio" value="FRUTUOSO GOMES">
        </div>
        <div class="form-group">
          <label for="estado">Estado / UF:</label>
          <input type="text" id="estado" value="RN">
        </div>
        <div class="form-group">
          <label for="cep">CEP:</label>
          <input type="text" id="cep" value="59890-000">
        </div>
        <div class="form-group">
          <label for="rg">RG / Documento:</label>
          <input type="text" id="rg">
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Dados Clínicos e Internação</legend>
      <div class="grid grid-4">
        <div class="form-group">
          <label for="numAih">Número da AIH:</label>
          <input type="text" id="numAih">
        </div>
        <div class="form-group">
          <label for="dataInternacao">Data Internação:</label>
          <input type="text" id="dataInternacao" placeholder="DD/MM/AAAA">
        </div>
        <div class="form-group">
          <label for="dataSaida">Data Saída (Alta):</label>
          <input type="text" id="dataSaida" placeholder="DD/MM/AAAA">
        </div>
        <div class="form-group">
          <label for="dataSolicitacao">Data Solicitação:</label>
          <input type="text" id="dataSolicitacao" placeholder="DD/MM/AAAA">
        </div>
      </div>

      <div class="grid grid-4" style="margin-top: 10px;">
        <div class="form-group">
          <label for="diagInicial">Diagnóstico Inicial:</label>
          <input type="text" id="diagInicial">
        </div>
        <div class="form-group">
          <label for="cidPrincipal">CID-10 Principal:</label>
          <input type="text" id="cidPrincipal">
        </div>
        <div class="form-group">
          <label for="especialidade">Especialidade / Clínica:</label>
          <select id="especialidade">
            <option value="CLINICA CIRURGICA">CLINICA CIRURGICA</option>
            <option value="CLINICA MEDICA">CLINICA MEDICA</option>
            <option value="OBSTETRICIA">OBSTETRICIA</option>
            <option value="PEDIATRIA">PEDIATRIA</option>
          </select>
        </div>
        <div class="form-group">
          <label for="enfermariaLeito">Enfermaria / Leito:</label>
          <div style="display:flex; gap:6px;">
            <input type="text" id="enfermaria" value="M" placeholder="Enf.">
            <input type="text" id="leito" value="1" placeholder="Leito">
          </div>
        </div>
      </div>

      <div class="grid grid-2" style="margin-top: 10px;">
        <div class="form-group">
          <label for="procedimento">Descrição do Procedimento:</label>
          <input type="text" id="procedimento">
        </div>
        <div class="form-group">
          <label for="codProcedimento">Código SIGTAP:</label>
          <input type="text" id="codProcedimento">
        </div>
      </div>

      <div class="grid grid-2" style="margin-top: 10px;">
        <div class="form-group">
          <label for="medicoSolicitante">Nome do Solicitante:</label>
          <input type="text" id="medicoSolicitante" value="LUCIDIO JÁCOME FERREIRA">
        </div>
        <div class="form-group">
          <label for="cpfSolicitante">CPF do Solicitante:</label>
          <input type="text" id="cpfSolicitante" value="175.499.574-87">
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Laudo e Justificativa de Internação</legend>
      <div class="form-group">
        <label for="sinaisSintomas">17. Principais Sinais e Sintomas Clínicos:</label>
        <textarea id="sinaisSintomas" rows="2"></textarea>
      </div>
      <div class="form-group" style="margin-top: 10px;">
        <label for="justificativa">18. Condições que Justificam a Internação:</label>
        <textarea id="justificativa" rows="2">RISCO DE COMPLICAÇÃO</textarea>
      </div>
      <div class="form-group" style="margin-top: 10px;">
        <label for="exames">19. Principais Resultados de Provas Diagnósticas (Exames):</label>
        <textarea id="exames" rows="2"></textarea>
      </div>
    </fieldset>

    <fieldset>
      <legend>Anestesia e Relatório de Internação</legend>
      <div class="grid grid-3" style="margin-bottom: 10px;">
        <div class="form-group">
          <label for="medicoAnestesista">Médico Anestesista / CRM:</label>
          <div style="display:flex; gap:6px;">
            <input type="text" id="medicoAnestesista" value="DR HIAGO" placeholder="Nome">
            <input type="text" id="crmAnestesista" value="8.830" placeholder="CRM" style="max-width:95px;">
          </div>
        </div>
        <div class="form-group">
          <label for="tipoAnestesia">Tipo / Técnica Anestésica:</label>
          <input type="text" id="tipoAnestesia" value="LOCAL">
        </div>
        <div class="form-group">
          <label for="medicoOperador">Médico Operador:</label>
          <input type="text" id="medicoOperador" value="LUCIDIO JÁCOME FERREIRA">
        </div>
      </div>
      <div class="grid grid-2">
        <div class="form-group">
          <label for="txtAnestesia">Drogas Usadas / Prescrição Anestésica (Folha 4):</label>
          <textarea id="txtAnestesia" rows="2">LIDOCAINA A 2% - 20 ML SF - 500 ML EV</textarea>
        </div>
        <div class="form-group">
          <label for="txtCirurgia">Descrição do Boletim / Relatório (Folha 5):</label>
          <textarea id="txtCirurgia" rows="2">SEM INTERCORRÊNCIAS OPERATÓRIAS.</textarea>
        </div>
      </div>
    </fieldset>

    <div class="actions-bar">
      <button type="submit" id="btnSalvarEGerar" class="btn-action btn-save">
        💾 Salvar na Planilha e Gerar PDF + DOCX (A4)
      </button>

      <button type="button" id="btnImprimirDireto" class="btn-action btn-print" onclick="gerarPdfOficial(false)">
        🖨️ Gerar PDF A4 (5 Folhas)
      </button>

      <button type="button" id="btnGerarWord" class="btn-action btn-word" onclick="baixarDocxNativoA4()">
        📄 Baixar Word (.docx) A4 (5 Folhas)
      </button>

      <span id="msgStatus"></span>
    </div>
  </form>
</div>

<div id="modalVisualizacao" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 style="color: #0f172a;">Visualização da AIH Gerada (A4 — 5 Folhas)</h3>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button type="button" class="btn-nav btn-ultimo" onclick="imprimirPdf()">Imprimir</button>
        <button type="button" class="btn-nav" id="btnDownload">Baixar PDF</button>
        <button type="button" class="btn-nav" style="background:var(--word);" onclick="baixarDocxNativoA4()">Baixar Word (.docx)</button>
        <button type="button" class="btn-nav" style="background:#ef4444;" onclick="fecharModal()">Fechar</button>
      </div>
    </div>
    <div class="modal-body">
      <iframe id="pdfFrame"></iframe>
    </div>
  </div>
</div>

  async function carregarRegistroPorIndice(idx) {
    const msg = document.getElementById('msgStatus');
    msg.style.color = '#0284c7';
    msg.innerText = 'Carregando registro da planilha...';

    try {
      const res = await fetch(`${URL_APPS_SCRIPT}?index=${idx}`);
      const data = await res.json();

      if (data && data.sucesso && data.paciente) {
        indiceAtual = data.indiceAtual;
        totalRegistros = data.total;
        atualizarControlesNav(data.paciente);
        msg.style.color = '#16a34a';
        msg.innerText = `Registro ${indiceAtual} de ${totalRegistros} carregado.`;
      } else {
        msg.style.color = '#dc2626';
        msg.innerText = 'Nenhum registro encontrado.';
      }
    } catch (e) {
      msg.style.color = '#dc2626';
      msg.innerText = 'Erro ao consultar: ' + e.message;
    }
  }

  function navegarRegistro(delta) {
    const novoIdx = indiceAtual + delta;
    if (novoIdx >= 1 && novoIdx <= totalRegistros) {
      carregarRegistroPorIndice(novoIdx);
    }
  }

  function carregarUltimoRegistro() {
    carregarRegistroPorIndice(999999);
  }

  async function buscarPorTermo() {
    const termo = document.getElementById('campoBusca').value.trim();
    if (!termo) {
      alert('Digite o nome ou prontuário para buscar.');
      return;
    }

    const msg = document.getElementById('msgStatus');
    msg.style.color = '#0284c7';
    msg.innerText = 'Buscando...';

    try {
      const res = await fetch(`${URL_APPS_SCRIPT}?busca=${encodeURIComponent(termo)}`);
      const data = await res.json();

      if (data && data.sucesso && data.paciente) {
        indiceAtual = data.indiceAtual;
        totalRegistros = data.total;
        atualizarControlesNav(data.paciente);
        msg.style.color = '#16a34a';
        msg.innerText = `Encontrado: Registro ${indiceAtual} de ${totalRegistros}.`;
      } else {
        msg.style.color = '#dc2626';
        msg.innerText = 'Nenhum paciente encontrado com: ' + termo;
      }
    } catch (e) {
      msg.style.color = '#dc2626';
      msg.innerText = 'Erro na busca: ' + e.message;
    }
  }

  function atualizarControlesNav(p) {
    document.getElementById('lblRegistro').innerText = `${indiceAtual} / ${totalRegistros}`;
    document.getElementById('btnAnt').disabled = (indiceAtual <= 1);
    document.getElementById('btnProx').disabled = (indiceAtual >= totalRegistros);

    const endStr = (p.endereco || '').toString().toUpperCase();
    const munStr = (p.municipio || '').toString().toUpperCase();
    const deslocado = endStr.includes('SILVA') || endStr.includes('SOARES') || endStr.includes('BATISTA') || munStr.includes('SITIO') || munStr.includes('RUA') || munStr.includes('SN');

    let mae = p.mae || '';
    let endereco = p.endereco || '';
    let municipio = p.municipio || 'FRUTUOSO GOMES';
    let estado = p.estado || 'RN';
    let dtInternacao = p.dtInternacao || '';
    let dtSaida = p.dtSaida || '';
    let diag = p.diag || '';
    let cid = p.cid || '';
    let procedimento = p.procedimento || '';
    let codProced = p.codProced || '';
    let medico = p.medico || 'LUCIDIO JÁCOME FERREIRA';
    let cpfMed = p.cpfMed || '175.499.574-87';

    if (deslocado) {
      mae = p.endereco;
      endereco = p.municipio;
      municipio = (p.estado && p.estado.length > 3) ? p.estado : 'FRUTUOSO GOMES';
      estado = 'RN';
      dtInternacao = p.dtSaida || '';
      dtSaida = p.dtSaida || dtInternacao;
      diag = p.cid;
      cid = p.procedimento;
      procedimento = p.codProced;
      codProced = p.medico;
      medico = p.cpfMed || 'LUCIDIO JÁCOME FERREIRA';
      cpfMed = '175.499.574-87';
    }

    document.getElementById('numAih').value = p.numAih || '';
    document.getElementById('prontuario').value = p.prontuario || '';
    document.getElementById('nomePaciente').value = p.nome || '';
    document.getElementById('cns').value = p.cns || '';
    document.getElementById('dataNasc').value = p.nasc || '';
    document.getElementById('sexo').value = (p.sexo && p.sexo.toString().toUpperCase().startsWith('M')) ? 'M' : 'F';
    document.getElementById('racaCor').value = p.raca || 'PARDA';
    document.getElementById('telefone').value = p.telefone || '84 99980 5728';
    document.getElementById('nomeMae').value = mae;
    document.getElementById('nomePai').value = p.pai || '';
    document.getElementById('profissao').value = p.profissao || 'AGRICULTORA';

    document.getElementById('endereco').value = endereco || 'SITIO ARROJADO';
    document.getElementById('numEndereco').value = 'SN';
    document.getElementById('bairro').value = 'ZONA RURAL';
    document.getElementById('municipio').value = municipio;
    document.getElementById('estado').value = estado;
    document.getElementById('cep').value = '59890-000';
    document.getElementById('rg').value = p.rg || '';

    document.getElementById('dataInternacao').value = dtInternacao;
    document.getElementById('dataSaida').value = dtSaida;
    document.getElementById('dataSolicitacao').value = dtInternacao;

    document.getElementById('diagInicial').value = diag;
    document.getElementById('cidPrincipal').value = cid;
    document.getElementById('procedimento').value = procedimento;
    document.getElementById('codProcedimento').value = codProced;
    if (p.especialidade) document.getElementById('especialidade').value = p.especialidade;

    document.getElementById('medicoSolicitante').value = medico;
    document.getElementById('cpfSolicitante').value = cpfMed;

    if (p.sinaisSintomas) document.getElementById('sinaisSintomas').value = p.sinaisSintomas;

    if (p.exames) document.getElementById('exames').value = p.exames;
    if (p.txtAnestesia) document.getElementById('txtAnestesia').value = p.txtAnestesia;
    if (p.txtCirurgia) document.getElementById('txtCirurgia').value = p.txtCirurgia;

  document.getElementById('formAih').addEventListener('submit', async (e) => {
    e.preventDefault();

    msg.style.color = '#0284c7';

    try {
      await fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(d)
      });
      msg.style.color = '#16a34a';
      msg.innerText = 'Dados enviados para a planilha! Gerando PDF A4 e DOCX A4...';
    } catch (err) {
      console.warn('Aviso envio planilha:', err);
    }

    await baixarDocxNativoA4();
    await gerarPdfOficial(true);
  });

            leito: d.leito,
            procedimento: `${d.procedimento} ${d.codProced}`.trim(),
            codigo: d.codProced,
            solicitante: d.medico,
            medico: d.medico,
            cpf_solicitante: d.cpfMed,
            sinais: d.sinaisSintomas,
            sintomas: d.sinaisSintomas,
            justificativa: d.justificativa,
            condicoes: d.justificativa,
            exames: d.exames,
            anestesia: d.txtAnestesia,
            drogas: d.txtAnestesia,
            cirurgia: d.txtCirurgia,
            relatorio: d.txtCirurgia,
            anestesista: d.medicoAnestesista,
            crm: d.crmAnestesista
          };

          fields.forEach(field => {
            const fname = field.getName().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            try {
              if (field.constructor.name === 'PDFTextField') {
                for (const [chave, valor] of Object.entries(mapaValores)) {
                  if (fname.includes(chave) && valor) {
                    field.setText(String(valor));
                    break;
                  }
                }
              } else if (field.constructor.name === 'PDFCheckBox') {
                if ((fname.includes('masc') || fname === 'm') && d.sexo === 'M') field.check();
                if ((fname.includes('fem') || fname === 'f') && d.sexo === 'F') field.check();
              }
            } catch (errField) {}
          });

          // Garante que todas as 5 páginas estejam em tamanho A4 exato (595.28 x 841.89 pt)
          pdfDoc.getPages().forEach(pg => {
            pg.setSize(595.28, 841.89);
          });
          usouBase = true;
        }
      } catch (eBase) {
        usouBase = false;
      }

      if (!usouBase) {
        pdfDoc = await construirPdfA4DoZero(d);
      }

      pdfBytesGerado = await pdfDoc.save();
      const blob = new Blob([pdfBytesGerado], { type: 'application/pdf' });
      if (pdfBlobUrl) URL.revokeObjectURL(pdfBlobUrl);
      pdfBlobUrl = URL.createObjectURL(blob);

      document.getElementById('pdfFrame').src = pdfBlobUrl;
      document.getElementById('btnDownload').onclick = () => {
        const a = document.createElement('a');
        a.href = pdfBlobUrl;
        a.download = `AIH_${d.prontuario || 'PACIENTE'}_${d.nome.replace(/\s+/g, '_')}.pdf`;
        a.click();
      };
      document.getElementById('modalVisualizacao').style.display = 'flex';

      msg.style.color = '#16a34a';
      msg.innerText = aposSalvar
        ? 'Salvo na planilha! PDF A4 (5 folhas) e Word .docx A4 (5 folhas) prontos.'
        : 'PDF A4 (5 folhas) gerado com sucesso!';
    } catch (err) {
      msg.style.color = '#dc2626';
      msg.innerText = 'Erro ao gerar PDF: ' + err.message;
    }
  }

  async function baixarDocxNativoA4() {
    const d = coletarDadosFormulario();
    const msg = document.getElementById('msgStatus');
    msg.style.color = '#1d4ed8';
    msg.innerText = 'Montando arquivo Word (.docx) nativo em A4 (5 folhas)...';

    const xmlEsc = (s) => String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');

    const pText = (runs, align = 'left', spBefore = 0, spAfter = 20, lineRule = 240) => {
      const runsXml = runs.map(r => {
        const b = r.b ? '<w:b/>' : '';
        const sz = (r.sz || 8.5) * 2;
        const lines = xmlEsc(r.t).split('\n');
        const tXml = lines.map((ln, idx) => (idx > 0 ? '<w:br/>' : '') + `<w:t xml:space="preserve">${ln}</w:t>`).join('');
        return `<w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>${b}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/></w:rPr>${tXml}</w:r>`;
      }).join('');
      return `<w:p><w:pPr><w:jc w:val="${align}"/><w:spacing w:before="${spBefore}" w:after="${spAfter}" w:line="${lineRule}" w:lineRule="auto"/></w:pPr>${runsXml}</w:p>`;
    };

    const pageBreakXml = `<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="20" w:lineRule="exact"/></w:pPr><w:r><w:br w:type="page"/></w:r></w:p>`;

      f4Rows.push(rowXml(
        cellXml(4160, pText([{ t: item[0], b: true, sz: 8.5 }], 'left', 0, 0), 7, 'center', 45, 45) +
        cellXml(3360, pText([{ t: item[1], b: true, sz: 8.5 }], 'left', 0, 0), 6, 'center', 45, 45) +
        cellXml(3592, rightCellContent, 1, 'bottom', 45, 45, 75, 75, vMerge)
      ));
    });
    const folha4Xml = tableXml(colsF4, f4Rows.join(''));

    // =========================================================================
    // FOLHA 5: BOLETIM OPERATÓRIO (Total width = 11112 dxa)
    // =========================================================================
    const colsF5 = [3704, 3704, 3704]; // sum = 11112
    const f5Rows = [
      rowXml(cellXml(11112,
        pText([{ t: 'HOSPITAL MATERNIDADE SEVERINA CARLOS DE ANDRADE', b: true, sz: 9.5 }], 'center', 0, 10) +
        pText([{ t: 'PREFEITURA MUNICIPAL DE FRUTUOSO GOMES  |  Secretaria Municipal de Saúde', sz: 8.5 }], 'center', 0, 0), 3)),
      rowXml(cellXml(11112, pText([{ t: 'BOLETIM OPERATÓRIO', b: true, sz: 9.5 }], 'center', 10, 10), 3)),
      rowXml(
        cellXml(7408, pText([{ t: 'Nome: ', b: true, sz: 8.5 }, { t: d.nome, b: true, sz: 9 }], 'left', 0, 0), 2) +
        cellXml(3704, pText([{ t: 'Prontuário: ', b: true, sz: 8.5 }, { t: d.prontuario, b: true, sz: 9 }], 'left', 0, 0), 1)
      ),
      rowXml(cellXml(11112, pText([{ t: 'Diagnóstico Pré-Operatório: ', b: true, sz: 8.5 }, { t: d.diag, sz: 8.5 }], 'left', 0, 0), 3)),
      rowXml(cellXml(11112, pText([{ t: 'Indicação Terapêutica: ', b: true, sz: 8.5 }, { t: d.procedimento, sz: 8.5 }], 'left', 0, 0), 3)),
      rowXml(cellXml(11112, pText([{ t: 'INTERNAÇÃO', b: true, sz: 8.5 }], 'center', 5, 5), 3)),
      rowXml(
        cellXml(3704, pText([{ t: 'Inicio:', b: true, sz: 8.5 }], 'left', 0, 0)) +
        cellXml(3704, pText([{ t: 'Fim:', b: true, sz: 8.5 }], 'left', 0, 0)) +
        cellXml(3704, pText([{ t: 'Duração:', b: true, sz: 8.5 }], 'left', 0, 0))
      ),
      rowXml(cellXml(11112, pText([{ t: 'Operador: ', b: true, sz: 8.5 }, { t: d.medicoOperador, sz: 8.5 }], 'left', 0, 0), 3)),
      rowXml(cellXml(11112, pText([{ t: '1 Auxiliar:', b: true, sz: 8.5 }], 'left', 0, 0), 3)),
      rowXml(cellXml(11112, pText([{ t: '2 Auxiliar:', b: true, sz: 8.5 }], 'left', 0, 0), 3)),
      rowXml(cellXml(11112, pText([{ t: '3 Anestesista: ', b: true, sz: 8.5 }, { t: d.medicoAnestesista, sz: 8.5 }], 'left', 0, 0), 3)),
      rowXml(cellXml(11112, pText([{ t: 'RELATÓRIO DE INTERNAÇÃO', b: true, sz: 8.5 }], 'center', 5, 5), 3)),
      rowXml(cellXml(11112,
        pText([{ t: 'Via de acesso Incisão – Aspecto nos órgãos e lesões encontradas – Técnicas empregadas e descrição dos processos – Ligaduras e suturas empregadas – Drenagem curativos – Diagnósticos operatório – Prognostico operatório – OBS:', b: true, sz: 7.5 }], 'left', 10, 40) +
        pText([{ t: d.txtCirurgia, sz: 8.5 }], 'left', 0, 0), 3, 'top'), 7400),
      rowXml(
        cellXml(3704, pText([{ t: 'Data: ', b: true, sz: 8.5 }, { t: d.dtInternacao, sz: 8.5 }], 'left', 40, 20), 1) +
        cellXml(7408,
          pText([{ t: '___________________________________________', sz: 8.5 }], 'center', 40, 10) +
          pText([{ t: 'Médico Operador', b: true, sz: 8.5 }], 'center', 0, 10), 2)
      )
    ];
    const folha5Xml = tableXml(colsF5, f5Rows.join(''));

    // =========================================================================
    // MONTAGEM DO PACOTE .DOCX REAL COM TAMANHO A4 EXATO (11906 x 16838 dxa)
    // =========================================================================
    const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
            xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <w:body>
    ${folha1Xml}
    ${pageBreakXml}
    ${folha2Xml}
    ${pageBreakXml}
    ${folha3Xml}
    ${pageBreakXml}
    ${folha4Xml}
    ${pageBreakXml}
    ${folha5Xml}
    <w:sectPr>
      <w:pgSz w:w="11906" w:h="16838"/>
      <w:pgMar w:top="397" w:right="397" w:bottom="397" w:left="397" w:header="200" w:footer="200" w:gutter="0"/>
    </w:sectPr>
  </w:body>
</w:document>`;

    const contentTypesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Default Extension="png" ContentType="image/png"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`;

    const rootRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

    const docRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId10" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/logo_laudo.png"/>
  <Relationship Id="rId11" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/logo_pront.png"/>
</Relationships>`;

    const zip = new JSZip();
    zip.file('[Content_Types].xml', contentTypesXml);
    zip.folder('_rels').file('.rels', rootRelsXml);
    const wordFolder = zip.folder('word');
    wordFolder.file('document.xml', documentXml);
    wordFolder.folder('_rels').file('document.xml.rels', docRelsXml);
    const mediaFolder = wordFolder.folder('media');
    mediaFolder.file('logo_laudo.png', LOGO_LAUDO_B64, { base64: true });
    mediaFolder.file('logo_pront.png', LOGO_PRONT_B64, { base64: true });

    const docxBlob = await zip.generateAsync({
      type: 'blob',
      mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    });

    const url = URL.createObjectURL(docxBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `AIH_${d.prontuario || 'PACIENTE'}_${d.nome.replace(/\s+/g, '_') || 'DOCUMENTO'}.docx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2500);

    msg.style.color = '#1d4ed8';
    msg.innerText = 'Word (.docx) nativo em A4 gerado com 5 folhas separadas e logos oficiais!';
  }
</script>
</body>
</html>
