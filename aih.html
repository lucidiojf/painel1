<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISTEMA HM - Emissão AIH Oficial</title>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f1f5f9; margin: 0; padding: 12px; color: #1e293b; }
    .container { max-width: 950px; margin: 0 auto; background: #fff; padding: 18px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #0369a1; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
    .btn-reload { background: #64748b; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    fieldset { border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa; }
    legend { font-weight: 700; color: #0284c7; padding: 0 6px; font-size: 13px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
    .form-group { margin-bottom: 6px; }
    label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 3px; color: #475569; }
    input, select, textarea { width: 100%; padding: 7px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 12px; background: #fff; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #0284c7; }
    .btn-submit { background: #0284c7; color: #fff; border: none; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 7px; cursor: pointer; width: 100%; margin-top: 8px; }
    .btn-submit:hover { background: #0369a1; }
    #msgStatus { margin-top: 10px; font-weight: bold; text-align: center; font-size: 13px; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.75); z-index: 9999; justify-content: center; align-items: center; padding: 8px; }
    .modal-content { background: #fff; width: 100%; max-width: 950px; height: 95vh; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { background: #0284c7; color: #fff; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { margin: 0; font-size: 15px; }
    .modal-body { flex: 1; background: #525659; }
    .modal-body iframe { width: 100%; height: 100%; border: none; }
    .modal-footer { padding: 8px 14px; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 8px; }
    .btn-modal { padding: 7px 14px; border-radius: 5px; font-weight: 600; font-size: 12px; cursor: pointer; border: none; }
    .btn-close { background: #e2e8f0; color: #334155; }
    .btn-print { background: #16a34a; color: #fff; }
    .btn-download { background: #0284c7; color: #fff; }
  </style>
</head>
<body>

<div class="container">
  <h2>
    <span>Emissão AIH Oficial (Com Sheets)</span>
    <button type="button" class="btn-reload" onclick="location.reload(true)">↻ Recarregar</button>
  </h2>

  <form id="formAih">
    <fieldset>
      <legend>Identificação do Paciente</legend>
      <div class="grid-3">
        <div class="form-group">
          <label>Nº Prontuário:</label>
          <input type="text" id="prontuario" value="7521" required>
        </div>
        <div class="form-group">
          <label>Nome Completo:</label>
          <input type="text" id="nomePaciente" value="MARIA IRIS PEREIRA DA SILVA" required>
        </div>
        <div class="form-group">
          <label>Cartão SUS (CNS):</label>
          <input type="text" id="cns" value="704006647751551">
        </div>
      </div>
      <div class="grid-4">
        <div class="form-group">
          <label>Data de Nascimento:</label>
          <input type="text" id="dataNasc" value="10/12/1960">
        </div>
        <div class="form-group">
          <label>Sexo:</label>
          <select id="sexo">
            <option value="F" selected>Feminino</option>
            <option value="M">Masculino</option>
          </select>
        </div>
        <div class="form-group">
          <label>Raça / Cor:</label>
          <input type="text" id="racaCor" value="PARDA">
        </div>
        <div class="form-group">
          <label>Telefone:</label>
          <input type="text" id="telefone" value="84 99980 5728">
        </div>
      </div>
      <div class="grid-3">
        <div class="form-group">
          <label>Nome da Mãe:</label>
          <input type="text" id="nomeMae" value="OLIVIA BATISTA">
        </div>
        <div class="form-group">
          <label>Nome do Pai:</label>
          <input type="text" id="nomePai" value="FRANCISCO PEREIRA">
        </div>
        <div class="form-group">
          <label>Profissão:</label>
          <input type="text" id="profissao" value="AGRICULTORA">
        </div>
      </div>
      <div class="grid-4">
        <div class="form-group">
          <label>Endereço Completo:</label>
          <input type="text" id="endereco" value="SITIO ARROJADO">
        </div>
        <div class="form-group">
          <label>Nº:</label>
          <input type="text" id="numEndereco" value="SN">
        </div>
        <div class="form-group">
          <label>Bairro:</label>
          <input type="text" id="bairro" value="ZONA RURAL">
        </div>
        <div class="form-group">
          <label>Município:</label>
          <input type="text" id="municipio" value="FRUTUOSO GOMES">
        </div>
      </div>
      <div class="grid-4">
        <div class="form-group">
          <label>Estado / UF:</label>
          <input type="text" id="estado" value="RN">
        </div>
        <div class="form-group">
          <label>CEP:</label>
          <input type="text" id="cep" value="59890-000">
        </div>
        <div class="form-group">
          <label>RG / Documento:</label>
          <input type="text" id="rg" value="1234567">
        </div>
        <div class="form-group">
          <label>CPF do Paciente:</label>
          <input type="text" id="cpfPac" value="000.000.000-00">
        </div>
      </div>
      <div class="grid-4">
        <div class="form-group">
          <label>Data Internação:</label>
          <input type="text" id="dataInternacao" value="14/07/2026">
        </div>
        <div class="form-group">
          <label>Data Saída (Alta):</label>
          <input type="text" id="dataSaida" value="14/07/2026">
        </div>
        <div class="form-group">
          <label>Diagnóstico Inicial:</label>
          <input type="text" id="diagInicial" value="NEVO MELANOCÍTICO, NÃO ESPECIFICADO">
        </div>
        <div class="form-group">
          <label>CID-10 Principal:</label>
          <input type="text" id="cidPrincipal" value="D22.9">
        </div>
      </div>
      <div class="grid-3">
        <div class="form-group">
          <label>Procedimento Solicitado:</label>
          <input type="text" id="procedimento" value="EXCISAO E SUTURA DE LESAO DE PELE">
        </div>
        <div class="form-group">
          <label>Código SIGTAP:</label>
          <input type="text" id="codProcedimento" value="0401020045">
        </div>
        <div class="form-group">
          <label>Especialidade / Clínica:</label>
          <input type="text" id="especialidade" value="CIRURGIA AMBULATORIAL">
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Dados Clínicos / Justificativa</legend>
      <div class="form-group">
        <label>17. Principais Sinais e Sintomas Clínicos:</label>
        <textarea id="sinaisSintomas" rows="2">LESÃO HIPERCRÔMICA EM REGIÃO DORSAL, COM PRURIDO E ALTERAÇÃO DE BORDOS.</textarea>
      </div>
      <div class="form-group">
        <label>18. Condições que Justificam a Internação:</label>
        <textarea id="justificativa" rows="2">NECESSIDADE DE RESSECÇÃO CIRÚRGICA COM MARGEM DE SEGURANÇA E ESTUDO HISTOPATOLÓGICO.</textarea>
      </div>
      <div class="form-group">
        <label>19. Principais Resultados de Exames:</label>
        <textarea id="exames" rows="2">EXAME CLÍNICO DERMATOLÓGICO COMPATÍVEL.</textarea>
      </div>
    </fieldset>

    <fieldset>
      <legend>Identificação do Médico e Hospital</legend>
      <div class="grid-3">
        <div class="form-group">
          <label>Médico Solicitante:</label>
          <input type="text" id="medicoSolicitante" value="DR LUCIDIO JACOME FERREIRA">
        </div>
        <div class="form-group">
          <label>CPF do Solicitante:</label>
          <input type="text" id="cpfSolicitante" value="175.499.574-87">
        </div>
        <div class="form-group">
          <label>Data Solicitação:</label>
          <input type="text" id="dataSolicitacao" value="14/07/2026">
        </div>
      </div>
    </fieldset>

    <button type="submit" class="btn-submit">Gerar AIH e Salvar no Sheets</button>
    <div id="msgStatus"></div>
  </form>
</div>

<div id="modalVisualizacao" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Visualização da AIH Gerada</h3>
      <button class="btn-modal btn-close" onclick="fecharModal()">✕</button>
    </div>
    <div class="modal-body">
      <iframe id="pdfFrame"></iframe>
    </div>
    <div class="modal-footer">
      <button class="btn-modal btn-close" onclick="fecharModal()">Fechar</button>
      <button class="btn-modal btn-print" onclick="imprimirPdf()">Imprimir</button>
      <button class="btn-modal btn-download" id="btnDownload">Baixar PDF</button>
    </div>
  </div>
</div>

<script>
  const URL_PDF_BASE = 'AIH%20JOT.pdf?cache=' + Date.now();

  // COLE AQUI A URL DO SEU GOOGLE APPS SCRIPT WEB APP (ex: https://script.google.com/macros/s/.../exec)
  const URL_APPS_SCRIPT = '';

  let pdfBytesGerado = null;
  let pdfBlobUrl = null;

  document.getElementById('formAih').addEventListener('submit', async function(e) {
    e.preventDefault();
    const msg = document.getElementById('msgStatus');
    msg.style.color = '#0284c7';
    msg.innerText = 'Processando documento e salvando dados...';

    try {
      await gerarAihFormPdf();
      msg.innerText = 'Concluído com sucesso!';
    } catch (err) {
      console.error(err);
      msg.style.color = '#dc2626';
      msg.innerText = 'Erro: ' + err.message;
    }
  });

  async function gerarAihFormPdf() {
    const { PDFDocument } = PDFLib;

    const res = await fetch(URL_PDF_BASE);
    if (!res.ok) throw new Error('Não foi possível carregar o arquivo PDF base AIH JOT.pdf.');
    const buffer = await res.arrayBuffer();

    const pdfDoc = await PDFDocument.load(buffer);
    const form = pdfDoc.getForm();

    const d = {
      prontuario: document.getElementById('prontuario').value || '',
      nome: document.getElementById('nomePaciente').value || '',
      cns: document.getElementById('cns').value || '',
      nasc: document.getElementById('dataNasc').value || '',
      sexo: document.getElementById('sexo').value || 'F',
      raca: document.getElementById('racaCor').value || 'PARDA',
      tel: document.getElementById('telefone').value || '',
      mae: document.getElementById('nomeMae').value || '',
      pai: document.getElementById('nomePai').value || '',
      profissao: document.getElementById('profissao').value || 'AGRICULTORA',
      endereco: document.getElementById('endereco').value || '',
      num: document.getElementById('numEndereco').value || 'SN',
      bairro: document.getElementById('bairro').value || 'ZONA RURAL',
      municipio: document.getElementById('municipio').value || 'FRUTUOSO GOMES',
      estado: document.getElementById('estado').value || 'RN',
      cep: document.getElementById('cep').value || '59890-000',
      rg: document.getElementById('rg').value || '',
      cpfPac: document.getElementById('cpfPac').value || '',
      dtInternacao: document.getElementById('dataInternacao').value || '',
      dtSaida: document.getElementById('dataSaida').value || '',
      diag: document.getElementById('diagInicial').value || '',
      cid: document.getElementById('cidPrincipal').value || '',
      procedimento: document.getElementById('procedimento').value || '',
      codProced: document.getElementById('codProcedimento').value || '',
      especialidade: document.getElementById('especialidade').value || 'CIRURGIA AMBULATORIAL',
      medico: document.getElementById('medicoSolicitante').value || 'DR LUCIDIO JACOME FERREIRA',
      cpfMed: document.getElementById('cpfSolicitante').value || '175.499.574-87',
      dtSol: document.getElementById('dataSolicitacao').value || '',
      sinais: document.getElementById('sinaisSintomas').value || '',
      justificativa: document.getElementById('justificativa').value || '',
      exames: document.getElementById('exames').value || ''
    };

    // Função de injeção direta no Adobe
    const setCampo = (nomesPossiveis, valor) => {
      if (valor === undefined || valor === null) return;
      const texto = String(valor).toUpperCase();
      const lista = Array.isArray(nomesPossiveis) ? nomesPossiveis : [nomesPossiveis];

      for (const n of lista) {
        try {
          const field = form.getTextField(n);
          if (field) field.setText(texto);
        } catch (e) {}
      }
    };

    const marcarCheck = (nomesPossiveis) => {
      const lista = Array.isArray(nomesPossiveis) ? nomesPossiveis : [nomesPossiveis];
      for (const n of lista) {
        try {
          const cb = form.getCheckBox(n);
          if (cb) cb.check();
        } catch (e) {}
      }
    };

    // Preenchimento de todas as ocorrências
    setCampo(['Prontuario', 'Prontuario#0', 'Prontuario#1', 'Prontuario#2', 'Prontuario#4'], d.prontuario);
    setCampo(['NOME', 'NOME#0', 'NOME#1', 'NOME#2', 'NOME#4', 'Nome'], d.nome);
    setCampo(['SUS', 'SUS#0', 'SUS#1'], d.cns);
    setCampo(['DN', 'DN#0', 'DN#1', 'DN#2'], d.nasc);
    setCampo(['SEXO', 'SEXO#0', 'SEXO#1', 'SEXO#2'], d.sexo);
    setCampo(['COR', 'COR#0', 'COR#1', 'COR#2'], d.raca);
    setCampo(['TELEFONE', 'TELEFONE#0', 'TELEFONE#1'], d.tel);
    setCampo(['MAE', 'MAE#0', 'MAE#1', 'MAE#2'], d.mae);
    setCampo(['PAI'], d.pai);
    setCampo(['PROFISSAO'], d.profissao);
    setCampo(['ENDEREÇO', 'ENDEREÇO#0', 'ENDEREÇO#1', 'ENDEREÇO#2'], d.endereco);
    setCampo(['N°', 'N°#0', 'N°#1'], d.num);
    setCampo(['BAIRRO', 'BAIRRO#0'], d.bairro);
    setCampo(['MUNICIPIO', 'MUNICIPIO#0', 'MUNICIPIO#1', 'MUNICIPIO#2', 'NATURALIDADE'], d.municipio);
    setCampo(['ESTADO', 'ESTADO#0', '15. UF'], d.estado);
    setCampo(['CEP', 'CEP#0', '16. CEP'], d.cep);
    setCampo(['N° DOC', 'RG'], d.rg);
    setCampo(['CPF PAC'], d.cpfPac);

    setCampo(['DT INTERN', 'DT INTERN#0', 'DT INTERN#1', 'Data de Admissão:'], d.dtInternacao);
    setCampo(['DT SAIDA', 'Alta:'], d.dtSaida);
    setCampo(['PROCED SOLIC', 'PROCED SOLIC#0', 'PROCED REALIZ', 'PROCED SOLIC#1'], d.codProced);
    setCampo(['MUD PROC'], 'N');
    setCampo(['ESPECIALIDADE', 'ESPECIALIDADE#0', 'ESPECIALIDADE#2'], d.especialidade);
    setCampo(['CID PRINC', 'CID PRINC#0', '21. CID 10 Principal'], d.cid);
    setCampo(['ENFERM', 'ENFERM#0'], 'M');
    setCampo(['LEITO', 'LEITO#0'], '1');
    setCampo(['MOT SAIDA'], 'ALTA');
    setCampo(['CPF SOL', 'CPF SOL#0', 'CPF MED SOL'], d.cpfMed);
    setCampo(['DATA AUTZ'], d.dtInternacao);
    setCampo(['NOME MED'], d.medico);
    setCampo(['DIAGN PRE OPERAT', 'Diagnóstico Inicial:', 'Diagnóstico Final:', '20. Diagnostico Inicial'], d.diag);
    setCampo(['DT CIR', 'DT EXPED'], d.dtInternacao);

    setCampo(['17. Principais Sinais e Sintomas Clinicos'], d.sinais);
    setCampo(['18. Condições que Justificam a Internação'], d.justificativa);
    setCampo(['19. Principais Resultados de Provas Diagnosticas (Resultado de Exames Realizados)'], d.exames);
    setCampo(['Sumário de História Clínica, Exame Físico e Tratamento'], `${d.sinais} ${d.justificativa}`);

    marcarCheck(['Check Box2#0', 'Check Box2', 'Check Box3', 'RG', 'Check Box13']);

    // O PULO DO GATO: Estampa e fixa todos os textos nas páginas para nunca saírem em branco
    form.flatten();

    // Envio para o Google Sheets (se a URL estiver configurada)
    if (URL_APPS_SCRIPT) {
      fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(d)
      }).catch(err => console.warn('Erro ao salvar no Sheets:', err));
    }

    pdfBytesGerado = await pdfDoc.save();
    const blob = new Blob([pdfBytesGerado], { type: 'application/pdf' });
    if (pdfBlobUrl) URL.revokeObjectURL(pdfBlobUrl);
    pdfBlobUrl = URL.createObjectURL(blob);

    document.getElementById('pdfFrame').src = pdfBlobUrl;
    document.getElementById('modalVisualizacao').style.display = 'flex';

    const btnDown = document.getElementById('btnDownload');
    btnDown.onclick = () => {
      const a = document.createElement('a');
      a.href = pdfBlobUrl;
      a.download = `AIH_${d.prontuario}_${d.nome.replace(/\s+/g, '_')}.pdf`;
      a.click();
    };
  }

  function fecharModal() {
    document.getElementById('modalVisualizacao').style.display = 'none';
  }

  function imprimirPdf() {
    const frame = document.getElementById('pdfFrame');
    if (frame && frame.contentWindow) {
      frame.contentWindow.focus();
      frame.contentWindow.print();
    }
  }
</script>
</body>
</html>
