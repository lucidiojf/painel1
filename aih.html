<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de AIH - Autorização de Internação Hospitalar</title>
    <style>
        :root {
            --primary-color: #003366;
            --border-color: #000;
            --bg-light: #f9f9f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #eef2f5;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 950px;
            background: #fff;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Barra de Ações (Oculta na impressão) */
        .action-bar {
            background: var(--primary-color);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .action-bar h2 {
            color: #fff;
            font-size: 1.2rem;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-group button {
            background: #fff;
            color: var(--primary-color);
            border: none;
            padding: 8px 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 11px;
        }

        .btn-group button:hover {
            background: #f0f0f0;
        }

        .btn-clear {
            background: #d9534f !important;
            color: #fff !important;
        }

        .btn-clear:hover {
            background: #c9302c !important;
        }

        /* Estrutura do Formulário AIH */
        .aih-form {
            border: 2px solid var(--border-color);
            font-size: 11px;
            background: #fff;
        }

        .aih-section-title {
            text-align: center;
            font-weight: bold;
            background: #e0e0e0;
            padding: 6px;
            font-size: 12px;
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
        }

        .aih-sub-title {
            background: #f0f0f0;
            font-size: 11px;
            font-weight: bold;
            text-align: left;
            padding: 5px;
            border-bottom: 1px solid var(--border-color);
            border-top: 1px solid var(--border-color);
        }

        .aih-row {
            display: flex;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border-color);
        }

        .aih-row:last-child {
            border-bottom: none;
        }

        .field-group {
            padding: 5px;
            border-right: 1px solid var(--border-color);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .field-group:last-child {
            border-right: none;
        }

        .field-group label {
            font-weight: bold;
            font-size: 9px;
            color: #444;
            margin-bottom: 3px;
            text-transform: uppercase;
        }

        .field-group input, .field-group select, .field-group textarea {
            border: none;
            border-bottom: 1px dotted #888;
            padding: 3px;
            font-size: 11px;
            outline: none;
            background: transparent;
            resize: vertical;
        }

        .field-group input:focus, .field-group select:focus, .field-group textarea:focus {
            background: var(--bg-light);
            border-bottom: 1px solid var(--primary-color);
        }

        /* Estilos de Impressão */
        @media print {
            body {
                background: #fff;
                padding: 0;
            }
            .action-bar {
                display: none;
            }
            .container {
                border: none;
                box-shadow: none;
                max-width: 100%;
                padding: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Barra de Controles -->
        <div class="action-bar">
            <h2>Módulo AIH - Auto-save Ativo</h2>
            <div class="btn-group">
                <button onclick="window.print()">🖨️ Imprimir / PDF</button>
                <button onclick="exportarWord()">📄 Baixar Word</button>
                <button class="btn-clear" onclick="limparFormulario()">🗑️ Novo / Limpar</button>
            </div>
        </div>

        <!-- Formulário AIH -->
        <div class="aih-form">
            <div class="aih-section-title">
                MINISTÉRIO DA SAÚDE - SISTEMA ÚNICO DE SAÚDE<br>
                AUTORIZAÇÃO DE INTERNAÇÃO HOSPITALAR (AIH)
            </div>

            <!-- Bloco Cabeçalho: Órgão Emissor e Estabelecimento -->
            <div class="aih-row">
                <div class="field-group" style="flex: 2;">
                    <label>1. Órgão Emissor (UF/Municipal)</label>
                    <input type="text" id="orgaoEmissor" placeholder="Ex: SES-RN">
                </div>
                <div class="field-group" style="flex: 2;">
                    <label>2. Nome do Estabelecimento de Saúde</label>
                    <input type="text" id="nomeEstabelecimento" placeholder="Nome do Hospital">
                </div>
                <div class="field-group" style="flex: 1;">
                    <label>3. CNES</label>
                    <input type="text" id="cnes" placeholder="CNES">
                </div>
            </div>

            <!-- Bloco Tipo de Guia e Datas -->
            <div class="aih-row">
                <div class="field-group" style="flex: 1;">
                    <label>4. Tipo de AIH</label>
                    <input type="text" id="tipoAih" value="1 - Normal">
                </div>
                <div class="field-group" style="flex: 1;">
                    <label>5. Nº da AIH Anterior</label>
                    <input type="text" id="aihAnterior" placeholder="Se aplicável">
                </div>
                <div class="field-group" style="flex: 1;">
                    <label>6. Data da Emissão</label>
                    <input type="date" id="dataEmissao">
                </div>
            </div>

            <!-- SEÇÃO I: IDENTIFICAÇÃO DO PACIENTE -->
            <div class="aih-sub-title">
                I - IDENTIFICAÇÃO DO PACIENTE
            </div>

            <!-- Nome e Prontuário -->
            <div class="aih-row">
                <div class="field-group" style="flex: 3;">
                    <label>7. Nome do Paciente</label>
                    <input type="text" id="nomePaciente" placeholder="Nome completo do paciente">
                </div>
                <div class="field-group" style="flex: 1;">
                    <label>8. Prontuário</label>
                    <input type="text" id="prontuario" placeholder="Nº Prontuário">
                </div>
            </div>

            <!-- CNS, Nascimento e Sexo -->
            <div class="aih-row">
                <div class="field-group" style="flex: 2;">
                    <label>9. Cartão Nacional de Saúde (CNS / SUS)</label>
                    <input type="text" id="cnsPaciente" placeholder="Nº do Cartão SUS">
                </div>
                <div class="field-group" style="flex: 1;">
                    <label>10. Data de Nascimento</label>
                    <input type="date" id="nascimentoPaciente">
                </div>
                <div class="field-group" style="flex: 1;">
                    <label>11. Sexo</label>
                    <select id="sexoPaciente">
                        <option value="">Selecione</option>
                        <option value="M">Masculino</option>
                        <option value="F">Feminino</option>
                        <option value="I">Indeterminado</option>
                    </select>
                </div>
            </div>

            <!-- Endereço Completo -->
            <div class="aih-row">
                <div class="field-group" style="flex: 3;">
                    <label>12. Endereço (Logradouro, Nº, Complemento)</label>
                    <input type="text" id="enderecoPaciente" placeholder="Rua, Avenida, Número">
                </div>
                <div class="field-group" style="flex: 2;">
                    <label>13. Bairro</label>
                    <input type="text" id="bairroPaciente" placeholder="Bairro">
                </div>
            </div>

            <div class="aih-row">
                <div class="field-group" style="flex: 2;">
                    <label>14. Município de Residência</label>
                    <input type="text" id="municipioPaciente" placeholder="Município">
                </div>
                <div class="field-group" style="flex: 1;">
                    <label>15. Código IBGE / UF</label>
                    <input type="text" id="ufPaciente" placeholder="RN">
                </div>
                <div class="field-group" style="flex: 1;">
                    <label>16. CEP</label>
                    <input type="text" id="cepPaciente" placeholder="00000-000">
                </div>
            </div>

            <!-- SEÇÃO II: PROCEDIMENTOS E DIAGNÓSTICOS -->
            <div class="aih-sub-title">
                II - PROCEDIMENTOS E DIAGNÓSTICOS
            </div>

            <!-- Procedimento Solicitado -->
            <div class="aih-row">
                <div class="field-group" style="flex: 3;">
                    <label>17. Procedimento Principal Solicitado (Nome)</label>
                    <input type="text" id="nomeProcSolicitado" placeholder="Ex: Parto Cesáreo / Cirurgia Geral">
                </div>
                <div class="field-group" style="flex: 1;">
                    <label>18. Código SIGTAP (Solicitado)</label>
                    <input type="text" id="codProcSolicitado" placeholder="00.00.00.000-0">
                </div>
            </div>

            <!-- Diagnósticos (CIDs) -->
            <div class="aih-row">
                <div class="field-group" style="flex: 1;">
                    <label>19. CID-10 Principal</label>
                    <input type="text" id="cidPrincipal" placeholder="Ex: O80.0">
                </div>
                <div class="field-group" style="flex: 1;">
                    <label>20. CID-10 Secundário (Associado)</label>
                    <input type="text" id="cidSecundario" placeholder="Opcional">
                </div>
                <div class="field-group" style="flex: 1;">
                    <label>21. CID-10 Causas Externas</label>
                    <input type="text" id="cidCausasExternas" placeholder="Se aplicável">
                </div>
            </div>

            <!-- SEÇÃO III: JUSTIFICATIVA DA INTERNAÇÃO / HISTÓRICO CLÍNICO -->
            <div class="aih-sub-title">
                III - JUSTIFICATIVA DA INTERNAÇÃO / HISTÓRICO CLÍNICO
            </div>

            <div class="aih-row">
                <div class="field-group" style="flex: 1;">
                    <label>22. Resumo da História Clínica, Sinais e Sintomas Principais</label>
                    <textarea id="historicoClinico" rows="4" placeholder="Descreva o quadro clínico atual, exames relevantes e a motivação para a internação hospitalar..."></textarea>
                </div>
            </div>

            <!-- SEÇÃO IV: PROFISSIONAL SOLICITANTE -->
            <div class="aih-sub-title">
                IV - IDENTIFICAÇÃO DO PROFISSIONAL SOLICITANTE
            </div>

            <div class="aih-row">
                <div class="field-group" style="flex: 3;">
                    <label>23. Nome do Profissional Solicitante</label>
                    <input type="text" id="nomeMedico" placeholder="Nome completo do médico">
                </div>
                <div class="field-group" style="flex: 1;">
                    <label>24. Conselho (Ex: CRM)</label>
                    <input type="text" id="conselhoMedico" value="CRM">
                </div>
                <div class="field-group" style="flex: 1;">
                    <label>25. Nº do Registro / CRM</label>
                    <input type="text" id="crmMedico" placeholder="Nº do CRM/UF">
                </div>
            </div>

            <div class="aih-row">
                <div class="field-group" style="flex: 2;">
                    <label>26. CPF do Profissional Solicitante</label>
                    <input type="text" id="cpfMedico" placeholder="000.000.000-00">
                </div>
                <div class="field-group" style="flex: 2;">
                    <label>27. Data da Solicitação</label>
                    <input type="date" id="dataSolicitacao">
                </div>
            </div>
        </div>
    </div>

    <script>
        // Função para salvar automaticamente os dados no localStorage
        function salvarDados() {
            const campos = document.querySelectorAll('.aih-form input, .aih-form select, .aih-form textarea');
            const dados = {};
            campos.forEach(campo => {
                if (campo.id) {
                    dados[campo.id] = campo.value;
                }
            });
            localStorage.setItem('aih_dados_form', JSON.stringify(dados));
        }

        // Função para carregar os dados salvos ao abrir a página
        function carregarDados() {
            const salvos = localStorage.getItem('aih_dados_form');
            if (salvos) {
                const dados = JSON.parse(salvos);
                for (const id in dados) {
                    const campo = document.getElementById(id);
                    if (campo) {
                        campo.value = dados[id];
                    }
                }
            }
        }

        // Função para limpar o formulário e o armazenamento local
        function limparFormulario() {
            if (confirm('Deseja realmente limpar todos os campos e iniciar um novo atendimento?')) {
                localStorage.removeItem('aih_dados_form');
                const campos = document.querySelectorAll('.aih-form input, .aih-form select, .aih-form textarea');
                campos.forEach(campo => {
                    if (campo.id !== 'conselhoMedico' && campo.id !== 'tipoAih') {
                        campo.value = '';
                    }
                });
            }
        }

        // Adiciona ouvintes de eventos para salvar a cada alteração em tempo real
        document.addEventListener('DOMContentLoaded', () => {
            carregarDados();
            const campos = document.querySelectorAll('.aih-form input, .aih-form select, .aih-form textarea');
            campos.forEach(campo => {
                campo.addEventListener('input', salvarDados);
                campo.addEventListener('change', salvarDados);
            });
        });

        // Função de exportação para Word (.doc)
        function exportarWord() {
            const conteudoHTML = document.querySelector('.aih-form').outerHTML;
            const cabecalho = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>AIH</title><style>body { font-family: Arial, sans-serif; font-size: 11px; }</style></head><body>';
            const rodape = '</body></html>';
            const codigoCompleto = cabecalho + conteudoHTML + rodape;

            const blob = new Blob(['\ufeff' + codigoCompleto], {
                type: 'application/msword;charset=utf-8'
            });
            
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'AIH_Preenchida.doc';
            
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }, 100);
        }
    </script>
</body>
</html>
