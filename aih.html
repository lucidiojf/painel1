<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de AIH - Autorização de Internação Hospitalar</title>
    <style>
        :root {
            --primary-color: #003366;
            --border-color: #000;
            --bg-light: #f9f9f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #eef2f5;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 950px;
            background: #fff;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Barra de Ações (Oculta na impressão) */
        .action-bar {
            background: var(--primary-color);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .action-bar h2 {
            color: #fff;
            font-size: 1.2rem;
        }

        .btn-group button {
            background: #fff;
            color: var(--primary-color);
            border: none;
            padding: 8px 15px;
            margin-left: 8px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-group button:hover {
            background: #f0f0f0;
        }

        /* Estrutura do Formulário AIH */
        .aih-form {
            border: 2px solid var(--border-color);
            font-size: 11px;
            background: #fff;
        }

        .aih-section-title {
            text-align: center;
            font-weight: bold;
            background: #e0e0e0;
            padding: 6px;
            font-size: 12px;
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
        }

        .aih-row {
            display: flex;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border-color);
        }

        .aih-row:last-child {
            border-bottom: none;
        }

        .field-group {
            padding: 5px;
            border-right: 1px solid var(--border-color);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .field-group:last-child {
            border-right: none;
        }

        .field-group label {
            font-weight: bold;
            font-size: 9px;
            color: #444;
            margin-bottom: 3px;
            text-transform: uppercase;
        }

        .field-group input, .field-group select {
            border: none;
            border-bottom: 1px dotted #888;
            padding: 3px;
            font-size: 11px;
            outline: none;
            background: transparent;
        }

        .field-group input:focus {
            background: var(--bg-light);
            border-bottom: 1px solid var(--primary-color);
        }

        /* Estilos de Impressão */
        @media print {
            body {
                background: #fff;
                padding: 0;
            }
            .action-bar {
                display: none;
            }
            .container {
                border: none;
                box-shadow: none;
                max-width: 100%;
                padding: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Barra de Controles -->
        <div class="action-bar">
            <h2>Módulo AIH - Cabeçalho Oficial</h2>
            <div class="btn-group">
                <button onclick="window.print()">🖨️ Imprimir / PDF</button>
                <button onclick="exportarWord()">📄 Baixar Word</button>
            </div>
        </div>

        <!-- Formulário AIH -->
        <div class="aih-form">
            <div class="aih-section-title">
                MINISTÉRIO DA SAÚDE - SISTEMA ÚNICO DE SAÚDE<br>
                AUTORIZAÇÃO DE INTERNAÇÃO HOSPITALAR (AIH)
            </div>

            <!-- Bloco Cabeçalho: Órgão Emissor e Estabelecimento -->
            <div class="aih-row">
                <div class="field-group" style="flex: 2;">
                    <label>1. Órgão Emissor (UF/Municipal)</label>
                    <input type="text" id="orgaoEmissor" placeholder="Ex: Secretaria Estadual de Saúde - RN">
                </div>
                <div class="field-group" style="flex: 2;">
                    <label>2. Nome do Estabelecimento de Saúde (Hospital)</label>
                    <input type="text" id="nomeEstabelecimento" placeholder="Nome do Hospital / Unidade">
                </div>
                <div class="field-group" style="flex: 1;">
                    <label>3. CNES</label>
                    <input type="text" id="cnes" placeholder="Código CNES">
                </div>
            </div>

            <!-- Bloco Tipo de Guia e Datas -->
            <div class="aih-row">
                <div class="field-group" style="flex: 1;">
                    <label>4. Tipo de AIH</label>
                    <input type="text" id="tipoAih" placeholder="Ex: 1 - Normal">
                </div>
                <div class="field-group" style="flex: 1;">
                    <label>5. Nº da AIH (Anterior se Faturamento)</label>
                    <input type="text" id="aihAnterior" placeholder="Nº se aplicável">
                </div>
                <div class="field-group" style="flex: 1;">
                    <label>6. Data da Emissão</label>
                    <input type="date" id="dataEmissao">
                </div>
            </div>

            <!-- Bloco Identificação Básica do Paciente -->
            <div class="aih-section-title" style="background: #f0f0f0; font-size: 11px; text-align: left; padding-left: 5px;">
                I - IDENTIFICAÇÃO DO PACIENTE
            </div>

            <div class="aih-row">
                <div class="field-group" style="flex: 3;">
                    <label>7. Nome do Paciente</label>
                    <input type="text" id="nomePaciente" placeholder="Nome completo do paciente">
                </div>
                <div class="field-group" style="flex: 1;">
                    <label>8. Prontuário</label>
                    <input type="text" id="prontuario" placeholder="Nº do prontuário">
                </div>
            </div>
        </div>
    </div>

    <script>
        function exportarWord() {
            const conteudoHTML = document.querySelector('.aih-form').outerHTML;
            const cabecalho = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>AIH</title></head><body>';
            const rodape = '</body></html>';
            const codigoCompleto = cabecalho + conteudoHTML + rodape;

            const uri = 'data:application/msword;charset=utf-8,' + encodeURIComponent(codigoCompleto);
            
            const a = document.createElement('a');
            a.href = uri;
            a.download = 'AIH_Cabecalho.doc';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
