<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emissão AIH Oficial</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      padding: 12px;
      color: #0f172a;
    }

    .painel-formulario {
      max-width: 900px;
      margin: 0 auto 20px auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .painel-formulario h2 {
      text-align: center;
      color: #0369a1;
      margin-bottom: 15px;
      font-size: 1.2rem;
      text-transform: uppercase;
    }

    fieldset {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
    }

    legend {
      font-weight: bold;
      color: #0284c7;
      font-size: 0.85rem;
      padding: 0 6px;
    }

    .grid-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }

    .campo {
      display: flex;
      flex-direction: column;
    }

    .col-full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 3px;
      color: #334155;
    }

    input, select, textarea {
      padding: 7px 9px;
      border: 1px solid #94a3b8;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    .botoes-container {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 140px;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      color: #ffffff;
      text-align: center;
    }

    .btn-visualizar { background: #0284c7; }
    .btn-pdf { background: #dc2626; }
    .btn-word { background: #1e3a8a; }

    /* Área do Documento Oficial das 5 Páginas */
    #documentoImpressao {
      max-width: 820px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      font-size: 10.5px;
      line-height: 1.25;
      color: #000;
    }

    .cabecalho-doc {
      text-align: center;
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .cabecalho-doc h3 { font-size: 12px; text-transform: uppercase; margin: 0; }
    .cabecalho-doc h4 { font-size: 11px; margin: 1px 0; }
    .cabecalho-doc p { font-size: 9.5px; margin: 0; }

    .titulo-bloco {
      font-weight: bold;
      text-align: center;
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
      padding: 3px 0;
      margin: 6px 0;
      font-size: 11px;
      text-transform: uppercase;
      background: #f8fafc;
    }

    .tab-oficial {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 6px;
      table-layout: fixed;
    }

    .tab-oficial td, .tab-oficial th {
      border: 1px solid #000;
      padding: 3px 5px;
      vertical-align: top;
      word-wrap: break-word;
    }

    .lb {
      font-size: 8px;
      font-weight: bold;
      text-transform: uppercase;
      color: #333;
      display: block;
      margin-bottom: 1px;
    }

    .vl {
      font-size: 10.5px;
      font-weight: bold;
      color: #000;
    }

    .quebra-pagina-visual {
      page-break-before: always;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 2px dashed #94a3b8;
    }

    /* Regras de Impressão Direta em PDF sem tela em branco */
    @media print {
      body {
        background: #fff;
        padding: 0;
      }
      .painel-formulario, .botoes-container {
        display: none !important;
      }
      #documentoImpressao {
        width: 100%;
        max-width: 100%;
        padding: 0;
        margin: 0;
        box-shadow: none;
      }
      .quebra-pagina-visual {
        page-break-before: always;
        border-top: none;
        margin-top: 0;
        padding-top: 0;
      }
    }
  </style>
</head>
<body>

  <!-- FORMULÁRIO DE ENTRADA -->
  <div class="painel-formulario">
    <h2>Emissão AIH Oficial &bull; Frutuoso Gomes</h2>
    <form id="formDados" onsubmit="event.preventDefault(); atualizarVisualizacao();">
      
      <fieldset>
        <legend>Dados da AIH e Estabelecimento</legend>
        <div class="grid-form">
          <div class="campo">
            <label>Nº Prontuário</label>
            <input type="text" id="prontuario" value="4819" required>
          </div>
          <div class="campo">
            <label>Nº da AIH</label>
            <input type="text" id="num_aih" placeholder="Opcional">
          </div>
          <div class="campo">
            <label>Tipo</label>
            <select id="tipo_aih">
              <option value="01 – Inicial">01 – Inicial</option>
              <option value="02 – Continuidade" selected>02 – Continuidade</option>
            </select>
          </div>
          <div class="campo">
            <label>Data Internação</label>
            <input type="date" id="data_internacao" value="2026-09-04">
          </div>
          <div class="campo">
            <label>Data da Saída</label>
            <input type="date" id="data_saida" value="2026-09-06">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Dados do Paciente</legend>
        <div class="grid-form">
          <div class="campo col-full">
            <label>Nome Completo do Paciente</label>
            <input type="text" id="paciente" value="JUCIENE ALVES CAMARA FERREIRA" required>
          </div>
          <div class="campo">
            <label>Cartão SUS (CNS)</label>
            <input type="text" id="cns" value="702 9095 5587 9470">
          </div>
          <div class="campo">
            <label>Data de Nascimento</label>
            <input type="date" id="nascimento" value="1980-05-12">
          </div>
          <div class="campo">
            <label>Sexo</label>
            <select id="sexo">
              <option value="F" selected>Feminino</option>
              <option value="M">Masculino</option>
            </select>
          </div>
          <div class="campo">
            <label>Raça / Cor</label>
            <select id="raca">
              <option value="PARDA" selected>Parda</option>
              <option value="BRANCA">Branca</option>
              <option value="PRETA">Preta</option>
            </select>
          </div>
          <div class="campo col-full">
            <label>Nome da Mãe</label>
            <input type="text" id="mae" value="MARIA ALVES DA SILVA">
          </div>
          <div class="campo col-full">
            <label>Endereço</label>
            <input type="text" id="endereco" value="RUA ROLDÃO DANTAS, Nº 34 - CENTRO">
          </div>
          <div class="campo">
            <label>Telefone</label>
            <input type="text" id="telefone" value="(84) 99688-3488">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Dados Clínicos e Cirúrgicos</legend>
        <div class="grid-form">
          <div class="campo">
            <label>CID-10 Principal</label>
            <input type="text" id="cid" value="I10" required>
          </div>
          <div class="campo">
            <label>Diagnóstico Inicial</label>
            <input type="text" id="diagnostico" value="CRISE HIPERTENSIVA" required>
          </div>
          <div class="campo">
            <label>Código do Procedimento</label>
            <input type="text" id="cod_proc" value="0303060107">
          </div>
          <div class="campo col-full">
            <label>Descrição do Procedimento</label>
            <input type="text" id="nome_proc" value="TRATAMENTO DE CRISE HIPERTENSIVA">
          </div>
          <div class="campo col-full">
            <label>Sinais e Sintomas Clínicos</label>
            <textarea id="sintomas" rows="2">Cefaleia de forte intensidade, náuseas, tontura e níveis pressóricos elevados na admissão.</textarea>
          </div>
          <div class="campo col-full">
            <label>Condições que Justificam a Internação</label>
            <textarea id="justificativa" rows="2">Quadro clínico agudo com necessidade de monitorização intensiva e terapêutica parenteral.</textarea>
          </div>
        </div>
      </fieldset>

      <div class="botoes-container">
        <button type="submit" class="btn btn-visualizar">Atualizar Visualização</button>
        <button type="button" onclick="gerarWordDoc()" class="btn btn-word">Baixar DOC (Word)</button>
        <button type="button" onclick="gerarPDFNativo()" class="btn btn-pdf">Baixar PDF Oficial</button>
      </div>

    </form>
  </div>

  <!-- CONTAINER OFICIAL COM AS 5 PÁGINAS -->
  <div id="documentoImpressao"></div>

  <script>
    function formatarData(str) {
      if (!str) return '';
      const p = str.split('-');
      return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : str;
    }

    function coletarDados() {
      return {
        prontuario: document.getElementById('prontuario').value || '',
        numAih: document.getElementById('num_aih').value || '',
        tipoAih: document.getElementById('tipo_aih').value || '02 – Continuidade',
        dataInternacao: formatarData(document.getElementById('data_internacao').value),
        dataSaida: formatarData(document.getElementById('data_saida').value),
        paciente: document.getElementById('paciente').value || '',
        cns: document.getElementById('cns').value || '',
        nascimento: formatarData(document.getElementById('nascimento').value),
        sexo: document.getElementById('sexo').value || 'F',
        raca: document.getElementById('raca').value || 'PARDA',
        mae: document.getElementById('mae').value || '',
        endereco: document.getElementById('endereco').value || '',
        telefone: document.getElementById('telefone').value || '',
        cid: document.getElementById('cid').value || '',
        diagnostico: document.getElementById('diagnostico').value || '',
        codProc: document.getElementById('cod_proc').value || '',
        nomeProc: document.getElementById('nome_proc').value || '',
        sintomas: document.getElementById('sintomas').value || '',
        justificativa: document.getElementById('justificativa').value || '',
        medico: 'LUCÍDIO JÁCOME FERREIRA',
        cpfMedico: '175.499.574-87'
      };
    }

    function montarTodasAsPaginas(d) {
      return `
        <!-- PÁGINA 1: AUTORIZAÇÃO PARA INTERNAÇÃO HOSPITALAR -->
        <div class="cabecalho-doc">
          <h3>Prefeitura Municipal de Frutuoso Gomes</h3>
          <h4>Hospital Maternidade Severina Carlos de Andrade</h4>
          <p>C.N.P.J 08.349.052/0001-80 &bull; Frutuoso Gomes - RN</p>
        </div>
        <div class="titulo-bloco">Autorização para Internação Hospitalar</div>
        
        <table class="tab-oficial">
          <tr>
            <td style="width: 40%;"><span class="lb">Número da AIH:</span><span class="vl">${d.numAih || '&nbsp;'}</span></td>
            <td style="width: 30%;"><span class="lb">Prontuário:</span><span class="vl">${d.prontuario}</span></td>
            <td style="width: 30%;"><span class="lb">Tipo:</span><span class="vl">${d.tipoAih}</span></td>
          </tr>
          <tr>
            <td colspan="2"><span class="lb">Apresentação:</span><span class="vl">ESTADUAL</span></td>
            <td><span class="lb">Órgão Emissor:</span><span class="vl">SESAP / RN</span></td>
          </tr>
          <tr>
            <td colspan="2"><span class="lb">Data da Internação:</span><span class="vl">${d.dataInternacao}</span></td>
            <td><span class="lb">Data da Saída:</span><span class="vl">${d.dataSaida}</span></td>
          </tr>
        </table>

        <div class="titulo-bloco">Dados do Paciente</div>
        <table class="tab-oficial">
          <tr>
            <td colspan="2" style="width: 70%;"><span class="lb">Nome do Paciente:</span><span class="vl">${d.paciente}</span></td>
            <td style="width: 30%;"><span class="lb">Cartão SUS:</span><span class="vl">${d.cns}</span></td>
          </tr>
          <tr>
            <td style="width: 35%;"><span class="lb">Data de Nascimento:</span><span class="vl">${d.nascimento}</span></td>
            <td style="width: 25%;"><span class="lb">Sexo:</span><span class="vl">${d.sexo}</span></td>
            <td style="width: 40%;"><span class="lb">Raça/Cor:</span><span class="vl">${d.raca}</span></td>
          </tr>
          <tr>
            <td colspan="2"><span class="lb">Nome da Mãe:</span><span class="vl">${d.mae}</span></td>
            <td><span class="lb">Telefone:</span><span class="vl">${d.telefone}</span></td>
          </tr>
          <tr>
            <td colspan="3"><span class="lb">Endereço:</span><span class="vl">${d.endereco} - FRUTUOSO GOMES/RN</span></td>
          </tr>
        </table>

        <div class="titulo-bloco">Dados do Procedimento</div>
        <table class="tab-oficial">
          <tr>
            <td style="width: 70%;"><span class="lb">Procedimento Solicitado/Realizado:</span><span class="vl">${d.nomeProc}</span></td>
            <td style="width: 30%;"><span class="lb">Código:</span><span class="vl">${d.codProc}</span></td>
          </tr>
          <tr>
            <td><span class="lb">Especialidade:</span><span class="vl">CLÍNICA MÉDICA</span></td>
            <td><span class="lb">Enfermaria / Leito:</span><span class="vl">M / 01</span></td>
          </tr>
          <tr>
            <td><span class="lb">Diagnóstico Inicial:</span><span class="vl">${d.diagnostico}</span></td>
            <td><span class="lb">CID Principal:</span><span class="vl">${d.cid}</span></td>
          </tr>
          <tr>
            <td><span class="lb">CPF Solicitante:</span><span class="vl">${d.cpfMedico}</span></td>
            <td><span class="lb">CPF Autorizador:</span><span class="vl">185.901.284-15</span></td>
          </tr>
        </table>

        <div class="titulo-bloco">Procedimentos Realizados</div>
        <table class="tab-oficial" style="text-align: center;">
          <tr style="background: #f1f5f9;">
            <th>Linha</th><th>Procedimento</th><th>Qtd.</th><th>CPF</th><th>CBO</th><th>CNES</th><th>CNPJ</th>
          </tr>
          <tr>
            <td>01</td><td>${d.codProc}</td><td>01</td><td>${d.cpfMedico}</td><td>225125</td><td>2380846</td><td>08.349.052/0001-80</td>
          </tr>
        </table>

        <!-- PÁGINA 2: LAUDO PARA SOLICITAÇÃO (SUS) -->
        <div class="quebra-pagina-visual"></div>
        <div class="cabecalho-doc">
          <h3>Sistema Único de Saúde - Ministério da Saúde</h3>
          <h2 style="font-size: 12px; margin: 2px 0;">LAUDO PARA SOLICITAÇÃO DE AUTORIZAÇÃO DE INTERNAÇÃO HOSPITALAR</h2>
        </div>
        
        <div class="titulo-bloco">Identificação do Estabelecimento de Saúde</div>
        <table class="tab-oficial">
          <tr>
            <td style="width: 75%;"><span class="lb">1. Nome do Estabelecimento Solicitante / Executante:</span><span class="vl">HOSPITAL MATERNIDADE SEVERINA CARLOS DE ANDRADE</span></td>
            <td style="width: 25%;"><span class="lb">2. CNES:</span><span class="vl">2380846</span></td>
          </tr>
        </table>

        <div class="titulo-bloco">Justificativa da Internação</div>
        <table class="tab-oficial">
          <tr>
            <td colspan="2"><span class="lb">17. Principais Sinais e Sintomas Clínicos:</span><div class="vl" style="min-height: 25px;">${d.sintomas}</div></td>
          </tr>
          <tr>
            <td colspan="2"><span class="lb">18. Condições que Justificam a Internação:</span><div class="vl" style="min-height: 25px;">${d.justificativa}</div></td>
          </tr>
          <tr>
            <td style="width: 70%;"><span class="lb">20. Diagnóstico Inicial:</span><span class="vl">${d.diagnostico}</span></td>
            <td style="width: 30%;"><span class="lb">21. CID 10 Principal:</span><span class="vl">${d.cid}</span></td>
          </tr>
          <tr>
            <td><span class="lb">24. Descrição do Procedimento Solicitado:</span><span class="vl">${d.nomeProc}</span></td>
            <td><span class="lb">25. Código:</span><span class="vl">${d.codProc}</span></td>
          </tr>
        </table>

        <table class="tab-oficial" style="margin-top: 10px;">
          <tr>
            <td style="width: 50%; height: 50px; vertical-align: bottom; text-align: center;">
              <div style="border-top: 1px dotted #000; font-size: 9px;">
                ${d.medico}<br>CPF: ${d.cpfMedico} &bull; Médico Solicitante
              </div>
            </td>
            <td style="width: 50%; height: 50px; vertical-align: bottom; text-align: center;">
              <div style="border-top: 1px dotted #000; font-size: 9px;">
                Profissional Autorizador<br>Data: ${d.dataInternacao}
              </div>
            </td>
          </tr>
        </table>

        <!-- PÁGINA 3: PRONTUÁRIO DE INTERNAÇÃO -->
        <div class="quebra-pagina-visual"></div>
        <div class="cabecalho-doc">
          <h3>Estado do Rio Grande do Norte &bull; SMS de Frutuoso Gomes</h3>
          <h4>Hospital Maternidade Severina Carlos de Andrade</h4>
          <h2 style="font-size: 12px; margin: 4px 0; text-decoration: underline;">PRONTUÁRIO DE INTERNAÇÃO</h2>
        </div>

        <table class="tab-oficial">
          <tr>
            <td colspan="2"><span class="lb">Nome do Paciente:</span><span class="vl">${d.paciente}</span></td>
            <td><span class="lb">Nº do Prontuário:</span><span class="vl">${d.prontuario}</span></td>
          </tr>
          <tr>
            <td colspan="2"><span class="lb">Endereço:</span><span class="vl">${d.endereco}</span></td>
            <td><span class="lb">Data Admissão:</span><span class="vl">${d.dataInternacao}</span></td>
          </tr>
          <tr>
            <td><span class="lb">Diagnóstico Inicial:</span><span class="vl">${d.diagnostico}</span></td>
            <td><span class="lb">Diagnóstico Final:</span><span class="vl">${d.diagnostico}</span></td>
            <td><span class="lb">Alta:</span><span class="vl">${d.dataSaida}</span></td>
          </tr>
        </table>

        <div class="titulo-bloco">Sumário de História Clínica, Exame Físico e Tratamento</div>
        <table class="tab-oficial">
          <tr>
            <td style="height: 100px; vertical-align: top;">
              <span class="lb">Histórico:</span>
              <p style="margin-top: 3px;">Paciente deu entrada com quadro de <strong>${d.sintomas}</strong>.</p>
              <p style="margin-top: 6px;">Instituída terapêutica medicamentosa e acompanhamento clínico contínuo conforme protocolo assistencial.</p>
            </td>
          </tr>
        </table>

        <!-- PÁGINA 4: FICHA DE ANESTESIA -->
        <div class="quebra-pagina-visual"></div>
        <div class="cabecalho-doc">
          <h3>Hospital Maternidade Severina Carlos de Andrade</h3>
          <h2 style="font-size: 12px; margin: 2px 0;">FICHA DE ANESTESIA</h2>
        </div>

        <table class="tab-oficial">
          <tr>
            <td style="width: 70%;"><span class="lb">Nome:</span><span class="vl">${d.paciente}</span></td>
            <td style="width: 30%;"><span class="lb">Prontuário:</span><span class="vl">${d.prontuario}</span></td>
          </tr>
          <tr>
            <td><span class="lb">Anestesia Tipo:</span><span class="vl">LOCAL</span></td>
            <td><span class="lb">Técnica:</span><span class="vl">INFILTRAÇÃO LOCAL</span></td>
          </tr>
          <tr>
            <td colspan="2"><span class="lb">Drogas Usadas:</span><span class="vl">LIDOCAÍNA A 2% - 20 ML / SF 0,9% 500 ML EV</span></td>
          </tr>
        </table>

        <table class="tab-oficial" style="margin-top: 20px;">
          <tr>
            <td style="height: 45px; vertical-align: bottom; text-align: center;">
              <div style="border-top: 1px dotted #000; font-size: 9px; width: 60%; margin: 0 auto;">
                Médico Anestesista / Cirurgião
              </div>
            </td>
          </tr>
        </table>

        <!-- PÁGINA 5: BOLETIM OPERATÓRIO -->
        <div class="quebra-pagina-visual"></div>
        <div class="cabecalho-doc">
          <h3>Hospital Maternidade Severina Carlos de Andrade</h3>
          <h2 style="font-size: 12px; margin: 2px 0;">BOLETIM OPERATÓRIO</h2>
        </div>

        <table class="tab-oficial">
          <tr>
            <td style="width: 70%;"><span class="lb">Nome:</span><span class="vl">${d.paciente}</span></td>
            <td style="width: 30%;"><span class="lb">Prontuário:</span><span class="vl">${d.prontuario}</span></td>
          </tr>
          <tr>
            <td><span class="lb">Procedimento:</span><span class="vl">${d.nomeProc}</span></td>
            <td><span class="lb">Código SSM:</span><span class="vl">${d.codProc}</span></td>
          </tr>
          <tr>
            <td><span class="lb">Cirurgião Operador:</span><span class="vl">${d.medico}</span></td>
            <td><span class="lb">Data:</span><span class="vl">${d.dataInternacao}</span></td>
          </tr>
        </table>

        <div class="titulo-bloco">Relatório do Procedimento</div>
        <table class="tab-oficial">
          <tr>
            <td style="height: 100px; vertical-align: top;">
              <span class="lb">Descrição:</span>
              <p style="margin-top: 4px;">Procedimento realizado sob técnica asséptica habitual. Sem intercorrências operatórias ou imediatas pós-procedimento.</p>
            </td>
          </tr>
        </table>

        <table class="tab-oficial" style="margin-top: 20px;">
          <tr>
            <td style="height: 45px; vertical-align: bottom; text-align: center;">
              <div style="border-top: 1px dotted #000; font-size: 9px; width: 60%; margin: 0 auto;">
                ${d.medico}<br>Médico Operador
              </div>
            </td>
          </tr>
        </table>
      `;
    }

    function atualizarVisualizacao() {
      const d = coletarDados();
      document.getElementById('documentoImpressao').innerHTML = montarTodasAsPaginas(d);
    }

    // PDF oficial: aciona o motor de impressão do Chrome (Salvar como PDF) sem tela em branco
    function gerarPDFNativo() {
      atualizarVisualizacao();
      window.print();
    }

    // Word oficial: constrói um .doc limpo sem juntar palavras
    function gerarWordDoc() {
      atualizarVisualizacao();
      const d = coletarDados();
      const conteudo = document.getElementById('documentoImpressao').innerHTML;
      const nomeArquivo = `AIH_${d.prontuario}_${d.paciente.replace(/\s+/g, '_')}.doc`;

      const docWord = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' 
              xmlns:w='urn:schemas-microsoft-com:office:word' 
              xmlns='http://www.w3.org/TR/REC-html40'>
        <head>
          <meta charset='utf-8'>
          <title>AIH Oficial</title>
          <!--[if gte mso 9]>
          <xml>
            <w:WordDocument>
              <w:View>Print</w:View>
              <w:Zoom>100</w:Zoom>
              <w:DoNotOptimizeForBrowser/>
            </w:WordDocument>
          </xml>
          <![endif]-->
          <style>
            @page {
              size: A4 portrait;
              margin: 1.2cm;
              mso-page-orientation: portrait;
            }
            body {
              font-family: Arial, sans-serif;
              font-size: 10pt;
              line-height: 1.2;
              color: #000000;
            }
            p {
              margin: 0 0 4pt 0;
            }
            table {
              width: 100%;
              border-collapse: collapse;
              margin-bottom: 6pt;
              mso-table-lspace: 0pt;
              mso-table-rspace: 0pt;
            }
            td, th {
              border: 1pt solid #000000;
              padding: 4pt 5pt;
              vertical-align: top;
            }
            .lb {
              font-size: 7.5pt;
              font-weight: bold;
              text-transform: uppercase;
              color: #333333;
              display: block;
              margin-bottom: 1pt;
            }
            .vl {
              font-size: 9.5pt;
              font-weight: bold;
              color: #000000;
            }
            .titulo-bloco {
              font-weight: bold;
              text-align: center;
              border-top: 1pt solid #000;
              border-bottom: 1pt solid #000;
              padding: 2pt 0;
              margin: 6pt 0;
              font-size: 10pt;
              text-transform: uppercase;
              background-color: #f1f5f9;
            }
            .quebra-pagina-visual {
              page-break-before: always;
              mso-break-type: page-break;
            }
          </style>
        </head>
        <body>
          ${conteudo}
        </body>
        </html>
      `;

      const blob = new Blob(['\ufeff' + docWord], { type: 'application/msword;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = nomeArquivo;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    }

    // Inicializa na abertura
    window.onload = function() {
      atualizarVisualizacao();
    };
  </script>
</body>
</html>
