<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISTEMA HM - AIH Oficial</title>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f1f5f9; margin: 0; padding: 12px; color: #1e293b; }
    .container { max-width: 980px; margin: 0 auto; background: #fff; padding: 18px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #0369a1; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
    .btn-reload { background: #64748b; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    fieldset { border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa; }
    legend { font-weight: 700; color: #0284c7; padding: 0 6px; font-size: 13px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
    .form-group { margin-bottom: 6px; }
    label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 3px; color: #475569; }
    input, select, textarea { width: 100%; padding: 7px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 12px; background: #fff; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #0284c7; }
    .destaque-select { background: #e0f2fe; border-color: #0284c7; font-weight: 600; }
    .btn-submit { background: #0284c7; color: #fff; border: none; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 7px; cursor: pointer; width: 100%; margin-top: 8px; }
    .btn-submit:hover { background: #0369a1; }
    #msgStatus { margin-top: 10px; font-weight: bold; text-align: center; font-size: 13px; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.75); z-index: 9999; justify-content: center; align-items: center; padding: 8px; }
    .modal-content { background: #fff; width: 100%; max-width: 950px; height: 95vh; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { background: #0284c7; color: #fff; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { margin: 0; font-size: 15px; }
    .modal-body { flex: 1; background: #525659; }
    .modal-body iframe { width: 100%; height: 100%; border: none; }
    .modal-footer { padding: 8px 14px; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 8px; }
    .btn-modal { padding: 7px 14px; border-radius: 5px; font-weight: 600; font-size: 12px; cursor: pointer; border: none; }
    .btn-close { background: #e2e8f0; color: #334155; }
    .btn-print { background: #16a34a; color: #fff; }
    .btn-download { background: #0284c7; color: #fff; }
  </style>
</head>

<script>

  /* Banco de Boletins Operatórios */
  const boletins = {
    CESARIANA: 'Incisão Pfannenstiel transversa, ligeiramente semi circular, atingindo pele, subcutâneo e aponeurose, músculos são afastados, peritônio aberto no sentido vertical. Aberta a cavidade, colocar válvula de Doyen no ângulo inferior da incisão. Exposto o segmento inferior do útero, incisão transversa do peritônio visceral, pequena secção transversa no miométrio, afastando e abrindo o miométrio com ajuda de pinça kocher e com os dedos, completando a abertura. Retirada do feto, deslocar e extrair a placenta. Limpeza da cavidade uterina usando compressas, observar se o canal cervical está permeável. Fechamento do miométrio com CG Cromado "1" contínuo ancorado, não incluindo a mucosa. Fechamento do peritônio visceral com CG Simples "2-0" contínuo ancorado. Limpeza da cavidade abdominal com compressas, reposição do útero à cavidade. Fechamento do peritônio parietal com CG Simples "2-0" contínuo. Aproximar músculos com CG Simples "2-0" pontos separados. Sutura da aponeurose com CG Cromado "1" contínua ancorada. Fechamento do subcutâneo com CG Simples "2-0" separados e da pele com mononylon "4-0" contínuo. Curativo Simples.',
    COLECISTECTOMIA: 'Incisão paramediana supraumbilical. Incisão do subcutâneo e aponeurose. Afastar músculo reto abdominal, abertura da aponeurose posterior e peritônio. Aplicação de afastador abdominal, afastar alças com compressas e a borda hepática com valva maleável. Pinçamento da vesícula visualizando o pedículo vascular com identificacao e reparo do canal cistico. Ligadura com duas pinças Mixter da artéria cística com Algodão 0" e secção. Separar a vesícula da loja hepática até o seu pedículo, com bisturi elétrico, até ficar somente o canal cístico. A seguir, com 2 pinças Mixter, clampear o canal cístico, fazendo duas ligaduras com Algodão "0". Revisão da hemostasia do pedículo e do leito hepático. Fechamento da cavidade plano por plano.',
    POSTECTOMIA: 'Reparo da pele com 2 pinças hemostáticas. Exposição do freio, secção do mesmo e ligadura. Com a pele em tensão, delimitamos com bisturi o retalho da mucosa a 1 cm do sulco balanoprepucial ao redor do pênis. Revertemos o prepúcio, fazer a ressecção circular do excesso de pele com tesoura. Realizamos 4 pontos cardeais entre o retalho junto a glande e a pele do pênis com CG Simples "3-0". Completamos a sutura com 3-4 pontos nos quatro segmentos delimitados pelos reparos. Curativo com Xilocaina pomada, elevando o pênis ao nível do abdome.',
    HEMORROIDECTOMIA: 'Mamilos situam-se às 3-7 e 11 horas. Pinças com Allis o ponto mais saliente do mamilo. Incisão da pele e subcutâneo como base de um triângulo cuja base é o pedículo hemorroidário. Prosseguir com a incisão até a linha, deixando aderida à pele a ser retirada, as dilatações venosas. Iniciar sutura contínua ancorada com CG Cromado "2-0" desde o coto do mamilo até a pele, deixando a base do triângulo aberta. Repetir procedimento nos outros dois mamilos. Hemostasia. Cuidado em deixar mucosa entre os mamilos ressecados.',
    FISTULOTOMIA: 'Paciente em decúbito ventral, expomos a região perineal e sacrococcígea com esparadrapos fixados à mesa cirúrgica. Aplicar azul de metileno no orifício externo. Incisão arredondada circundando o inicio da fistula, encampando a área tinginda pelo azul de metileno. até a cavidade anal, retirando todo o trajeto fistuloso. Hemostasia com eletrocautério. Gaze com Lidocaina e aplicar curativo.',
    HERNIOPLASTIA_EPIGASTRICA: 'Incisão transversa no local abaulado interessando pele, subcutâneo, fáscia subcutânea. Abertura da fáscia, apresentação da aponeurose e pelotão gorduroso (aspecto de cogumelo). Na maioria não existe saco herniário, apenas ligamos o pelotão gorduroso com ponto transfixante de CG Cromado "0" no seu colo, e ressecamos o excesso. Reduzimos o tecido gorduroso laqueado para baixo da aponeurose, pinçamos as extremidades da aponeurose e realizamos o seu fechamento com mononylon "2-0" pontos separados. Sutura do subcutâneo com CG Simples "3-0" e pele com sutura contínua Mononylon "4-0". Curativo compressivo.',
    HERNIOPLASTIA_INGUINAL: 'Incisão na região inguinal paralela a uma linha entre espinha ilíaca e sínfise púbica. Dissecar subcutâneo e expor aponeurose do obliquo externo, incisão na direção de suas fibras. Soltar o saco herniário e o cordão espermático por dissecção sem cortar, fixando a massa com gaze. Separe o saco do cordão até o colo do saco no anel interno. Abrir o saco, confirme seu conteudo, transfixar seu colo com algodão "2-0". Cortar o excesso. Reforço da parede posterior: Sutura continua ligando o ligamento inguinal ao tendão conjunto, testando o anel interno para que este deixe no máximo inserir a ponta do dedo mínimo. Repor o cordão inguinal no seu leito normal. Reforço da parede anterior: Fechar a aponeurose do obliquo externo com CG Cromado "0" contínuo. Fechamento subcutaneo e pele.',
    HERNIOPLASTIA_UMBILICAL: 'Incisão semicircular infra-umbilical, atingindo pele e subcutâneo. Com o uso de uma tesoura de Metzembauer contornar o umbigo pelo subcutâneo, bem próximo ao anel herniário, e com uso de bisturi, realizamos secção transversal cuidadosa dos tecidos em direção à tesoura até o encontro do saco herniário. Abrir, identificar, reduzir seu conteúdo e liberação do umbigo, retirando a face caudal do saco herniário. Fechamento do saco herniário e aponeurose adjacente pode ser feito lábio a lábio ou em jaquetão, usando mononylon "0" pontos separados. Fixação do umbigo à aponeurose em sua posição anatômica com ponto de CG Simples "3-0". Fechamento de subcutaneo e pele.',
    HIDROCELE: 'Incisão em sentido longitudinal da bolsa escrotal, atingindo pele, músculo darto e subcutâneo. Divulsão das túnicas até a túnica vaginal, fazendo a devida hemostasia. Realizar o deslocamento com dedo de toda a túnica vaginal. Abrir a túnica vaginal no mesmo sentido da bolsa escrotal e aspirar todo o líquido. Após, amplia-se a incisão, expondo o testículo. Realiza-se a inversão da túnica vaginal, fazendo-se a ressecção do excesso de túnica. Reparo nos ângulos da túnica invertida, iniciando-se sutura da mesma com CG Simples "3-0" contínua ancorada, tendo-se o cuidado de não angustiar os elementos do funículo. Colocar cordão e testículo bem acomodados. Fechamento do subcutâneo e pele com CG Simples "3-0" pontos separados. Curativo local e suspensório escrotal.',
    COLPOPERINEOPLASTIA: 'Colpoperineoplastia anterior: Assepsia com PVPI; incisão mediana na mucosa vaginal a 1 cm do meato urinário. Dissecção romba da mucosa vésico-vaginal; suspensão do músculo vesical e cerclagem com CG Cromado "0". Ressecção do excesso de mucosa e fechamento com CG Cromado "2-0" ancorado na parte longitudinal. Colpoperineoplastia posterior: Reparo com Allis da transição pele-mucosa de cada lado da fúrcula vaginal. Incisão na mucosa vaginal com dissecção romba separando a mucosa vaginal da fáscia retal, expondo os feixes puborretais dos elevadores do ânus. Aproximação destes com pontos em U com CG Cromado "0". Ressecção do excesso de mucosa dos retalhos vaginais. Sutura ancorada com CG Simples "3-0" desde a Allis no reparo superior até a fúrcula vaginal. Sutura da pele com pontos separados de CG Simples "3-0". PVPI e tampão vaginal.',
    HISTERECTOMIA: 'Incisão Pfannenstiel atingindo pele, subcutâneo e aponeurose. Abertura da cavidade abdominal; afastamento de alças com compressas; apresentação do útero com aplicação de saca-fibroma; pinçamento, secção e ligadura de: ligamento tubo-ovárico, ligamento redondo, vasos redondos, ligamento útero-sacro. Mesmo procedimento contralateralmente. Abertura da cúpula vaginal; retirada da peça uterina. Fechamento da cúpula vaginal com CG Cromado "1" agulhado; fechamento do peritônio desde o infundíbulo de um lado até o contralateral com Simples "2-0" contínuo. Revisão da hemostasia. Retirada das compressas. Fechamento da cavidade abdominal: Peritônio: CG Simples "2-0" ancorado; músculos: Simples "2-0" separados; aponeurose: Cromado "1" contínuo. Subcutâneo: Simples "2-0" separados. Pele: Mononylon "4-0" contínuo. Curativo simples.',
    CISTO_PILONIDAL: 'Paciente em decúbito ventral, expomos a região perineal e sacrococcígea com esparadrapos fixados à mesa cirúrgica. Aplicar azul de metileno no orifício externo. Incisão obliqua circundando o cisto, tendo como limite inferior a aponeurose pré-sacra, encampando a área tinginda pelo azul de metileno. Hemostasia com eletrocautério. Aproximar sem fechar, com pontos separados de Mononylon 3-0 retirados 5 dias após. Gaze com Nebacetin e aplicar curativo.',
    VASECTOMIA: 'Posicionar o pênis para cima - Incisão pequena à esquerda depois à direita, com acesso ao canal deferente, isolamento, secção e ligadura com algodão 2-0 de ambos os condutos, interrompendo a passagem dos espermatozoides do saco escrotal ao liquido espermático - Fechamento de ambas as incisões com 1-2 pontos catgut simples 3-0. Curativo simples.',
    CURETAGEM: 'Curetagem uterina: Paciente em posição ginecológica, cuidados de assepsia e anti-sepsia. Colocação dos campos operatórios; toque bimanual para comprovar o tamanho do útero, sua forma, consistência e posição; cateterismo vesical se a bexiga estiver cheia. Técnica: Colocação do espéculo, a seguir, pinça-se o lábio anterior do colo (ou posterior, se útero for retrovertido), com pinça de Pozzi; histerometria; colo impermeável, dilata-se com velas de Hegar. Introduz-se a cureta e inicia-se o procedimento em sentido horário. Material do raspado uterino enviado para anatomopatológico.',
    HISTERECTOMIA_VAGINAL: 'Paciente em posição de litotomia. Feito apreensão e tração do colo uterino nos seus lábios anterior e posterior. Incisão circular com bisturi elétrico na transição entre as mucosas vaginal e cervical. Dissecção romba dos pilares vesicais, elevando da bexiga. Pinçamento, secção e ligadura com reparos bilaterais dos ligamentos uterossacros. Pinçamento, secção e ligadura das artérias uterinas bilaterais. Exteriorização do útero através da abertura do peritônio posterior. Identificação do peritônio anterior e secção do mesmo com tesoura. Pinçamento, secção, ligadura e reparo bilateral dos ligamentos redondo e útero-ováricos. Retirada da peça operatória (útero). Fechamento de cúpula com Catgut.',
    HERNIOPLASTIA_INCISIONAL: 'Incisão fusiforme alargada englobando a cicatriz anterior. Abertura de pele e subcutâneo. Dissecamos o saco herniário desfazendo aderências com a aponeurose até identificar o anel herniário. Abertura do saco, redução do conteúdo, ressecção do excesso de saco herniário. Aproximação da aponeurose com algodão 2-0. Aplicação de tela de polipropileno. Fechamento de subcutâneo e pele.',
    EXERESE_BARTHOLIN: 'Incisão da mucosa dos pequenos lábios, com dissecção progressiva até a cápsula do cisto. Dissecção do cisto, tentando isolá-lo dos tecidos vizinhos, até o seu pedículo. Ligar o pedículo com CG Cromado "2-0". Hemostasia. Aproximar subcutâneo com CG Simples "3-0", deixando dreno de Penrose. Sutura da mucosa em "U" com CG Simples "3-0".'
  };

  /* Disparadores dos Seletores Inteligentes */
  function aoSelecionarCid(val) {
    if (!val) return;
    if (val === 'OUTRO') {
      document.getElementById('diagInicial').value = '';
      document.getElementById('cidPrincipal').value = '';
      document.getElementById('diagInicial').focus();
      return;
    }
    const partes = val.split('|');
    document.getElementById('diagInicial').value = partes[0];
    document.getElementById('cidPrincipal').value = partes[1];
  }

  function aoSelecionarProced(val) {
    if (!val) return;
    if (val === 'OUTRO') {
      document.getElementById('procedimento').value = '';
      document.getElementById('codProcedimento').value = '';
      document.getElementById('procedimento').focus();
      return;
    }
    const partes = val.split('|');
    document.getElementById('procedimento').value = partes[0];
    document.getElementById('codProcedimento').value = partes[1];
    if (partes[2]) {
      document.getElementById('especialidade').value = partes[2];
    }
  }

  function aoSelecionarMedico(val) {
    if (!val) return;
    if (val === 'OUTRO') {
      document.getElementById('medicoSolicitante').value = '';
      document.getElementById('cpfSolicitante').value = '';
      document.getElementById('medicoSolicitante').focus();
      return;
    }
    const partes = val.split('|');
    document.getElementById('medicoSolicitante').value = partes[0];
    document.getElementById('cpfSolicitante').value = partes[1];
  }

  function aoSelecionarAnestesia(val) {
    if (!val) return;
    document.getElementById('txtAnestesia').value = (val === 'OUTRO') ? '' : val;
    if (val === 'OUTRO') document.getElementById('txtAnestesia').focus();
  }

  function aoSelecionarCirurgia(chave) {
    if (!chave) return;
    if (chave === 'OUTRO') {
      document.getElementById('txtCirurgia').value = '';
      document.getElementById('txtCirurgia').focus();
    } else if (boletins[chave]) {
      document.getElementById('txtCirurgia').value = boletins[chave];
    }
  }

  document.getElementById('formAih').addEventListener('submit', async function(e) {
    e.preventDefault();
    const msg = document.getElementById('msgStatus');
    msg.style.color = '#0284c7';
    msg.innerText = 'Preenchendo documento e registrando na planilha...';

    try {
      await gerarAihAdobeForm();
      msg.innerText = 'Concluído com sucesso!';
    } catch (err) {
      console.error(err);
      msg.style.color = '#dc2626';
      msg.innerText = 'Erro: ' + err.message;
    }
  });

  async function gerarAihAdobeForm() {
    const { PDFDocument, StandardFonts } = PDFLib;

    const res = await fetch(URL_PDF_BASE);
    if (!res.ok) throw new Error('Não encontrou o arquivo AIH_FORM.pdf no repositório.');
    const buffer = await res.arrayBuffer();

    const pdfDoc = await PDFDocument.load(buffer);
    const helvetica = await pdfDoc.embedFont(StandardFonts.Helvetica);

    const form = pdfDoc.getForm();
    const fields = form.getFields();

    const d = {
      prontuario: document.getElementById('prontuario').value || '',
      nome: document.getElementById('nomePaciente').value || '',
      cns: document.getElementById('cns').value || '',
      nasc: document.getElementById('dataNasc').value || '',
      sexo: document.getElementById('sexo').value || 'F',
      raca: document.getElementById('racaCor').value || 'PARDA',
      tel: document.getElementById('telefone').value || '',
      mae: document.getElementById('nomeMae').value || '',
      pai: document.getElementById('nomePai').value || '',
      profissao: document.getElementById('profissao').value || 'AGRICULTORA',
      endereco: document.getElementById('endereco').value || '',
      num: document.getElementById('numEndereco').value || 'SN',
      bairro: document.getElementById('bairro').value || 'ZONA RURAL',
      municipio: document.getElementById('municipio').value || 'FRUTUOSO GOMES',
      estado: document.getElementById('estado').value || 'RN',
      cep: document.getElementById('cep').value || '59890-000',
      rg: document.getElementById('rg').value || '',
      cpfPac: document.getElementById('cpfPac').value || '',
      dtInternacao: document.getElementById('dataInternacao').value || '',
      dtSaida: document.getElementById('dataSaida').value || '',
      diag: document.getElementById('diagInicial').value || '',
      cid: document.getElementById('cidPrincipal').value || '',
      procedimento: document.getElementById('procedimento').value || '',
      codProced: document.getElementById('codProcedimento').value || '',
      especialidade: document.getElementById('especialidade').value || 'CLINICA MEDICA',
      medico: document.getElementById('medicoSolicitante').value || 'LUCIDIO JÁCOME FERREIRA',
      cpfMed: document.getElementById('cpfSolicitante').value || '175.499.574-87',
      dtSol: document.getElementById('dataSolicitacao').value || '',
      sinais: document.getElementById('sinaisSintomas').value || '',
      justificativa: document.getElementById('justificativa').value || '',
      exames: document.getElementById('exames').value || '',
      tecnicaAnest: document.getElementById('selTecnicaAnestesia').value || 'Local',
      anestesia: document.getElementById('txtAnestesia').value || '',
      cirurgia: document.getElementById('txtCirurgia').value || ''
    };

    const normalizar = (txt) => {
      return (txt || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/[^a-z0-9]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    };

    fields.forEach(f => {
      const originalName = f.getName();
      const n = normalizar(originalName);

      try {
        const tf = form.getTextField(originalName);
        if (tf) {
          let val = null;
          let fontSize = 7.5;
          let isMulti = false;

          // ==========================================
          // 24. DESCRIÇÃO DO PROCEDIMENTO (PRIORITÁRIO)
          // ==========================================
          if (
            n.startsWith('24') ||
            n.includes('24 descricao') ||
            n.includes('24 desc') ||
            (n.includes('descricao') && n.includes('procedimento')) ||
            (n.includes('desc') && n.includes('procedimento')) ||
            (n.includes('procedimento solicitado') && !n.includes('codigo') && !n.includes('cod')) ||
            n === 'procedimento solicitado' ||
            n === 'descricao do procedimento solicitado' ||
            n === 'campo24 procedimento' ||
            n === 'campo24'
          ) {
            val = d.procedimento;
            fontSize = 7;
            isMulti = true;
          }

          // ==========================================
          // 25. CÓDIGO DO PROCEDIMENTO (SIGTAP)
          // ==========================================
          else if (
            n.startsWith('25') ||
            n.includes('codigo do procedimento') ||
            n.includes('codigo procedimento') ||
            n.includes('cod proced') ||
            n.includes('proced solic') ||
            n.includes('proced realiz') ||
            n.includes('codigo')
          ) {
            val = d.codProced;
            fontSize = 8;
          }

          // ==========================================
          // 18. JUSTIFICATIVA DA INTERNAÇÃO
          // ==========================================
          else if (
            n.startsWith('18') || 
            n.includes('justificam') || 
            n.includes('justificativa') || 
            n.includes('condicoes que') || 
            n.includes('condicoes') ||
            n === 'campo18 justificativa' ||
            n === 'campo18'
          ) {
            val = d.justificativa; 
            fontSize = 6.8; 
            isMulti = true;
          }

          // ==========================================
          // 19. PROVAS DIAGNÓSTICAS / EXAMES
          // ==========================================
          else if (
            n.startsWith('19') || 
            n.includes('provas') || 
            n.includes('diagnosticas') || 
            n.includes('exames') || 
            n.includes('resultado de exames') || 
            n.includes('principais resultados') ||
            n === 'campo19 exames' ||
            n === 'campo19'
          ) {
            val = d.exames; 
            fontSize = 6.8; 
            isMulti = true;
          }

          // ==========================================
          // 20. DIAGNÓSTICO INICIAL
          // ==========================================
          else if (
            n.startsWith('20') || 
            n.includes('20 diagnostico') || 
            (n.includes('diagnostico') && !n.includes('cid') && !n.includes('pre') && !n.includes('final')) || 
            n === 'diagnostico inicial' ||
            n.includes('diag inicial') ||
            n === 'campo20 diagnostico' ||
            n === 'campo20'
          ) {
            val = d.diag; 
            fontSize = 7.5;
          }

          // ==========================================
          // 21. CID 10 PRINCIPAL
          // ==========================================
          else if (
            n.startsWith('21') || 
            n.includes('cid 10 principal') || 
            n.includes('cid principal') || 
            n === 'cid' || 
            n.includes('cid 10') ||
            n.includes('cid princ')
          ) {
            val = d.cid; 
            fontSize = 8.5;
          }

          // ==========================================
          // 17. SINAIS E SINTOMAS
          // ==========================================
          else if (n.startsWith('17') || n.includes('sinais') || n.includes('sintomas')) {
            val = d.sinais; 
            fontSize = 6.8; 
            isMulti = true;
          }

          // ==========================================
          // DEMAIS CAMPOS DO DOCUMENTO
          // ==========================================
          else if (n.includes('prontuario')) { val = d.prontuario; fontSize = 8.5; }
          else if (n.includes('nome') && !n.includes('mae') && !n.includes('pai') && !n.includes('med') && !n.includes('cirurg') && !n.includes('solicitante')) { val = d.nome; fontSize = 7.5; }
          else if (n.includes('sus') || n.includes('cns')) { val = d.cns; fontSize = 8; }
          else if (n.includes('dn') || n.includes('nasc')) { val = d.nasc; fontSize = 7.5; }
          else if (n.includes('sexo')) { val = d.sexo; fontSize = 8; }
          else if (n.includes('cor') || n.includes('raca')) { val = d.raca; fontSize = 7.5; }
          else if (n.includes('mae')) { val = d.mae; fontSize = 7.5; }
          else if (n.includes('pai')) { val = d.pai; fontSize = 7.5; }
          else if (n.includes('profiss')) { val = d.profissao; fontSize = 7.5; }
          else if (n.includes('endereco')) { val = `${d.endereco}, ${d.num} - ${d.bairro}`; fontSize = 7; }
          else if (n === 'n' || n.startsWith('n ') || n.includes('numero')) { val = d.num; fontSize = 8; }
          else if (n.includes('bairro')) { val = d.bairro; fontSize = 7.5; }
          else if (n.includes('municipio') || n.includes('naturalidade')) { val = d.municipio; fontSize = 7.5; }
          else if (n.includes('estado') || n === 'uf' || n.includes('15 uf')) { val = d.estado; fontSize = 8; }
          else if (n.includes('cep')) { val = d.cep; fontSize = 7.5; }
          else if (n.includes('telefone')) { val = d.tel; fontSize = 7.5; }
          else if (n.includes('doc') || n === 'rg') { val = d.rg; fontSize = 8; }
          else if (n.includes('cpf pac') || (n.includes('cpf') && !n.includes('med') && !n.includes('sol'))) { val = d.cpfPac; fontSize = 8; }
          else if (n.includes('dt intern') || n.includes('admissao')) { val = d.dtInternacao; fontSize = 7.5; }
          else if (n.includes('dt saida') || n.includes('alta')) { val = d.dtSaida; fontSize = 7.5; }
          else if (n.includes('mud proc')) { val = 'N'; fontSize = 8; }
          else if (n.includes('especialidade') || n.includes('clinica') || n.includes('servico')) { val = d.especialidade; fontSize = 7; }
          else if (n.includes('enferm')) { val = 'M'; fontSize = 8; }
          else if (n.includes('leito')) { val = '1'; fontSize = 8; }
          else if (n.includes('mot saida')) { val = 'ALTA'; fontSize = 7.5; }
          else if (n.includes('cpf sol') || n.includes('cpf med') || n.includes('documento cns cpf do profissional')) { val = d.cpfMed; fontSize = 8; }
          else if (n.includes('nome med') || n.includes('profissional solicitante')) { val = d.medico; fontSize = 7.5; }
          else if (n.includes('data autz') || n.includes('dt exped') || n.includes('dt cir') || n.includes('dt sol') || n.includes('data da solicitacao')) { val = d.dtSol; fontSize = 7.5; }
          else if (n.includes('tecnica') || n.includes('tipo anest')) { val = d.tecnicaAnest; fontSize = 7.5; }
          else if (n.includes('drogas usadas') || n.includes('anestesia')) { val = d.anestesia; fontSize = 6.8; isMulti = true; }
          else if (n.includes('boletim') || n.includes('relatorio de internacao') || n.includes('relatorio')) { val = d.cirurgia; fontSize = 6.8; isMulti = true; }

          if (val !== null && val !== '') {
            try { 
              if (isMulti && typeof tf.enableMultiline === 'function') {
                tf.enableMultiline();
              }
            } catch(e) {}
            try { tf.setFontSize(fontSize); } catch(e) {}
            tf.setText(String(val).toUpperCase());
          }
        }
      } catch (e) {}

      try {
        const cb = form.getCheckBox(originalName);
        if (cb) {
          const n = normalizar(originalName);
          if (n.includes('check box2') || n.includes('check box3') || n === 'rg' || n.includes('fem')) {
            cb.check();
          }
        }
      } catch (e) {}
    });

    form.updateFieldAppearances(helvetica);

    // Envio direto para o Google Apps Script
    fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(d)
    }).catch(err => console.warn('Erro Sheets:', err));

    pdfBytesGerado = await pdfDoc.save();
    const blob = new Blob([pdfBytesGerado], { type: 'application/pdf' });
    if (pdfBlobUrl) URL.revokeObjectURL(pdfBlobUrl);
    pdfBlobUrl = URL.createObjectURL(blob);

    document.getElementById('pdfFrame').src = pdfBlobUrl;
    document.getElementById('modalVisualizacao').style.display = 'flex';

    const btnDown = document.getElementById('btnDownload');
    btnDown.onclick = () => {
      const a = document.createElement('a');
      a.href = pdfBlobUrl;
      a.download = `AIH_${d.prontuario}_${d.nome.replace(/\s+/g, '_')}.pdf`;
      a.click();
    };
  }

  function fecharModal() {
    document.getElementById('modalVisualizacao').style.display = 'none';
  }

  function imprimirPdf() {
    const frame = document.getElementById('pdfFrame');
    if (frame && frame.contentWindow) {
      frame.contentWindow.focus();
      frame.contentWindow.print();
    }
  }
</script>
</body>
</html>
