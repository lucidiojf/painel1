<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emissão AIH Oficial - Hospital Maternidade Severina Carlos de Andrade</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #e2e8f0;
      color: #0f172a;
      padding: 14px;
    }

    .painel-principal {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .topo-painel {
      text-align: center;
      border-bottom: 2px solid #0284c7;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .topo-painel h1 {
      font-size: 1.25rem;
      color: #0369a1;
      text-transform: uppercase;
    }

    .topo-painel h2 {
      font-size: 0.95rem;
      font-weight: normal;
      color: #475569;
    }

    fieldset {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 14px;
    }

    legend {
      padding: 0 6px;
      font-weight: bold;
      color: #0284c7;
      font-size: 0.9rem;
    }

    .grid-campos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
    }

    .campo-item {
      display: flex;
      flex-direction: column;
    }

    .col-total {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 3px;
      color: #334155;
    }

    input, select, textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #94a3b8;
      border-radius: 4px;
      font-size: 0.88rem;
      background: #fff;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #0284c7;
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
    }

    .barra-botoes-topo {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .btn-acao {
      border: none;
      border-radius: 4px;
      padding: 12px 18px;
      font-weight: bold;
      font-size: 0.92rem;
      cursor: pointer;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .btn-visualizar { background: #0284c7; flex: 2; min-width: 180px; }
    .btn-word { background: #1e3a8a; flex: 1; min-width: 140px; }
    .btn-pdf { background: #dc2626; flex: 1; min-width: 140px; }
    .btn-imprimir { background: #0284c7; }
    .btn-fechar { background: #ef4444; }

    /* Modal de Visualização */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.75);
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
    }

    .modal-corpo {
      background: #ffffff;
      width: 100%;
      max-width: 950px;
      max-height: 96vh;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 25px rgba(0,0,0,0.3);
    }

    .modal-barra {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #f8fafc;
      border-bottom: 2px solid #cbd5e1;
      gap: 8px;
      flex-wrap: wrap;
    }

    .modal-scroll {
      padding: 16px;
      overflow-y: auto;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      background: #475569;
      display: flex;
      justify-content: center;
    }

    /* Formatação da Página Oficial (A4) */
    .pagina-oficial {
      background: #ffffff;
      width: 100%;
      min-width: 720px;
      max-width: 820px;
      padding: 24px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10.5px;
      line-height: 1.25;
      color: #000;
    }

    .quebra-pagina {
      page-break-before: always;
      margin-top: 25px;
      padding-top: 15px;
      border-top: 2px dashed #94a3b8;
    }

    .tabela-aih {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 6px;
      table-layout: fixed;
    }

    .tabela-aih td, .tabela-aih th {
      border: 1px solid #000;
      padding: 3px 5px;
      vertical-align: top;
      word-wrap: break-word;
    }

    .rotulo {
      font-size: 8px;
      font-weight: bold;
      text-transform: uppercase;
      color: #111;
      display: block;
      margin-bottom: 2px;
    }

    .valor {
      font-size: 10.5px;
      font-weight: bold;
      color: #000;
    }

    .faixa-secao {
      background: #e2e8f0;
      border: 1px solid #000;
      font-weight: bold;
      text-align: center;
      padding: 3px;
      font-size: 11px;
      text-transform: uppercase;
      margin: 8px 0 4px 0;
    }

    @media print {
      body * { visibility: hidden; }
      #documentoCompletoAIH, #documentoCompletoAIH * { visibility: visible; }
      #documentoCompletoAIH {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        min-width: 100%;
        padding: 0;
        box-shadow: none;
      }
      .quebra-pagina {
        page-break-before: always;
        border-top: none;
        margin-top: 0;
        padding-top: 0;
      }
      .modal-overlay, .modal-corpo, .modal-scroll {
        position: static;
        background: transparent;
      }
      .modal-barra { display: none !important; }
    }
  </style>
</head>
<body>

  <div class="painel-principal">
    <div class="topo-painel">
      <h1>Emissão AIH Oficial</h1>
      <h2>Hospital Maternidade Severina Carlos de Andrade &bull; Frutuoso Gomes - RN</h2>
    </div>

    <form id="formularioAIH" onsubmit="event.preventDefault(); abrirVisualizacao();">
      
      <!-- 1. IDENTIFICAÇÃO -->
      <fieldset>
        <legend>1. Registo e Tipo de AIH</legend>
        <div class="grid-campos">
          <div class="campo-item">
            <label>Nº Prontuário</label>
            <input type="text" id="prontuario" required value="4819">
          </div>
          <div class="campo-item">
            <label>Nº da AIH (se houver)</label>
            <input type="text" id="num_aih" placeholder="Deixar em branco se inicial">
          </div>
          <div class="campo-item">
            <label>Tipo de AIH</label>
            <select id="tipo_aih">
              <option value="01 – Inicial">01 – Inicial</option>
              <option value="02 – Continuidade" selected>02 – Continuidade</option>
            </select>
          </div>
          <div class="campo-item">
            <label>Data Admissão/Internação</label>
            <input type="date" id="data_admissao" required value="2026-09-04">
          </div>
          <div class="campo-item">
            <label>Data de Saída / Alta</label>
            <input type="date" id="data_saida" value="2026-09-06">
          </div>
        </div>
      </fieldset>

      <!-- 2. DADOS DO PACIENTE -->
      <fieldset>
        <legend>2. Dados do Paciente</legend>
        <div class="grid-campos">
          <div class="campo-item col-total">
            <label>Nome Completo do Paciente</label>
            <input type="text" id="paciente" required value="JUCIENE ALVES CAMARA FERREIRA">
          </div>
          <div class="campo-item">
            <label>Cartão SUS (CNS)</label>
            <input type="text" id="cns" value="702 9095 5587 9470">
          </div>
          <div class="campo-item">
            <label>Data de Nascimento</label>
            <input type="date" id="nascimento" value="1980-05-12">
          </div>
          <div class="campo-item">
            <label>Sexo</label>
            <select id="sexo">
              <option value="F" selected>Feminino</option>
              <option value="M">Masculino</option>
            </select>
          </div>
          <div class="campo-item">
            <label>Raça / Cor</label>
            <select id="raca">
              <option value="PARDA" selected>Parda</option>
              <option value="BRANCA">Branca</option>
              <option value="PRETA">Preta</option>
              <option value="AMARELA">Amarela</option>
              <option value="INDIGENA">Indígena</option>
            </select>
          </div>
          <div class="campo-item col-total">
            <label>Nome da Mãe</label>
            <input type="text" id="mae" value="MARIA ALVES DA SILVA">
          </div>
          <div class="campo-item col-total">
            <label>Endereço Residencial</label>
            <input type="text" id="endereco" value="RUA ROLDÃO DANTAS, Nº 34 - CENTRO">
          </div>
          <div class="campo-item">
            <label>Município</label>
            <input type="text" id="municipio" value="Frutuoso Gomes">
          </div>
          <div class="campo-item">
            <label>UF</label>
            <input type="text" id="uf" value="RN">
          </div>
          <div class="campo-item">
            <label>Telefone</label>
            <input type="text" id="telefone" value="(84) 99688-3488">
          </div>
        </div>
      </fieldset>

      <!-- 3. PROCEDIMENTO E CLÍNICA -->
      <fieldset>
        <legend>3. Procedimento e Justificativa Clínica</legend>
        <div class="grid-campos">
          <div class="campo-item">
            <label>Especialidade / Clínica</label>
            <input type="text" id="especialidade" value="CLÍNICA MÉDICA">
          </div>
          <div class="campo-item">
            <label>Enfermaria / Leito</label>
            <input type="text" id="leito" value="ENF. M / LEITO 02">
          </div>
          <div class="campo-item">
            <label>CID-10 Principal</label>
            <input type="text" id="cid" required value="I10">
          </div>
          <div class="campo-item">
            <label>Diagnóstico Inicial</label>
            <input type="text" id="diagnostico" required value="CRISE HIPERTENSIVA">
          </div>
          <div class="campo-item">
            <label>Código do Procedimento</label>
            <input type="text" id="cod_procedimento" value="0303060107">
          </div>
          <div class="campo-item col-total">
            <label>Descrição do Procedimento</label>
            <input type="text" id="procedimento" value="TRATAMENTO DE CRISE HIPERTENSIVA">
          </div>
          <div class="campo-item col-total">
            <label>Sinais e Sintomas Clínicos</label>
            <textarea id="sintomas" rows="2">Cefaleia de forte intensidade, náuseas, tontura e níveis pressóricos elevados na admissão.</textarea>
          </div>
          <div class="campo-item col-total">
            <label>Condições que Justificam a Internação</label>
            <textarea id="justificativa" rows="2">Quadro clínico agudo necessitando de monitorização intensiva e terapêutica parenteral.</textarea>
          </div>
        </div>
      </fieldset>

      <!-- BOTÕES DIRETOS -->
      <div class="barra-botoes-topo">
        <button type="submit" class="btn-acao btn-visualizar">Visualizar AIH</button>
        <button type="button" onclick="gerarDocumentoWordDireto()" class="btn-acao btn-word">Baixar DOC (Word)</button>
        <button type="button" onclick="gerarPDFDireto()" class="btn-acao btn-pdf">Baixar PDF</button>
      </div>

    </form>
  </div>

  <!-- MODAL DE PRÉ-VISUALIZAÇÃO COMPLETA -->
  <div id="modalAIH" class="modal-overlay" style="display: none;">
    <div class="modal-corpo">
      <div class="modal-barra">
        <strong style="font-size: 1.05rem;">Visualização da AIH Gerada</strong>
        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
          <button type="button" class="btn-acao btn-word" onclick="descarregarWordDOC()">Baixar DOC (Word)</button>
          <button type="button" class="btn-acao btn-pdf" onclick="descarregarPDF()">Baixar PDF</button>
          <button type="button" class="btn-acao btn-imprimir" onclick="window.print()">Imprimir</button>
          <button type="button" class="btn-acao btn-fechar" onclick="fecharModal()">Fechar</button>
        </div>
      </div>

      <div class="modal-scroll">
        <div id="documentoCompletoAIH" class="pagina-oficial"></div>
      </div>
    </div>
  </div>

  <script>
    function formatarData(str) {
      if (!str) return '';
      const partes = str.split('-');
      return partes.length === 3 ? `${partes[2]}/${partes[1]}/${partes[0]}` : str;
    }

    function obterDados() {
      return {
        prontuario: document.getElementById('prontuario').value || '',
        numAih: document.getElementById('num_aih').value || '',
        tipoAih: document.getElementById('tipo_aih').value || '01 – Inicial',
        dataAdmissao: formatarData(document.getElementById('data_admissao').value),
        dataSaida: formatarData(document.getElementById('data_saida').value),
        paciente: document.getElementById('paciente').value || '',
        cns: document.getElementById('cns').value || '',
        nascimento: formatarData(document.getElementById('nascimento').value),
        sexo: document.getElementById('sexo').value || '',
        raca: document.getElementById('raca').value || '',
        mae: document.getElementById('mae').value || '',
        endereco: document.getElementById('endereco').value || '',
        municipio: document.getElementById('municipio').value || 'Frutuoso Gomes',
        uf: document.getElementById('uf').value || 'RN',
        telefone: document.getElementById('telefone').value || '',
        especialidade: document.getElementById('especialidade').value || 'CLÍNICA MÉDICA',
        leito: document.getElementById('leito').value || '01',
        cid: document.getElementById('cid').value || '',
        diagnostico: document.getElementById('diagnostico').value || '',
        codProcedimento: document.getElementById('cod_procedimento').value || '',
        procedimento: document.getElementById('procedimento').value || '',
        sintomas: document.getElementById('sintomas').value || '',
        justificativa: document.getElementById('justificativa').value || '',
        medico: 'LUCÍDIO JÁCOME FERREIRA',
        cpfMedico: '175.499.574-87',
        cpfAutorizador: '185.901.284-15'
      };
    }

    // Monta o template completo com todas as seções oficiais e tabelas alinhadas
    function construirHtmlDocumento(d) {
      return `
        <!-- PÁGINA 1: AUTORIZAÇÃO E LAUDO OFICIAL -->
        <div style="text-align: center; border-bottom: 2px solid #000; padding-bottom: 4px; margin-bottom: 6px;">
          <h3 style="margin: 0; font-size: 13px; text-transform: uppercase;">Prefeitura Municipal de Frutuoso Gomes</h3>
          <h4 style="margin: 2px 0; font-size: 11px;">Hospital Maternidade Severina Carlos de Andrade</h4>
          <p style="margin: 0; font-size: 9.5px;">CNPJ: 08.349.052/0001-80 &bull; Frutuoso Gomes - RN</p>
        </div>

        <div class="faixa-secao">Autorização para Internação Hospitalar (AIH)</div>

        <table class="tabela-aih">
          <tr>
            <td style="width: 50%;">
              <span class="rotulo">Número da AIH:</span>
              <span class="valor">${d.numAih || '&nbsp;'}</span>
            </td>
            <td style="width: 25%;">
              <span class="rotulo">Prontuário:</span>
              <span class="valor">${d.prontuario}</span>
            </td>
            <td style="width: 25%;">
              <span class="rotulo">Tipo:</span>
              <span class="valor">${d.tipoAih}</span>
            </td>
          </tr>
          <tr>
            <td colspan="2">
              <span class="rotulo">Estabelecimento Solicitante / Executante (CNES):</span>
              <span class="valor">HOSPITAL MATERNIDADE SEVERINA CARLOS DE ANDRADE (2380846)</span>
            </td>
            <td>
              <span class="rotulo">Órgão Emissor:</span>
              <span class="valor">SESAP / RN</span>
            </td>
          </tr>
          <tr>
            <td colspan="2">
              <span class="rotulo">Data da Internação:</span>
              <span class="valor">${d.dataAdmissao}</span>
            </td>
            <td>
              <span class="rotulo">Data da Saída:</span>
              <span class="valor">${d.dataSaida || 'Em aberto'}</span>
            </td>
          </tr>
        </table>

        <div class="faixa-secao">Dados do Paciente</div>

        <table class="tabela-aih">
          <tr>
            <td style="width: 70%;" colspan="2">
              <span class="rotulo">Nome do Paciente:</span>
              <span class="valor">${d.paciente}</span>
            </td>
            <td style="width: 30%;">
              <span class="rotulo">Cartão SUS (CNS):</span>
              <span class="valor">${d.cns}</span>
            </td>
          </tr>
          <tr>
            <td style="width: 30%;">
              <span class="rotulo">Data Nascimento:</span>
              <span class="valor">${d.nascimento}</span>
            </td>
            <td style="width: 20%;">
              <span class="rotulo">Sexo:</span>
              <span class="valor">${d.sexo}</span>
            </td>
            <td style="width: 50%;">
              <span class="rotulo">Raça / Cor:</span>
              <span class="valor">${d.raca}</span>
            </td>
          </tr>
          <tr>
            <td colspan="2">
              <span class="rotulo">Nome da Mãe:</span>
              <span class="valor">${d.mae}</span>
            </td>
            <td>
              <span class="rotulo">Telefone:</span>
              <span class="valor">${d.telefone}</span>
            </td>
          </tr>
          <tr>
            <td colspan="3">
              <span class="rotulo">Endereço Residencial:</span>
              <span class="valor">${d.endereco} &bull; ${d.municipio} - ${d.uf}</span>
            </td>
          </tr>
        </table>

        <div class="faixa-secao">Dados do Procedimento e Justificativa de Internação</div>

        <table class="tabela-aih">
          <tr>
            <td style="width: 70%;">
              <span class="rotulo">Procedimento Solicitado / Realizado:</span>
              <span class="valor">${d.procedimento}</span>
            </td>
            <td style="width: 30%;">
              <span class="rotulo">Código do Procedimento:</span>
              <span class="valor">${d.codProcedimento}</span>
            </td>
          </tr>
          <tr>
            <td>
              <span class="rotulo">Especialidade / Caráter de Atendimento:</span>
              <span class="valor">${d.especialidade} &bull; Urgência/Emergência</span>
            </td>
            <td>
              <span class="rotulo">Enfermaria / Leito:</span>
              <span class="valor">${d.leito}</span>
            </td>
          </tr>
          <tr>
            <td>
              <span class="rotulo">Diagnóstico Inicial:</span>
              <span class="valor">${d.diagnostico}</span>
            </td>
            <td>
              <span class="rotulo">CID-10 Principal:</span>
              <span class="valor">${d.cid}</span>
            </td>
          </tr>
          <tr>
            <td colspan="2">
              <span class="rotulo">Principais Sinais e Sintomas Clínicos:</span>
              <div class="valor" style="min-height: 28px;">${d.sintomas}</div>
            </td>
          </tr>
          <tr>
            <td colspan="2">
              <span class="rotulo">Condições que Justificam a Internação:</span>
              <div class="valor" style="min-height: 24px;">${d.justificativa}</div>
            </td>
          </tr>
        </table>

        <!-- PROCEDIMENTOS REALIZADOS / FATURAMENTO -->
        <table class="tabela-aih" style="margin-top: 6px;">
          <tr style="background: #f1f5f9; text-align: center;">
            <th style="width: 10%;">Linha</th>
            <th style="width: 25%;">Procedimento</th>
            <th style="width: 10%;">Qtd.</th>
            <th style="width: 20%;">CPF Solicitante</th>
            <th style="width: 15%;">CBO</th>
            <th style="width: 10%;">CNES</th>
            <th style="width: 10%;">CNPJ</th>
          </tr>
          <tr style="text-align: center;">
            <td>01</td>
            <td>${d.codProcedimento}</td>
            <td>01</td>
            <td>${d.cpfMedico}</td>
            <td>225125</td>
            <td>2380846</td>
            <td>08.349.052</td>
          </tr>
        </table>

        <!-- ASSINATURAS -->
        <table class="tabela-aih" style="margin-top: 8px;">
          <tr>
            <td style="width: 50%; height: 50px; text-align: center; vertical-align: bottom;">
              <div style="border-top: 1px dotted #000; font-size: 9.5px; padding-top: 3px;">
                ${d.medico}<br>
                CPF: ${d.cpfMedico} &bull; Médico Solicitante
              </div>
            </td>
            <td style="width: 50%; height: 50px; text-align: center; vertical-align: bottom;">
              <div style="border-top: 1px dotted #000; font-size: 9.5px; padding-top: 3px;">
                AUTORIZADOR SMS / HOSPITAL<br>
                CPF: ${d.cpfAutorizador} &bull; Data: ${d.dataAdmissao}
              </div>
            </td>
          </tr>
        </table>

        <!-- PÁGINA 2: PRONTUÁRIO CLÍNICO DE INTERNAÇÃO -->
        <div class="quebra-pagina"></div>

        <div style="text-align: center; border-bottom: 2px solid #000; padding-bottom: 4px; margin-bottom: 6px;">
          <h3 style="margin: 0; font-size: 12px; text-transform: uppercase;">Estado do Rio Grande do Norte &bull; Secretaria Municipal de Saúde</h3>
          <h4 style="margin: 2px 0; font-size: 11px;">Hospital Maternidade Severina Carlos de Andrade</h4>
          <h2 style="margin: 4px 0 0 0; font-size: 12px; text-decoration: underline;">PRONTUÁRIO DE INTERNAÇÃO HOSPITALAR</h2>
        </div>

        <table class="tabela-aih">
          <tr>
            <td colspan="2"><span class="rotulo">Nome do Paciente:</span><span class="valor">${d.paciente}</span></td>
            <td><span class="rotulo">Prontuário:</span><span class="valor">${d.prontuario}</span></td>
          </tr>
          <tr>
            <td style="width: 50%;"><span class="rotulo">Endereço:</span><span class="valor">${d.endereco}</span></td>
            <td style="width: 30%;"><span class="rotulo">Município:</span><span class="valor">${d.municipio} / ${d.uf}</span></td>
            <td style="width: 20%;"><span class="rotulo">Telefone:</span><span class="valor">${d.telefone}</span></td>
          </tr>
          <tr>
            <td><span class="rotulo">Data Admissão:</span><span class="valor">${d.dataAdmissao}</span></td>
            <td><span class="rotulo">Data Alta:</span><span class="valor">${d.dataSaida || 'Em acompanhamento'}</span></td>
            <td><span class="rotulo">Leito:</span><span class="valor">${d.leito}</span></td>
          </tr>
        </table>

        <div class="faixa-secao">Sumário de História Clínica, Exame Físico e Conduta</div>
        <table class="tabela-aih">
          <tr>
            <td style="height: 120px; vertical-align: top;">
              <span class="rotulo">Histórico Clínico e Tratamento:</span>
              <p style="margin-top: 4px;">Paciente deu entrada apresentando: <strong>${d.sintomas}</strong>.</p>
              <p style="margin-top: 6px;"><strong>Diagnóstico Confirmado:</strong> ${d.diagnostico} (CID-10: ${d.cid}).</p>
              <p style="margin-top: 6px;"><strong>Procedimento Instituído:</strong> ${d.procedimento} (${d.codProcedimento}).</p>
              <p style="margin-top: 6px;">Evolução estável durante o período de permanência hospitalar.</p>
            </td>
          </tr>
        </table>

        <!-- PÁGINA 3: BOLETIM CIRÚRGICO / PROCEDIMENTOS -->
        <div class="quebra-pagina"></div>

        <div style="text-align: center; border-bottom: 2px solid #000; padding-bottom: 4px; margin-bottom: 6px;">
          <h3 style="margin: 0; font-size: 12px; text-transform: uppercase;">Hospital Maternidade Severina Carlos de Andrade</h3>
          <h2 style="margin: 4px 0 0 0; font-size: 12px; text-decoration: underline;">BOLETIM OPERATÓRIO / FICHA DE PROCEDIMENTO</h2>
        </div>

        <table class="tabela-aih">
          <tr>
            <td style="width: 70%;"><span class="rotulo">Paciente:</span><span class="valor">${d.paciente}</span></td>
            <td style="width: 30%;"><span class="rotulo">Prontuário:</span><span class="valor">${d.prontuario}</span></td>
          </tr>
          <tr>
            <td><span class="rotulo">Procedimento Realizado:</span><span class="valor">${d.procedimento}</span></td>
            <td><span class="rotulo">Código:</span><span class="valor">${d.codProcedimento}</span></td>
          </tr>
          <tr>
            <td><span class="rotulo">Cirurgião / Médico Responsável:</span><span class="valor">${d.medico}</span></td>
            <td><span class="rotulo">Data:</span><span class="valor">${d.dataAdmissao}</span></td>
          </tr>
        </table>

        <div class="faixa-secao">Descrição e Relatório Técnico</div>
        <table class="tabela-aih">
          <tr>
            <td style="height: 110px; vertical-align: top;">
              <span class="rotulo">Relatório:</span>
              <p style="margin-top: 4px;">Procedimento realizado sob técnica asséptica habitual, sem intercorrências no ato. Paciente tolerou bem a intervenção, com parâmetros estáveis.</p>
            </td>
          </tr>
        </table>

        <table class="tabela-aih" style="margin-top: 15px;">
          <tr>
            <td style="width: 50%; height: 50px; text-align: center; vertical-align: bottom;">
              <div style="border-top: 1px dotted #000; font-size: 9.5px; padding-top: 4px;">
                ${d.medico}<br>
                CRM / CPF: ${d.cpfMedico}
              </div>
            </td>
            <td style="width: 50%; height: 50px; text-align: center; vertical-align: bottom;">
              <div style="border-top: 1px dotted #000; font-size: 9.5px; padding-top: 4px;">
                Equipe de Enfermagem / Centro Cirúrgico
              </div>
            </td>
          </tr>
        </table>
      `;
    }

    function abrirVisualizacao() {
      const dados = obterDados();
      document.getElementById('documentoCompletoAIH').innerHTML = construirHtmlDocumento(dados);
      document.getElementById('modalAIH').style.display = 'flex';
    }

    function fecharModal() {
      document.getElementById('modalAIH').style.display = 'none';
    }

    function gerarPDFDireto() {
      abrirVisualizacao();
      descarregarPDF();
    }

    function gerarDocumentoWordDireto() {
      abrirVisualizacao();
      descarregarWordDOC();
    }

    /* Geração de PDF */
    function descarregarPDF() {
      const elemento = document.getElementById('documentoCompletoAIH');
      const d = obterDados();
      const nomeArquivo = `AIH_${d.prontuario}_${d.paciente.replace(/\s+/g, '_')}.pdf`;

      const opcoes = {
        margin: [6, 6, 6, 6],
        filename: nomeArquivo,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opcoes).from(elemento).save();
    }

    /* Geração do DOCX / DOC nativo sem colar palavras */
    function descarregarWordDOC() {
      const d = obterDados();
      const conteudoHTML = document.getElementById('documentoCompletoAIH').innerHTML;
      const nomeArquivo = `AIH_${d.prontuario}_${d.paciente.replace(/\s+/g, '_')}.doc`;

      // Estrutura com marcação e declaração XML exata para o Word interpretar tabelas e quebras de página
      const documentoWord = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office'
              xmlns:w='urn:schemas-microsoft-com:office:word'
              xmlns='http://www.w3.org/TR/REC-html40'>
        <head>
          <meta charset='utf-8'>
          <title>AIH Oficial</title>
          <!--[if gte mso 9]>
          <xml>
            <w:WordDocument>
              <w:View>Print</w:View>
              <w:Zoom>100</w:Zoom>
              <w:DoNotOptimizeForBrowser/>
            </w:WordDocument>
          </xml>
          <![endif]-->
          <style>
            @page {
              size: 21cm 29.7cm;
              margin: 1.2cm 1.2cm 1.2cm 1.2cm;
              mso-page-orientation: portrait;
            }
            body {
              font-family: Arial, sans-serif;
              font-size: 10pt;
              color: #000;
              line-height: 1.2;
            }
            p {
              margin: 0 0 4pt 0;
            }
            table {
              width: 100%;
              border-collapse: collapse;
              margin-bottom: 6pt;
              mso-table-lspace: 0pt;
              mso-table-rspace: 0pt;
            }
            td, th {
              border: 1pt solid #000000;
              padding: 4pt 6pt;
              vertical-align: top;
            }
            .rotulo {
              font-size: 7.5pt;
              font-weight: bold;
              text-transform: uppercase;
              color: #333333;
              display: block;
              margin-bottom: 2pt;
            }
            .valor {
              font-size: 10pt;
              font-weight: bold;
              color: #000000;
            }
            .faixa-secao {
              background-color: #E2E8F0;
              border: 1pt solid #000000;
              font-weight: bold;
              text-align: center;
              padding: 3pt;
              font-size: 10pt;
              text-transform: uppercase;
              margin: 8pt 0 4pt 0;
            }
            .quebra-pagina {
              page-break-before: always;
              mso-break-type: page-break;
            }
          </style>
        </head>
        <body>
          ${conteudoHTML}
        </body>
        </html>
      `;

      const blob = new Blob(['\ufeff' + documentoWord], {
        type: 'application/msword;charset=utf-8'
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = nomeArquivo;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
