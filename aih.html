<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emissão AIH Oficial</title>
  
  <!-- Biblioteca para gerar o ficheiro PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: #1e293b;
      padding: 16px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    header.app-header {
      border-bottom: 2px solid #0284c7;
      padding-bottom: 12px;
      margin-bottom: 20px;
      text-align: center;
    }

    header.app-header h1 {
      font-size: 1.3rem;
      color: #0369a1;
      text-transform: uppercase;
    }

    header.app-header h2 {
      font-size: 1rem;
      font-weight: normal;
      color: #475569;
    }

    fieldset {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
    }

    legend {
      padding: 0 8px;
      font-weight: bold;
      color: #0284c7;
      font-size: 0.95rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.col-full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: #334155;
    }

    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #94a3b8;
      border-radius: 4px;
      font-size: 0.9rem;
      background: #fff;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #0284c7;
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
    }

    .btn-principal {
      display: block;
      width: 100%;
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-principal:hover {
      background: #0369a1;
    }

    /* Janela Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.75);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .modal-janela {
      background: #e2e8f0;
      width: 100%;
      max-width: 900px;
      max-height: 96vh;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .modal-cabecalho {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 12px 18px;
      border-bottom: 2px solid #cbd5e1;
      flex-wrap: wrap;
      gap: 8px;
    }

    .modal-titulo {
      font-size: 1.1rem;
      font-weight: bold;
      color: #0f172a;
    }

    .modal-botoes {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-modal {
      border: none;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
    }

    .btn-doc { background: #1e3a8a; } /* Word */
    .btn-pdf { background: #dc2626; } /* PDF */
    .btn-imprimir { background: #0284c7; }
    .btn-fechar { background: #64748b; }

    .modal-conteudo-scroll {
      padding: 16px;
      overflow-y: auto;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      justify-content: center;
      background: #64748b;
    }

    .folha-documento {
      background: #ffffff;
      width: 100%;
      min-width: 680px;
      max-width: 800px;
      padding: 24px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      color: #000;
    }

    .tabela-aih {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 6px;
    }

    .tabela-aih td, .tabela-aih th {
      border: 1px solid #000;
      padding: 4px 6px;
      vertical-align: top;
    }

    .tag-campo {
      font-size: 8.5px;
      font-weight: bold;
      text-transform: uppercase;
      color: #333;
      display: block;
      margin-bottom: 2px;
    }

    .conteudo-campo {
      font-size: 11px;
      font-weight: 600;
      color: #000;
    }

    @media print {
      body * {
        visibility: hidden;
      }
      #folhaAihImpressao, #folhaAihImpressao * {
        visibility: visible;
      }
      #folhaAihImpressao {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        min-width: 100%;
        padding: 0;
      }
      .modal-overlay, .modal-janela, .modal-conteudo-scroll {
        position: static;
        background: transparent;
      }
      .modal-cabecalho {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="app-header">
      <h1>Emissão AIH Oficial</h1>
      <h2>Hospital Maternidade Severina Carlos de Andrade &bull; Frutuoso Gomes - RN</h2>
    </header>

    <form id="formAIH" onsubmit="event.preventDefault(); gerarVisualizacao();">
      
      <fieldset>
        <legend>1. Registo e Estabelecimento</legend>
        <div class="form-grid">
          <div class="form-group">
            <label>Nº do Prontuário</label>
            <input type="text" id="prontuario" required placeholder="Ex: 7521">
          </div>
          <div class="form-group">
            <label>Nº da AIH</label>
            <input type="text" id="num_aih" placeholder="Opcional">
          </div>
          <div class="form-group">
            <label>Tipo</label>
            <select id="tipo_aih">
              <option value="01 - Inicial">01 - Inicial</option>
              <option value="02 - Continuidade">02 - Continuidade</option>
            </select>
          </div>
          <div class="form-group">
            <label>Data Admissão</label>
            <input type="date" id="data_admissao" required>
          </div>
          <div class="form-group">
            <label>Data Saída / Alta</label>
            <input type="date" id="data_saida">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>2. Dados do Paciente</legend>
        <div class="form-grid">
          <div class="form-group col-full">
            <label>Nome do Paciente</label>
            <input type="text" id="paciente" required placeholder="Nome do paciente">
          </div>
          <div class="form-group">
            <label>Cartão SUS (CNS)</label>
            <input type="text" id="cns" placeholder="000 0000 0000 0000">
          </div>
          <div class="form-group">
            <label>Data de Nascimento</label>
            <input type="date" id="nascimento">
          </div>
          <div class="form-group">
            <label>Sexo</label>
            <select id="sexo">
              <option value="F">Feminino</option>
              <option value="M">Masculino</option>
            </select>
          </div>
          <div class="form-group">
            <label>Raça / Cor</label>
            <select id="raca">
              <option value="PARDA">Parda</option>
              <option value="BRANCA">Branca</option>
              <option value="PRETA">Preta</option>
              <option value="AMARELA">Amarela</option>
              <option value="INDIGENA">Indígena</option>
            </select>
          </div>
          <div class="form-group col-full">
            <label>Nome da Mãe</label>
            <input type="text" id="mae" placeholder="Nome da mãe">
          </div>
          <div class="form-group col-full">
            <label>Endereço Completo</label>
            <input type="text" id="endereco" placeholder="Rua, número, bairro ou sítio">
          </div>
          <div class="form-group">
            <label>Município</label>
            <input type="text" id="municipio" value="Frutuoso Gomes">
          </div>
          <div class="form-group">
            <label>UF</label>
            <input type="text" id="uf" value="RN">
          </div>
          <div class="form-group">
            <label>Telefone</label>
            <input type="text" id="telefone" placeholder="(84) 90000-0000">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>3. Procedimento e Justificativa Clínica</legend>
        <div class="form-grid">
          <div class="form-group">
            <label>Especialidade</label>
            <input type="text" id="especialidade" value="CLÍNICA MÉDICA">
          </div>
          <div class="form-group">
            <label>Leito / Enfermaria</label>
            <input type="text" id="leito" value="01">
          </div>
          <div class="form-group">
            <label>CID-10 Principal</label>
            <input type="text" id="cid" required placeholder="Ex: D23 ou I10">
          </div>
          <div class="form-group">
            <label>Diagnóstico Inicial</label>
            <input type="text" id="diagnostico" required placeholder="Ex: Outras neoplasias benignas da pele">
          </div>
          <div class="form-group">
            <label>Código do Procedimento</label>
            <input type="text" id="cod_procedimento" placeholder="Ex: 0401020045">
          </div>
          <div class="form-group col-full">
            <label>Descrição do Procedimento</label>
            <input type="text" id="procedimento" placeholder="Ex: EXCISAO E ENXERTO DE PELE">
          </div>
          <div class="form-group col-full">
            <label>Sinais e Sintomas Clínicos</label>
            <textarea id="sintomas" rows="2" placeholder="Histórico clínico..."></textarea>
          </div>
          <div class="form-group col-full">
            <label>Condições que Justificam a Internação</label>
            <textarea id="justificativa" rows="2">Quadro clínico com necessidade de intervenção e acompanhamento hospitalar.</textarea>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>4. Profissional Solicitante</legend>
        <div class="form-grid">
          <div class="form-group col-full">
            <label>Médico Solicitante</label>
            <input type="text" id="medico" value="LUCÍDIO JÁCOME FERREIRA">
          </div>
          <div class="form-group">
            <label>CPF Solicitante</label>
            <input type="text" id="cpf_medico" value="175.499.574-87">
          </div>
        </div>
      </fieldset>

      <button type="submit" class="btn-principal">Visualizar e Emitir AIH</button>
    </form>
  </div>

  <!-- Modal com ambas as opções de exportação -->
  <div id="modalAIH" class="modal-overlay" style="display: none;">
    <div class="modal-janela">
      <div class="modal-cabecalho">
        <div class="modal-titulo">Visualização da AIH Gerada</div>
        <div class="modal-botoes">
          <!-- Botão Word (.doc) -->
          <button type="button" class="btn-modal btn-doc" onclick="descarregarWordDOC()">Baixar DOC (Word)</button>
          <!-- Botão PDF (.pdf) -->
          <button type="button" class="btn-modal btn-pdf" onclick="descarregarPDF()">Baixar PDF</button>
          <!-- Botão Imprimir Direto -->
          <button type="button" class="btn-modal btn-imprimir" onclick="imprimirAIH()">Imprimir</button>
          <!-- Botão Fechar -->
          <button type="button" class="btn-modal btn-fechar" onclick="fecharModal()">Fechar</button>
        </div>
      </div>

      <div class="modal-conteudo-scroll">
        <div id="folhaAihImpressao" class="folha-documento"></div>
      </div>
    </div>
  </div>

  <script>
    function formatarData(dataStr) {
      if (!dataStr) return '';
      const partes = dataStr.split('-');
      if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
      return dataStr;
    }

    function gerarVisualizacao() {
      const prontuario = document.getElementById('prontuario').value;
      const numAih = document.getElementById('num_aih').value;
      const tipoAih = document.getElementById('tipo_aih').value;
      const dataAdmissao = formatarData(document.getElementById('data_admissao').value);
      const dataSaida = formatarData(document.getElementById('data_saida').value);
      const paciente = document.getElementById('paciente').value;
      const cns = document.getElementById('cns').value;
      const nascimento = formatarData(document.getElementById('nascimento').value);
      const sexo = document.getElementById('sexo').value;
      const raca = document.getElementById('raca').value;
      const mae = document.getElementById('mae').value;
      const endereco = document.getElementById('endereco').value;
      const municipio = document.getElementById('municipio').value;
      const uf = document.getElementById('uf').value;
      const telefone = document.getElementById('telefone').value;
      const especialidade = document.getElementById('especialidade').value;
      const leito = document.getElementById('leito').value;
      const cid = document.getElementById('cid').value;
      const diagnostico = document.getElementById('diagnostico').value;
      const codProcedimento = document.getElementById('cod_procedimento').value;
      const procedimento = document.getElementById('procedimento').value;
      const sintomas = document.getElementById('sintomas').value;
      const justificativa = document.getElementById('justificativa').value;
      const medico = document.getElementById('medico').value;
      const cpfMedico = document.getElementById('cpf_medico').value;

      const htmlDocumento = `
        <div style="text-align: center; border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 10px;">
          <h3 style="margin: 0; font-size: 13px; text-transform: uppercase;">Prefeitura Municipal de Frutuoso Gomes</h3>
          <h4 style="margin: 2px 0; font-size: 11px;">Hospital Maternidade Severina Carlos de Andrade</h4>
          <p style="margin: 0; font-size: 10px;">CNPJ: 08.349.052/0001-80 &bull; Frutuoso Gomes - RN</p>
        </div>

        <div style="font-size: 12px; font-weight: bold; text-align: center; background: #e2e8f0; border: 1px solid #000; padding: 4px; margin-bottom: 6px; text-transform: uppercase;">
          Autorização para Internação Hospitalar (AIH)
        </div>

        <table class="tabela-aih">
          <tr>
            <td style="width: 70%;">
              <span class="tag-campo">1 - Estabelecimento Solicitante / Executante</span>
              <span class="conteudo-campo">HOSPITAL MATERNIDADE SEVERINA CARLOS DE ANDRADE</span>
            </td>
            <td style="width: 30%;">
              <span class="tag-campo">2 - CNES</span>
              <span class="conteudo-campo">2380846</span>
            </td>
          </tr>
          <tr>
            <td>
              <span class="tag-campo">Número da AIH</span>
              <span class="conteudo-campo">${numAih || '&nbsp;'}</span>
            </td>
            <td>
              <span class="tag-campo">Prontuário</span>
              <span class="conteudo-campo">${prontuario}</span>
            </td>
          </tr>
          <tr>
            <td>
              <span class="tag-campo">Tipo de AIH</span>
              <span class="conteudo-campo">${tipoAih}</span>
            </td>
            <td>
              <span class="tag-campo">Período de Atendimento</span>
              <span class="conteudo-campo">${dataAdmissao} a ${dataSaida || 'Em aberto'}</span>
            </td>
          </tr>
        </table>

        <div style="font-size: 11px; font-weight: bold; text-align: center; background: #e2e8f0; border: 1px solid #000; padding: 3px; margin: 8px 0 6px 0; text-transform: uppercase;">
          Dados do Paciente
        </div>
        
        <table class="tabela-aih">
          <tr>
            <td colspan="2" style="width: 70%;">
              <span class="tag-campo">Nome do Paciente</span>
              <span class="conteudo-campo">${paciente}</span>
            </td>
            <td style="width: 30%;">
              <span class="tag-campo">Cartão SUS (CNS)</span>
              <span class="conteudo-campo">${cns || '&nbsp;'}</span>
            </td>
          </tr>
          <tr>
            <td style="width: 35%;">
              <span class="tag-campo">Data de Nascimento</span>
              <span class="conteudo-campo">${nascimento || '&nbsp;'}</span>
            </td>
            <td style="width: 20%;">
              <span class="tag-campo">Sexo</span>
              <span class="conteudo-campo">${sexo}</span>
            </td>
            <td style="width: 45%;">
              <span class="tag-campo">Raça / Cor</span>
              <span class="conteudo-campo">${raca}</span>
            </td>
          </tr>
          <tr>
            <td colspan="2">
              <span class="tag-campo">Nome da Mãe</span>
              <span class="conteudo-campo">${mae || '&nbsp;'}</span>
            </td>
            <td>
              <span class="tag-campo">Telefone</span>
              <span class="conteudo-campo">${telefone || '&nbsp;'}</span>
            </td>
          </tr>
          <tr>
            <td colspan="3">
              <span class="tag-campo">Endereço Residencial</span>
              <span class="conteudo-campo">${endereco} - ${municipio}/${uf}</span>
            </td>
          </tr>
        </table>

        <div style="font-size: 11px; font-weight: bold; text-align: center; background: #e2e8f0; border: 1px solid #000; padding: 3px; margin: 8px 0 6px 0; text-transform: uppercase;">
          Dados Clínicos e Justificativa de Internação
        </div>

        <table class="tabela-aih">
          <tr>
            <td style="width: 70%;">
              <span class="tag-campo">Especialidade / Clínica</span>
              <span class="conteudo-campo">${especialidade}</span>
            </td>
            <td style="width: 30%;">
              <span class="tag-campo">Leito / Enfermaria</span>
              <span class="conteudo-campo">${leito}</span>
            </td>
          </tr>
          <tr>
            <td colspan="2">
              <span class="tag-campo">Principais Sinais e Sintomas Clínicos</span>
              <div class="conteudo-campo" style="min-height: 28px;">${sintomas || '&nbsp;'}</div>
            </td>
          </tr>
          <tr>
            <td colspan="2">
              <span class="tag-campo">Condições que Justificam a Internação</span>
              <div class="conteudo-campo" style="min-height: 25px;">${justificativa || '&nbsp;'}</div>
            </td>
          </tr>
          <tr>
            <td>
              <span class="tag-campo">Diagnóstico Inicial</span>
              <span class="conteudo-campo">${diagnostico}</span>
            </td>
            <td>
              <span class="tag-campo">CID-10 Principal</span>
              <span class="conteudo-campo">${cid}</span>
            </td>
          </tr>
          <tr>
            <td>
              <span class="tag-campo">Procedimento Solicitado / Realizado</span>
              <span class="conteudo-campo">${procedimento || '&nbsp;'}</span>
            </td>
            <td>
              <span class="tag-campo">Código do Procedimento</span>
              <span class="conteudo-campo">${codProcedimento || '&nbsp;'}</span>
            </td>
          </tr>
        </table>

        <div style="font-size: 11px; font-weight: bold; text-align: center; background: #e2e8f0; border: 1px solid #000; padding: 3px; margin: 8px 0 6px 0; text-transform: uppercase;">
          Profissional Solicitante e Autorização
        </div>

        <table class="tabela-aih">
          <tr>
            <td style="width: 60%; height: 60px; vertical-align: bottom;">
              <div style="border-top: 1px dotted #000; text-align: center; font-size: 10px; margin-top: 35px;">
                ${medico}<br>
                CPF: ${cpfMedico} &bull; Médico Solicitante
              </div>
            </td>
            <td style="width: 40%; vertical-align: middle;">
              <span class="tag-campo">Data da Solicitação</span>
              <span class="conteudo-campo">${dataAdmissao || new Date().toLocaleDateString('pt-BR')}</span>
              <br><br>
              <span class="tag-campo">Caráter do Atendimento</span>
              <span class="conteudo-campo">Urgência / Emergência</span>
            </td>
          </tr>
        </table>
      `;

      document.getElementById('folhaAihImpressao').innerHTML = htmlDocumento;
      document.getElementById('modalAIH').style.display = 'flex';
    }

    function fecharModal() {
      document.getElementById('modalAIH').style.display = 'none';
    }

    function imprimirAIH() {
      window.print();
    }

    /* 1. Função para Gerar e Baixar PDF */
    function descarregarPDF() {
      const elemento = document.getElementById('folhaAihImpressao');
      const prontuario = document.getElementById('prontuario').value || 'doc';
      const paciente = document.getElementById('paciente').value || 'paciente';
      const nomeLimpo = `AIH_${prontuario}_${paciente.replace(/\s+/g, '_')}.pdf`;

      const opcoes = {
        margin: [8, 8, 8, 8],
        filename: nomeLimpo,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opcoes).from(elemento).save();
    }

    /* 2. Função para Gerar e Baixar DOC (Word) */
    function descarregarWordDOC() {
      const conteudoHTML = document.getElementById('folhaAihImpressao').innerHTML;
      const prontuario = document.getElementById('prontuario').value || 'doc';
      const paciente = document.getElementById('paciente').value || 'paciente';
      const nomeFicheiro = `AIH_${prontuario}_${paciente.replace(/\s+/g, '_')}.doc`;

      const documentoWordCompleto = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' 
              xmlns:w='urn:schemas-microsoft-com:office:word' 
              xmlns='http://www.w3.org/TR/REC-html40'>
        <head>
          <meta charset='utf-8'>
          <title>AIH Oficial</title>
          <!--[if gte mso 9]>
          <xml>
            <w:WordDocument>
              <w:View>Print</w:View>
              <w:Zoom>100</w:Zoom>
              <w:DoNotOptimizeForBrowser/>
            </w:WordDocument>
          </xml>
          <![endif]-->
          <style>
            @page {
              size: A4 portrait;
              margin: 1.5cm 1.5cm 1.5cm 1.5cm;
              mso-page-orientation: portrait;
            }
            body {
              font-family: Arial, sans-serif;
              font-size: 11pt;
              color: #000;
            }
            table {
              width: 100%;
              border-collapse: collapse;
              margin-bottom: 8px;
            }
            td, th {
              border: 1pt solid #000;
              padding: 4pt 6pt;
              vertical-align: top;
            }
            .tag-campo {
              font-size: 8pt;
              font-weight: bold;
              text-transform: uppercase;
              color: #333;
              display: block;
            }
            .conteudo-campo {
              font-size: 10.5pt;
              font-weight: bold;
              color: #000;
            }
          </style>
        </head>
        <body>
          ${conteudoHTML}
        </body>
        </html>
      `;

      const blob = new Blob(['\ufeff' + documentoWordCompleto], {
        type: 'application/msword;charset=utf-8'
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = nomeFicheiro;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
