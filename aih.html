<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emissão AIH Oficial</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #cbd5e1;
      padding: 16px;
      color: #000;
    }

    /* Painel do Formulário */
    .painel-form {
      max-width: 850px;
      margin: 0 auto 20px auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
    }

    .painel-form h2 {
      text-align: center;
      color: #0369a1;
      font-size: 1.2rem;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    fieldset {
      border: 1px solid #94a3b8;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
    }

    legend {
      padding: 0 6px;
      font-weight: bold;
      color: #0284c7;
      font-size: 0.85rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
    }

    .campo {
      display: flex;
      flex-direction: column;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.75rem;
      font-weight: bold;
      color: #334155;
      margin-bottom: 3px;
    }

    input, select, textarea {
      padding: 7px 9px;
      border: 1px solid #94a3b8;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    .botoes-topo {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 140px;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      color: #ffffff;
      text-align: center;
    }

    .btn-atualizar { background: #0284c7; }
    .btn-word { background: #1e3a8a; }
    .btn-pdf { background: #dc2626; }

    /* Folha Visual idêntica ao blob.pdf */
    #documentoImpressao {
      max-width: 820px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10.5px;
      line-height: 1.25;
      color: #000;
    }

    .cabecalho-principal {
      text-align: center;
      margin-bottom: 8px;
    }

    .cabecalho-principal h3 {
      font-size: 12.5px;
      font-weight: bold;
      text-transform: uppercase;
      margin: 0;
    }

    .cabecalho-principal h4 {
      font-size: 11px;
      margin: 1px 0;
      font-weight: normal;
    }

    .cabecalho-principal p {
      font-size: 9.5px;
      margin: 0;
    }

    .titulo-secao {
      font-size: 11px;
      font-weight: bold;
      text-align: center;
      text-transform: uppercase;
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
      padding: 3px 0;
      margin: 6px 0;
      background: #fff;
    }

    .tab-oficial {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 6px;
      table-layout: fixed;
    }

    .tab-oficial td, .tab-oficial th {
      border: 1px solid #000;
      padding: 3px 6px;
      vertical-align: top;
      word-wrap: break-word;
    }

    .rotulo {
      font-size: 8px;
      font-weight: bold;
      text-transform: uppercase;
      color: #222;
      display: block;
      margin-bottom: 1px;
    }

    .conteudo {
      font-size: 10.5px;
      font-weight: bold;
      color: #000;
    }

    .quebra-pagina {
      page-break-before: always;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 2px dashed #94a3b8;
    }

    /* Regras de Impressão (Gera PDF idêntico) */
    @media print {
      body {
        background: #fff;
        padding: 0;
      }
      .painel-form, .botoes-topo {
        display: none !important;
      }
      #documentoImpressao {
        width: 100%;
        max-width: 100%;
        padding: 0;
        margin: 0;
        box-shadow: none;
      }
      .quebra-pagina {
        page-break-before: always;
        border-top: none;
        margin-top: 0;
        padding-top: 0;
      }
    }
  </style>
</head>
<body>

  <!-- 1. PAINEL DE ENTRADA DE DADOS -->
  <div class="painel-form">
    <h2>Emissão AIH Oficial &bull; Frutuoso Gomes</h2>
    <form id="formularioAIH" onsubmit="event.preventDefault(); renderizarDocumento();">
      
      <fieldset>
        <legend>Dados da AIH e Estabelecimento</legend>
        <div class="grid">
          <div class="campo">
            <label>Nº Prontuário</label>
            <input type="text" id="prontuario" value="4819" required>
          </div>
          <div class="campo">
            <label>Nº da AIH</label>
            <input type="text" id="num_aih" placeholder="Opcional">
          </div>
          <div class="campo">
            <label>Tipo</label>
            <select id="tipo_aih">
              <option value="01 – Inicial">01 – Inicial</option>
              <option value="02 – Continuidade" selected>02 – Continuidade</option>
            </select>
          </div>
          <div class="campo">
            <label>Data Admissão/Internação</label>
            <input type="date" id="data_internacao" value="2026-09-04">
          </div>
          <div class="campo">
            <label>Data de Saída / Alta</label>
            <input type="date" id="data_saida" value="2026-09-06">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Dados do Paciente</legend>
        <div class="grid">
          <div class="campo full">
            <label>Nome Completo do Paciente</label>
            <input type="text" id="paciente" value="JUCIENE ALVES CAMARA FERREIRA" required>
          </div>
          <div class="campo">
            <label>Cartão SUS (CNS)</label>
            <input type="text" id="cns" value="702 9095 5587 9470">
          </div>
          <div class="campo">
            <label>Data de Nascimento</label>
            <input type="date" id="nascimento" value="1980-05-12">
          </div>
          <div class="campo">
            <label>Sexo</label>
            <select id="sexo">
              <option value="F" selected>Feminino</option>
              <option value="M">Masculino</option>
            </select>
          </div>
          <div class="campo">
            <label>Raça / Cor</label>
            <select id="raca">
              <option value="PARDA" selected>Parda</option>
              <option value="BRANCA">Branca</option>
              <option value="PRETA">Preta</option>
            </select>
          </div>
          <div class="campo full">
            <label>Nome da Mãe</label>
            <input type="text" id="mae" value="MARIA ALVES DA SILVA">
          </div>
          <div class="campo full">
            <label>Endereço</label>
            <input type="text" id="endereco" value="RUA ROLDÃO DANTAS, Nº 34 - CENTRO">
          </div>
          <div class="campo">
            <label>Telefone</label>
            <input type="text" id="telefone" value="(84) 99688-3488">
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Dados Clínicos e Procedimento</legend>
        <div class="grid">
          <div class="campo">
            <label>CID-10 Principal</label>
            <input type="text" id="cid" value="I10" required>
          </div>
          <div class="campo">
            <label>Diagnóstico Inicial</label>
            <input type="text" id="diagnostico" value="CRISE HIPERTENSIVA" required>
          </div>
          <div class="campo">
            <label>Código do Procedimento</label>
            <input type="text" id="cod_proc" value="0303060107">
          </div>
          <div class="campo full">
            <label>Descrição do Procedimento</label>
            <input type="text" id="nome_proc" value="TRATAMENTO DE CRISE HIPERTENSIVA">
          </div>
          <div class="campo full">
            <label>Sinais e Sintomas Clínicos</label>
            <textarea id="sintomas" rows="2">Cefaleia de forte intensidade, náuseas, tontura e níveis pressóricos elevados na admissão.</textarea>
          </div>
          <div class="campo full">
            <label>Condições que Justificam a Internação</label>
            <textarea id="justificativa" rows="2">Quadro clínico agudo com necessidade de monitorização intensiva e terapêutica parenteral.</textarea>
          </div>
        </div>
      </fieldset>

      <!-- BOTÕES SUPERIORES DIRETOS -->
      <div class="botoes-topo">
        <button type="submit" class="btn btn-atualizar">Atualizar Visualização</button>
        <button type="button" onclick="baixarWordDoc()" class="btn btn-word">Baixar DOC (Word)</button>
        <button type="button" onclick="baixarPDFOficial()" class="btn btn-pdf">Baixar PDF Oficial</button>
      </div>

    </form>
  </div>

  <!-- 2. DOCUMENTO OFICIAL DAS 5 PÁGINAS (ESTRUTURA ORIGINAL DO BLOB.PDF) -->
  <div id="documentoImpressao"></div>

  <script>
    function formatarData(str) {
      if (!str) return '';
      const p = str.split('-');
      return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : str;
    }

    function lerDados() {
      return {
        prontuario: document.getElementById('prontuario').value || '',
        numAih: document.getElementById('num_aih').value || '',
        tipoAih: document.getElementById('tipo_aih').value || '02 – Continuidade',
        dataInternacao: formatarData(document.getElementById('data_internacao').value),
        dataSaida: formatarData(document.getElementById('data_saida').value),
        paciente: document.getElementById('paciente').value || '',
        cns: document.getElementById('cns').value || '',
        nascimento: formatarData(document.getElementById('nascimento').value),
        sexo: document.getElementById('sexo').value || 'F',
        raca: document.getElementById('raca').value || 'PARDA',
        mae: document.getElementById('mae').value || '',
        endereco: document.getElementById('endereco').value || '',
        telefone: document.getElementById('telefone').value || '',
        cid: document.getElementById('cid').value || '',
        diagnostico: document.getElementById('diagnostico').value || '',
        codProc: document.getElementById('cod_proc').value || '',
        nomeProc: document.getElementById('nome_proc').value || '',
        sintomas: document.getElementById('sintomas').value || '',
        justificativa: document.getElementById('justificativa').value || '',
        medico: 'LUCÍDIO JÁCOME FERREIRA',
        cpfMedico: '175.499.574-87'
      };
    }

    function montarHtmlBlob(d) {
      // Cruz oficial do SUS em vetor SVG nítido
      const svgCruz = `
        <svg width="32" height="32" viewBox="0 0 100 100" style="vertical-align: middle;">
          <path d="M35 5 H65 V35 H95 V65 H65 V95 H35 V65 H5 V35 H35 Z" fill="#005ca9"/>
        </svg>
      `;

      return `
        <!-- PÁGINA 1: AUTORIZAÇÃO PARA INTERNAÇÃO HOSPITALAR -->
        <div class="cabecalho-principal">
          <h3>PREFEITURA MUNICIPAL DE FRUTUOSO GOMES</h3>
          <h4>Hospital Maternidade Severina Carlos de Andrade</h4>
          <p>C.N.P.J 08.349.052/0001-80 &bull; Frutuoso Gomes - RN</p>
        </div>

        <div class="titulo-secao">AUTORIZAÇÃO PARA INTERNAÇÃO HOSPITALAR</div>

        <table class="tab-oficial">
          <tr>
            <td style="width: 45%;"><span class="rotulo">Número da AIH:</span><span class="conteudo">${d.numAih || '&nbsp;'}</span></td>
            <td style="width: 25%;"><span class="rotulo">Prontuário:</span><span class="conteudo">${d.prontuario}</span></td>
            <td style="width: 30%;"><span class="rotulo">Tipo:</span><span class="conteudo">${d.tipoAih}</span></td>
          </tr>
          <tr>
            <td colspan="2"><span class="rotulo">Apresentação:</span><span class="conteudo">ESTADUAL</span></td>
            <td><span class="rotulo">Órgão Emissor:</span><span class="conteudo">SESAP / RN</span></td>
          </tr>
          <tr>
            <td colspan="2"><span class="rotulo">Data da Internação:</span><span class="conteudo">${d.dataInternacao}</span></td>
            <td><span class="rotulo">Data da Saída:</span><span class="conteudo">${d.dataSaida}</span></td>
          </tr>
        </table>

        <div class="titulo-secao">DADOS DO PACIENTE</div>

        <table class="tab-oficial">
          <tr>
            <td colspan="2" style="width: 70%;"><span class="rotulo">Nome do Paciente:</span><span class="conteudo">${d.paciente}</span></td>
            <td style="width: 30%;"><span class="rotulo">Cartão SUS:</span><span class="conteudo">${d.cns}</span></td>
          </tr>
          <tr>
            <td style="width: 35%;"><span class="rotulo">Data de Nascimento:</span><span class="conteudo">${d.nascimento}</span></td>
            <td style="width: 25%;"><span class="rotulo">Sexo:</span><span class="conteudo">${d.sexo}</span></td>
            <td style="width: 40%;"><span class="rotulo">Raça/Cor:</span><span class="conteudo">${d.raca}</span></td>
          </tr>
          <tr>
            <td colspan="2"><span class="rotulo">Nome da Mãe:</span><span class="conteudo">${d.mae}</span></td>
            <td><span class="rotulo">Telefone:</span><span class="conteudo">${d.telefone}</span></td>
          </tr>
          <tr>
            <td colspan="3"><span class="rotulo">Endereço:</span><span class="conteudo">${d.endereco} - FRUTUOSO GOMES/RN</span></td>
          </tr>
        </table>

        <div class="titulo-secao">DADOS DO PROCEDIMENTO</div>

        <table class="tab-oficial">
          <tr>
            <td style="width: 70%;"><span class="rotulo">Procedimento Solicitado / Realizado:</span><span class="conteudo">${d.nomeProc}</span></td>
            <td style="width: 30%;"><span class="rotulo">Código:</span><span class="conteudo">${d.codProc}</span></td>
          </tr>
          <tr>
            <td><span class="rotulo">Especialidade:</span><span class="conteudo">CLÍNICA MÉDICA</span></td>
            <td><span class="rotulo">Enfermaria / Leito:</span><span class="conteudo">M / 01</span></td>
          </tr>
          <tr>
            <td><span class="rotulo">Diagnóstico Inicial:</span><span class="conteudo">${d.diagnostico}</span></td>
            <td><span class="rotulo">CID Principal:</span><span class="conteudo">${d.cid}</span></td>
          </tr>
          <tr>
            <td><span class="rotulo">CPF Solicitante:</span><span class="conteudo">${d.cpfMedico}</span></td>
            <td><span class="rotulo">CPF Autorizador:</span><span class="conteudo">185.901.284-15</span></td>
          </tr>
        </table>

        <div class="titulo-secao">PROCEDIMENTOS REALIZADOS</div>
        <table class="tab-oficial" style="text-align: center;">
          <tr style="background: #f8fafc;">
            <th style="width: 10%;">Linha</th>
            <th style="width: 25%;">Procedimento</th>
            <th style="width: 10%;">Qtd.</th>
            <th style="width: 20%;">CPF</th>
            <th style="width: 15%;">CBO</th>
            <th style="width: 10%;">CNES</th>
            <th style="width: 10%;">CNPJ</th>
          </tr>
          <tr>
            <td>01</td><td>${d.codProc}</td><td>01</td><td>${d.cpfMedico}</td><td>225125</td><td>2380846</td><td>08.349.052</td>
          </tr>
        </table>

        <!-- PÁGINA 2: LAUDO SUS COM LOGO -->
        <div class="quebra-pagina"></div>

        <table style="width: 100%; margin-bottom: 8px;">
          <tr>
            <td style="width: 45px; vertical-align: middle;">${svgCruz}</td>
            <td style="vertical-align: middle; padding-left: 8px;">
              <span style="font-size: 13px; font-weight: bold; color: #005ca9;">SUS</span> &bull; 
              <span style="font-size: 9.5px; font-weight: bold; text-transform: uppercase;">Sistema Único de Saúde / Ministério da Saúde</span>
            </td>
          </tr>
        </table>

        <div class="titulo-secao">LAUDO PARA SOLICITAÇÃO DE AUTORIZAÇÃO DE INTERNAÇÃO HOSPITALAR</div>

        <table class="tab-oficial">
          <tr>
            <td style="width: 75%;"><span class="rotulo">1. Nome do Estabelecimento Solicitante / Executante:</span><span class="conteudo">HOSPITAL MATERNIDADE SEVERINA CARLOS DE ANDRADE</span></td>
            <td style="width: 25%;"><span class="rotulo">2. CNES:</span><span class="conteudo">2380846</span></td>
          </tr>
        </table>

        <div class="titulo-secao">JUSTIFICATIVA DA INTERNAÇÃO</div>

        <table class="tab-oficial">
          <tr>
            <td colspan="2"><span class="rotulo">17. Principais Sinais e Sintomas Clínicos:</span><div class="conteudo" style="min-height: 25px;">${d.sintomas}</div></td>
          </tr>
          <tr>
            <td colspan="2"><span class="rotulo">18. Condições que Justificam a Internação:</span><div class="conteudo" style="min-height: 25px;">${d.justificativa}</div></td>
          </tr>
          <tr>
            <td style="width: 70%;"><span class="rotulo">20. Diagnóstico Inicial:</span><span class="conteudo">${d.diagnostico}</span></td>
            <td style="width: 30%;"><span class="rotulo">21. CID 10 Principal:</span><span class="conteudo">${d.cid}</span></td>
          </tr>
          <tr>
            <td><span class="rotulo">24. Descrição do Procedimento Solicitado:</span><span class="conteudo">${d.nomeProc}</span></td>
            <td><span class="rotulo">25. Código:</span><span class="conteudo">${d.codProc}</span></td>
          </tr>
        </table>

        <table class="tab-oficial" style="margin-top: 10px;">
          <tr>
            <td style="width: 50%; height: 50px; vertical-align: bottom; text-align: center;">
              <div style="border-top: 1px dotted #000; font-size: 9px;">
                ${d.medico}<br>CPF: ${d.cpfMedico} &bull; Médico Solicitante
              </div>
            </td>
            <td style="width: 50%; height: 50px; vertical-align: bottom; text-align: center;">
              <div style="border-top: 1px dotted #000; font-size: 9px;">
                Profissional Autorizador<br>Data: ${d.dataInternacao}
              </div>
            </td>
          </tr>
        </table>

        <!-- PÁGINA 3: PRONTUÁRIO DE INTERNAÇÃO -->
        <div class="quebra-pagina"></div>

        <div class="cabecalho-principal">
          <h3>ESTADO DO RIO GRANDE DO NORTE &bull; SMS DE FRUTUOSO GOMES</h3>
          <h4>Hospital Maternidade Severina Carlos de Andrade</h4>
          <h2 style="font-size: 12px; margin: 4px 0; text-decoration: underline;">PRONTUÁRIO DE INTERNAÇÃO</h2>
        </div>

        <table class="tab-oficial">
          <tr>
            <td colspan="2"><span class="rotulo">Nome do Paciente:</span><span class="conteudo">${d.paciente}</span></td>
            <td><span class="rotulo">Nº do Prontuário:</span><span class="conteudo">${d.prontuario}</span></td>
          </tr>
          <tr>
            <td colspan="2"><span class="rotulo">Endereço:</span><span class="conteudo">${d.endereco}</span></td>
            <td><span class="rotulo">Data Admissão:</span><span class="conteudo">${d.dataInternacao}</span></td>
          </tr>
          <tr>
            <td><span class="rotulo">Diagnóstico Inicial:</span><span class="conteudo">${d.diagnostico}</span></td>
            <td><span class="rotulo">Diagnóstico Final:</span><span class="conteudo">${d.diagnostico}</span></td>
            <td><span class="rotulo">Alta:</span><span class="conteudo">${d.dataSaida}</span></td>
          </tr>
        </table>

        <div class="titulo-secao">SUMÁRIO DE HISTÓRIA CLÍNICA, EXAME FÍSICO E TRATAMENTO</div>
        <table class="tab-oficial">
          <tr>
            <td style="height: 100px; vertical-align: top;">
              <span class="rotulo">Histórico Clínico:</span>
              <p style="margin-top: 3px;">Paciente deu entrada com quadro de <strong>${d.sintomas}</strong>.</p>
              <p style="margin-top: 6px;">Instituída terapêutica medicamentosa e acompanhamento clínico contínuo conforme protocolo assistencial.</p>
            </td>
          </tr>
        </table>

        <!-- PÁGINA 4: FICHA DE ANESTESIA -->
        <div class="quebra-pagina"></div>

        <div class="cabecalho-principal">
          <h3>HOSPITAL MATERNIDADE SEVERINA CARLOS DE ANDRADE</h3>
          <h2 style="font-size: 12px; margin: 2px 0;">FICHA DE ANESTESIA</h2>
        </div>

        <table class="tab-oficial">
          <tr>
            <td style="width: 70%;"><span class="rotulo">Nome:</span><span class="conteudo">${d.paciente}</span></td>
            <td style="width: 30%;"><span class="rotulo">Prontuário:</span><span class="conteudo">${d.prontuario}</span></td>
          </tr>
          <tr>
            <td><span class="rotulo">Anestesia Tipo:</span><span class="conteudo">LOCAL</span></td>
            <td><span class="rotulo">Técnica:</span><span class="conteudo">INFILTRAÇÃO LOCAL</span></td>
          </tr>
          <tr>
            <td colspan="2"><span class="rotulo">Drogas Usadas:</span><span class="conteudo">LIDOCAÍNA A 2% - 20 ML / SF 0,9% 500 ML EV</span></td>
          </tr>
        </table>

        <table class="tab-oficial" style="margin-top: 20px;">
          <tr>
            <td style="height: 45px; vertical-align: bottom; text-align: center;">
              <div style="border-top: 1px dotted #000; font-size: 9px; width: 60%; margin: 0 auto;">
                Médico Anestesista / Cirurgião
              </div>
            </td>
          </tr>
        </table>

        <!-- PÁGINA 5: BOLETIM OPERATÓRIO -->
        <div class="quebra-pagina"></div>

        <div class="cabecalho-principal">
          <h3>HOSPITAL MATERNIDADE SEVERINA CARLOS DE ANDRADE</h3>
          <h2 style="font-size: 12px; margin: 2px 0;">BOLETIM OPERATÓRIO</h2>
        </div>

        <table class="tab-oficial">
          <tr>
            <td style="width: 70%;"><span class="rotulo">Nome:</span><span class="conteudo">${d.paciente}</span></td>
            <td style="width: 30%;"><span class="rotulo">Prontuário:</span><span class="conteudo">${d.prontuario}</span></td>
          </tr>
          <tr>
            <td><span class="rotulo">Procedimento Realizado:</span><span class="conteudo">${d.nomeProc}</span></td>
            <td><span class="rotulo">Código SSM:</span><span class="conteudo">${d.codProc}</span></td>
          </tr>
          <tr>
            <td><span class="rotulo">Cirurgião Operador:</span><span class="conteudo">${d.medico}</span></td>
            <td><span class="rotulo">Data:</span><span class="conteudo">${d.dataInternacao}</span></td>
          </tr>
        </table>

        <div class="titulo-secao">RELATÓRIO DO PROCEDIMENTO</div>
        <table class="tab-oficial">
          <tr>
            <td style="height: 100px; vertical-align: top;">
              <span class="rotulo">Descrição Cirúrgica / Técnica:</span>
              <p style="margin-top: 4px;">Procedimento realizado sob técnica asséptica habitual. Sem intercorrências operatórias ou imediatas pós-procedimento.</p>
            </td>
          </tr>
        </table>

        <table class="tab-oficial" style="margin-top: 20px;">
          <tr>
            <td style="height: 45px; vertical-align: bottom; text-align: center;">
              <div style="border-top: 1px dotted #000; font-size: 9px; width: 60%; margin: 0 auto;">
                ${d.medico}<br>Médico Operador
              </div>
            </td>
          </tr>
        </table>
      `;
    }

    function renderizarDocumento() {
      const dados = lerDados();
      document.getElementById('documentoImpressao').innerHTML = montarHtmlBlob(dados);
    }

    // PDF Oficial: abre a janela nativa do Chrome configurada para A4 sem falhas de tela em branco
    function baixarPDFOficial() {
      renderizarDocumento();
      window.print();
    }

    // Word Oficial: ficheiro .doc formatado com tabela fixa (sem juntar as palavras nem sobrepor campos)
    function baixarWordDoc() {
      renderizarDocumento();
      const d = lerDados();
      const corpoHTML = document.getElementById('documentoImpressao').innerHTML;
      const nomeFicheiro = `AIH_${d.prontuario}_${d.paciente.replace(/\s+/g, '_')}.doc`;

      const estruturaWord = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' 
              xmlns:w='urn:schemas-microsoft-com:office:word' 
              xmlns='http://www.w3.org/TR/REC-html40'>
        <head>
          <meta charset='utf-8'>
          <title>AIH Oficial</title>
          <!--[if gte mso 9]>
          <xml>
            <w:WordDocument>
              <w:View>Print</w:View>
              <w:Zoom>100</w:Zoom>
              <w:DoNotOptimizeForBrowser/>
            </w:WordDocument>
          </xml>
          <![endif]-->
          <style>
            @page {
              size: A4 portrait;
              margin: 1.2cm 1.2cm 1.2cm 1.2cm;
              mso-page-orientation: portrait;
            }
            body {
              font-family: Arial, sans-serif;
              font-size: 10pt;
              line-height: 1.25;
              color: #000000;
            }
            p {
              margin: 0 0 3pt 0;
            }
            table {
              width: 100%;
              border-collapse: collapse;
              margin-bottom: 6pt;
              mso-table-lspace: 0pt;
              mso-table-rspace: 0pt;
            }
            td, th {
              border: 1pt solid #000000;
              padding: 3.5pt 5pt;
              vertical-align: top;
            }
            .rotulo {
              font-size: 7.5pt;
              font-weight: bold;
              text-transform: uppercase;
              color: #333333;
              display: block;
              margin-bottom: 1pt;
            }
            .conteudo {
              font-size: 9.5pt;
              font-weight: bold;
              color: #000000;
            }
            .titulo-secao {
              font-weight: bold;
              text-align: center;
              border-top: 1pt solid #000;
              border-bottom: 1pt solid #000;
              padding: 2.5pt 0;
              margin: 6pt 0;
              font-size: 10pt;
              text-transform: uppercase;
              background-color: #ffffff;
            }
            .quebra-pagina {
              page-break-before: always;
              mso-break-type: page-break;
            }
          </style>
        </head>
        <body>
          ${corpoHTML}
        </body>
        </html>
      `;

      const blob = new Blob(['\ufeff' + estruturaWord], { type: 'application/msword;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = nomeFicheiro;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    }

    // Inicializa a visualização na carga da página
    window.onload = function() {
      renderizarDocumento();
    };
  </script>
</body>
</html>
