<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de AIH - Autorização de Internação Hospitalar</title>
    <style>
        :root {
            --primary-color: #003366;
            --border-color: #000;
            --bg-light: #f9f9f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #eef2f5;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            background: #fff;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Barra de Ações (Oculta na impressão) */
        .action-bar {
            background: var(--primary-color);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .action-bar h2 {
            color: #fff;
            font-size: 1.2rem;
        }

        .btn-group button {
            background: #fff;
            color: var(--primary-color);
            border: none;
            padding: 8px 15px;
            margin-left: 8px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-group button:hover {
            background: #f0f0f0;
        }

        /* Estrutura do Formulário AIH */
        .aih-form {
            border: 2px solid var(--border-color);
            font-size: 11px;
        }

        .aih-section {
            border-bottom: 1px solid var(--border-color);
            padding: 5px;
        }

        .aih-row {
            display: flex;
            flex-wrap: wrap;
            border-bottom: 1px solid #ccc;
        }

        .aih-row:last-child {
            border-bottom: none;
        }

        .field-group {
            padding: 4px;
            border-right: 1px solid #ccc;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .field-group:last-child {
            border-right: none;
        }

        .field-group label {
            font-weight: bold;
            font-size: 9px;
            color: #555;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .field-group input, .field-group select {
            border: none;
            border-bottom: 1px dotted #888;
            padding: 3px;
            font-size: 11px;
            outline: none;
            background: transparent;
        }

        .field-group input:focus {
            background: var(--bg-light);
            border-bottom: 1px solid var(--primary-color);
        }

        /* Estilos de Impressão */
        @media print {
            body {
                background: #fff;
                padding: 0;
            }
            .action-bar {
                display: none;
            }
            .container {
                border: none;
                box-shadow: none;
                max-width: 100%;
                padding: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Barra de Controles -->
        <div class="action-bar">
            <h2>Módulo AIH - Preenchimento Rápido</h2>
            <div class="btn-group">
                <button onclick="window.print()">🖨️ Imprimir / PDF</button>
                <button onclick="exportarWord()">📄 Baixar Word</button>
            </div>
        </div>

        <!-- Formulário AIH -->
        <div class="aih-form">
            <div class="aih-section" style="text-align: center; font-weight: bold; background: #eee; font-size: 13px;">
                AUTORIZAÇÃO DE INTERNAÇÃO HOSPITALAR (AIH)
            </div>

            <!-- Bloco 1: Identificação -->
            <div class="aih-row">
                <div class="field-group" style="flex: 3;">
                    <label>Nome do Paciente</label>
                    <input type="text" id="nomePaciente" placeholder="Nome completo">
                </div>
                <div class="field-group" style="flex: 1;">
                    <label>Prontuário</label>
                    <input type="text" id="prontuario" placeholder="Nº">
                </div>
            </div>

            <!-- Bloco 2: Dados Clínicos -->
            <div class="aih-row">
                <div class="field-group" style="flex: 2;">
                    <label>Procedimento Solicitado</label>
                    <input type="text" id="procedimento" placeholder="Nome ou Código do Procedimento">
                </div>
                <div class="field-group" style="flex: 1;">
                    <label>CID Principal</label>
                    <input type="text" id="cid" placeholder="Ex: O80">
                </div>
            </div>
        </div>
    </div>

    <script>
        // Função simples e nativa para exportar o conteúdo para Word (.doc) mantendo tabelas
        function exportarWord() {
            const conteudoHTML = document.querySelector('.aih-form').outerHTML;
            const cabecalho = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>AIH</title></head><body>";
            const rodape = "</body></html>";
            const codigoCompleto = cabecalho + conteudoHTML + rodape;

            const blob = new Blob(['\ufeff' + codigoCompleto], {
                type: 'application/msword'
            });
            
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'AIH_Documento.doc';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
