<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISTEMA HM - AIH Oficial</title>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f1f5f9; margin: 0; padding: 12px; color: #1e293b; }
    .container { max-width: 950px; margin: 0 auto; background: #fff; padding: 18px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #0369a1; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
    .btn-reload { background: #64748b; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    fieldset { border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa; }
    legend { font-weight: 700; color: #0284c7; padding: 0 6px; font-size: 13px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
    .form-group { margin-bottom: 6px; }
    label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 3px; color: #475569; }
    input, select, textarea { width: 100%; padding: 7px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 12px; background: #fff; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #0284c7; }
    .btn-template { background: #e2e8f0; border: 1px solid #cbd5e1; padding: 4px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; font-weight: 600; margin-right: 4px; }
    .btn-submit { background: #0284c7; color: #fff; border: none; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 7px; cursor: pointer; width: 100%; margin-top: 8px; }
    .btn-submit:hover { background: #0369a1; }
    #msgStatus { margin-top: 10px; font-weight: bold; text-align: center; font-size: 13px; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.75); z-index: 9999; justify-content: center; align-items: center; padding: 8px; }
    .modal-content { background: #fff; width: 100%; max-width: 950px; height: 95vh; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { background: #0284c7; color: #fff; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { margin: 0; font-size: 15px; }
    .modal-body { flex: 1; background: #525659; }
    .modal-body iframe { width: 100%; height: 100%; border: none; }
    .modal-footer { padding: 8px 14px; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 8px; }
    .btn-modal { padding: 7px 14px; border-radius: 5px; font-weight: 600; font-size: 12px; cursor: pointer; border: none; }
    .btn-close { background: #e2e8f0; color: #334155; }
    .btn-print { background: #16a34a; color: #fff; }
    .btn-download { background: #0284c7; color: #fff; }
  </style>
</head>
<body>

<div class="container">
  <h2>
    <span>Emissão AIH Oficial - Modelo HM</span>
    <button type="button" class="btn-reload" onclick="location.reload(true)">↻ Recarregar</button>
  </h2>

  <form id="formAih">
    <fieldset>
      <legend>Identificação do Paciente</legend>
      <div class="grid-3">
        <div class="form-group">
          <label>Nº Prontuário:</label>
          <input type="text" id="prontuario" value="5555" required>
        </div>
        <div class="form-group">
          <label>Nome Completo:</label>
          <input type="text" id="nomePaciente" value="JOSÉ DA SILVA" required>
        </div>
        <div class="form-group">
          <label>Cartão SUS (CNS):</label>
          <input type="text" id="cns" value="704006647751551">
        </div>
      </div>
      <div class="grid-4">
        <div class="form-group">
          <label>Data de Nascimento:</label>
          <input type="text" id="dataNasc" value="10/12/1956">
        </div>
        <div class="form-group">
          <label>Sexo:</label>
          <select id="sexo">
            <option value="M" selected>Masculino</option>
            <option value="F">Feminino</option>
          </select>
        </div>
        <div class="form-group">
          <label>Raça / Cor:</label>
          <input type="text" id="racaCor" value="B">
        </div>
        <div class="form-group">
          <label>Telefone:</label>
          <input type="text" id="telefone" value="84 99999-0000">
        </div>
      </div>
      <div class="grid-3">
        <div class="form-group">
          <label>Nome da Mãe:</label>
          <input type="text" id="nomeMae" value="MARIA">
        </div>
        <div class="form-group">
          <label>Nome do Pai:</label>
          <input type="text" id="nomePai" value="JOSÉ AMARO">
        </div>
        <div class="form-group">
          <label>Profissão:</label>
          <input type="text" id="profissao" value="AGRICULTOR">
        </div>
      </div>
      <div class="grid-4">
        <div class="form-group">
          <label>Endereço Completo:</label>
          <input type="text" id="endereco" value="CENTRO, SN">
        </div>
        <div class="form-group">
          <label>Município:</label>
          <input type="text" id="municipio" value="F GOMES">
        </div>
        <div class="form-group">
          <label>UF / CEP:</label>
          <input type="text" id="ufCep" value="RN / 59890">
        </div>
        <div class="form-group">
          <label>RG / Documento:</label>
          <input type="text" id="rg" value="5555">
        </div>
      </div>
      <div class="grid-4">
        <div class="form-group">
          <label>Data Internação:</label>
          <input type="text" id="dataInternacao" value="19/03/2026">
        </div>
        <div class="form-group">
          <label>Data Saída (Alta):</label>
          <input type="text" id="dataSaida" value="02/04/2026">
        </div>
        <div class="form-group">
          <label>Diagnóstico Inicial:</label>
          <input type="text" id="diagInicial" value="CRISE HIPERTENSIVA">
        </div>
        <div class="form-group">
          <label>CID-10 Principal:</label>
          <input type="text" id="cidPrincipal" value="I10">
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Procedimento Solicitado / Descrição:</label>
          <input type="text" id="procedimento" value="TRATAMENTO DA CRISE HIPERTENSIVA">
        </div>
        <div class="form-group">
          <label>Código Procedimento (SIGTAP):</label>
          <input type="text" id="codProcedimento" value="0303060107">
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Dados Clínicos / Justificativa</legend>
      <div class="form-group">
        <button type="button" class="btn-template" onclick="preencherTemplate('hipertensao')">Template Hipertensão</button>
        <button type="button" class="btn-template" onclick="preencherTemplate('erisipela')">Template Erisipela</button>
        <button type="button" class="btn-template" onclick="preencherTemplate('pneumonia')">Template Pneumonia</button>
      </div>
      <div class="form-group">
        <label>17. Principais Sinais e Sintomas Clínicos:</label>
        <textarea id="sinaisSintomas" rows="2">CEFALEIA, NÁUSEAS, TAQUICARDIA E NÍVEIS PRESSÓRICOS ELEVADOS.</textarea>
      </div>
      <div class="form-group">
        <label>18. Condições que Justificam a Internação:</label>
        <textarea id="justificativa" rows="2">NECESSIDADE DE ESTABILIZAÇÃO PRESSÓRICA VENOSA E MONITORIZAÇÃO CLÍNICA.</textarea>
      </div>
      <div class="form-group">
        <label>19. Principais Resultados de Exames:</label>
        <textarea id="exames" rows="2">HC + EF, ECG COM SOBRECARGA VENTRICULAR.</textarea>
      </div>
    </fieldset>

    <fieldset>
      <legend>Identificação do Estabelecimento e Solicitante</legend>
      <div class="grid-2">
        <div class="form-group">
          <label>Estabelecimento:</label>
          <input type="text" id="nomeHospital" value="HOSPITAL MATERNIDADE SEVERINA CARLOS DE ANDRADE" readonly>
        </div>
        <div class="form-group">
          <label>Código CNES:</label>
          <input type="text" id="cnesHospital" value="2380846">
        </div>
      </div>
      <div class="grid-3">
        <div class="form-group">
          <label>Médico Solicitante:</label>
          <input type="text" id="medicoSolicitante" value="LUCIDIO JACOME FERREIRA FILHO">
        </div>
        <div class="form-group">
          <label>CPF Solicitante / CRM:</label>
          <input type="text" id="cpfSolicitante" value="175.499.574-87">
        </div>
        <div class="form-group">
          <label>Data Solicitação:</label>
          <input type="text" id="dataSolicitacao" value="19/03/2026">
        </div>
      </div>
    </fieldset>

    <button type="submit" class="btn-submit">Gerar AIH Oficial em PDF</button>
    <div id="msgStatus"></div>
  </form>
</div>

<div id="modalVisualizacao" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Visualização do Documento Oficial</h3>
      <button class="btn-modal btn-close" onclick="fecharModal()">✕</button>
    </div>
    <div class="modal-body">
      <iframe id="pdfFrame"></iframe>
    </div>
    <div class="modal-footer">
      <button class="btn-modal btn-close" onclick="fecharModal()">Fechar</button>
      <button class="btn-modal btn-print" onclick="imprimirPdf()">Imprimir</button>
      <button class="btn-modal btn-download" id="btnDownload">Baixar PDF</button>
    </div>
  </div>
</div>

<script>
  // Carrega o PDF base limpo do Jotform
  const URL_PDF_BASE = 'AIH%20JOT.pdf?v=' + Date.now();

  let pdfBytesGerado = null;
  let pdfBlobUrl = null;

  function preencherTemplate(tipo) {
    if (tipo === 'hipertensao') {
      document.getElementById('diagInicial').value = 'CRISE HIPERTENSIVA';
      document.getElementById('cidPrincipal').value = 'I10';
      document.getElementById('procedimento').value = 'TRATAMENTO DA CRISE HIPERTENSIVA';
      document.getElementById('codProcedimento').value = '0303060107';
      document.getElementById('sinaisSintomas').value = 'CEFALEIA, NÁUSEAS, TAQUICARDIA E NÍVEIS PRESSÓRICOS ELEVADOS.';
      document.getElementById('justificativa').value = 'NECESSIDADE DE ESTABILIZAÇÃO PRESSÓRICA VENOSA E MONITORIZAÇÃO CLÍNICA.';
      document.getElementById('exames').value = 'HC + EF, ECG COM SOBRECARGA VENTRICULAR.';
    } else if (tipo === 'erisipela') {
      document.getElementById('diagInicial').value = 'ERISIPELA';
      document.getElementById('cidPrincipal').value = 'A 46';
      document.getElementById('procedimento').value = 'TRATAMENTO DE OUTRAS DOENCAS INFECCIOSAS E PARASITARIAS';
      document.getElementById('codProcedimento').value = '0303080078';
      document.getElementById('sinaisSintomas').value = 'PACIENTE COM QUADRO DE HIPEREMIA, EDEMA INTENSO, CALOR LOCAL EM MEMBRO INFERIOR, DOR E FEBRE.';
      document.getElementById('justificativa').value = 'NECESSIDADE DE ANTIBIOTICOTERAPIA PARENTERAL, VIGILÂNCIA CLÍNICA E REPOUSO EM ELEVAÇÃO.';
      document.getElementById('exames').value = 'LEUCOGRAMA COM LEUCOCITOSE E DESVIO À ESQUERDA; PCR ELEVADO.';
    } else if (tipo === 'pneumonia') {
      document.getElementById('diagInicial').value = 'PNEUMONIA BACTERIANA';
      document.getElementById('cidPrincipal').value = 'J 18.9';
      document.getElementById('procedimento').value = 'TRATAMENTO DE PNEUMONIAS OU INFLUENZA (GRIPE)';
      document.getElementById('codProcedimento').value = '0303010185';
      document.getElementById('sinaisSintomas').value = 'TOSSE PRODUTIVA, FEBRE AFERIDA, DISPNEIA E CREPITANTES EM BASES PULMONARES.';
      document.getElementById('justificativa').value = 'INDICAÇÃO DE ANTIBIOTICOTERAPIA PARENTERAL E SUPORTE DE OXIGENOTERAPIA.';
      document.getElementById('exames').value = 'RX DE TÓRAX COM CONDENSAÇÃO PULMONAR; LEUCOCITOSE.';
    }
  }

  document.getElementById('formAih').addEventListener('submit', async function(e) {
    e.preventDefault();
    const msg = document.getElementById('msgStatus');
    msg.style.color = '#0284c7';
    msg.innerText = 'Preenchendo formulário no modelo Jotform...';

    try {
      await gerarAihPdf();
      msg.innerText = '';
    } catch (err) {
      console.error(err);
      msg.style.color = '#dc2626';
      msg.innerText = 'Erro ao processar PDF: ' + err.message;
    }
  });

  async function gerarAihPdf() {
    const { PDFDocument, rgb, StandardFonts } = PDFLib;

    const res = await fetch(URL_PDF_BASE);
    if (!res.ok) throw new Error('Não foi possível carregar o arquivo AIH JOT.pdf no repositório.');
    const buffer = await res.arrayBuffer();

    const pdfDoc = await PDFDocument.load(buffer);
    const fontRegular = await pdfDoc.embedFont(StandardFonts.Helvetica);
    const fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

    const pages = pdfDoc.getPages();
    const pag1 = pages[0]; // Folha 1: Autorização
    const pag2 = pages[1]; // Folha 2: Laudo SUS
    const pag3 = pages[2]; // Folha 3: Prontuário de Internação

    const d = {
      prontuario: document.getElementById('prontuario').value || '',
      nome: document.getElementById('nomePaciente').value || '',
      cns: document.getElementById('cns').value || '',
      dataNasc: document.getElementById('dataNasc').value || '',
      sexo: document.getElementById('sexo').value || 'M',
      racaCor: document.getElementById('racaCor').value || 'B',
      telefone: document.getElementById('telefone').value || '',
      nomeMae: document.getElementById('nomeMae').value || '',
      nomePai: document.getElementById('nomePai').value || '',
      profissao: document.getElementById('profissao').value || 'AGRICULTOR',
      endereco: document.getElementById('endereco').value || '',
      municipio: document.getElementById('municipio').value || 'F GOMES',
      ufCep: document.getElementById('ufCep').value || 'RN / 59890',
      rg: document.getElementById('rg').value || '5555',
      dataInternacao: document.getElementById('dataInternacao').value || '',
      dataSaida: document.getElementById('dataSaida').value || '',
      diagInicial: document.getElementById('diagInicial').value || '',
      cidPrincipal: document.getElementById('cidPrincipal').value || '',
      procedimento: document.getElementById('procedimento').value || '',
      codProcedimento: document.getElementById('codProcedimento').value || '',
      sinais: document.getElementById('sinaisSintomas').value || '',
      justificativa: document.getElementById('justificativa').value || '',
      exames: document.getElementById('exames').value || '',
      medico: document.getElementById('medicoSolicitante').value || 'LUCIDIO JÁCOME FERREIRA',
      cpfMed: document.getElementById('cpfSolicitante').value || '175.499.574-87',
      dataSolicitacao: document.getElementById('dataSolicitacao').value || '',
      cnes: document.getElementById('cnesHospital').value || '2380846'
    };

    const print = (page, text, x, y, size, isBold) => {
      if (!text || !page) return;
      page.drawText(String(text).toUpperCase(), {
        x: x,
        y: y,
        size: size || 7.5,
        font: isBold ? fontBold : fontRegular,
        color: rgb(0, 0, 0)
      });
    };

    /* =========================================================
       📄 FOLHA 1: AUTORIZAÇÃO DE INTERNAÇÃO (MODELO JOTFORM)
       ========================================================= */
    print(pag1, d.dataInternacao, 130, 715, 8, false);
    print(pag1, d.prontuario, 335, 715, 8, true);
    print(pag1, "X", 328, 700, 8, true); // (X) Continuidade
    print(pag1, d.dataSaida, 480, 700, 8, false);

    // Bloco: Paciente
    print(pag1, d.nome, 120, 672, 8, true);
    print(pag1, d.sexo, 45, 658, 7.5, false);
    print(pag1, d.dataNasc, 220, 658, 7.5, false);
    print(pag1, d.racaCor, 355, 658, 7.5, false);
    print(pag1, d.cns, 415, 658, 8, false);

    print(pag1, d.nomeMae, 100, 642, 7.5, false);
    print(pag1, d.endereco, 80, 626, 7.5, false);
    print(pag1, "SN", 260, 626, 7.5, false);
    print(pag1, "CENTRO", 340, 626, 7.5, false);

    print(pag1, d.municipio, 85, 610, 7.5, false);
    print(pag1, "RN", 260, 610, 7.5, false);
    print(pag1, "59890", 340, 610, 7.5, false);
    print(pag1, d.telefone, 450, 610, 7.5, false);

    print(pag1, "X", 137, 595, 8, true); // (X) Identidade
    print(pag1, d.rg, 140, 580, 8, false);

    // Bloco: Procedimento
    print(pag1, d.codProcedimento, 145, 550, 8, false);
    print(pag1, "N", 460, 550, 8, false);
    print(pag1, d.codProcedimento, 140, 535, 8, false);
    print(pag1, "CLINICA MEDICA", 100, 520, 7.5, false);
    print(pag1, "M", 475, 520, 8, false);

    print(pag1, d.cidPrincipal, 90, 492, 8.5, true);
    print(pag1, "1", 460, 492, 8, false);
    print(pag1, "ALTA", 155, 462, 7.5, false);
    print(pag1, d.cpfMed, 115, 448, 8, false);
    print(pag1, "185.901.284-15", 420, 448, 7.5, false);
    print(pag1, d.dataInternacao, 420, 432, 7.5, false);

    // Grade de Procedimentos Realizados (Linha 1)
    print(pag1, d.codProcedimento, 85, 385, 8, false);
    print(pag1, "01", 195, 385, 8, false);
    print(pag1, d.cpfMed, 245, 385, 7.5, false);


    /* =========================================================
       📄 FOLHA 2: LAUDO PARA SOLICITAÇÃO (SUS)
       ========================================================= */
    // 5, 6 e 7 - Nome, Prontuário e CNS
    print(pag2, d.nome, 45, 622, 8, true);
    print(pag2, d.prontuario, 305, 622, 8, true);
    print(pag2, d.cns, 420, 622, 8, false);

    // 8, 9, 10, 11 e 12 - Nascimento, Sexo, Cor, Mãe, Tel
    print(pag2, d.dataNasc, 45, 592, 7.5, false);
    if (d.sexo === 'M') {
      print(pag2, "X", 137, 592, 8.5, true); // Masc
    } else {
      print(pag2, "X", 175, 592, 8.5, true); // Fem
    }
    print(pag2, d.racaCor, 230, 592, 7.5, false);
    print(pag2, d.nomeMae, 45, 564, 7.5, false);
    print(pag2, d.telefone, 420, 564, 7.5, false);

    // 13, 14, 15 e 16 - Endereço e Município
    print(pag2, d.endereco, 45, 536, 7.5, false);
    print(pag2, d.municipio, 45, 508, 7.5, false);
    print(pag2, "2404002", 305, 508, 7.5, false);
    print(pag2, "RN", 450, 508, 7.5, false);
    print(pag2, "59890", 495, 508, 7.5, false);

    // 17, 18 e 19 - Justificativa da Internação
    print(pag2, d.sinais.substring(0, 115), 45, 470, 7, false);
    if (d.sinais.length > 115) print(pag2, d.sinais.substring(115, 230), 45, 460, 7, false);

    print(pag2, d.justificativa.substring(0, 115), 45, 432, 7, false);
    if (d.justificativa.length > 115) print(pag2, d.justificativa.substring(115, 230), 45, 422, 7, false);

    print(pag2, d.exames.substring(0, 115), 45, 394, 7, false);

    // 20 e 21 - Diagnóstico e CID
    print(pag2, d.diagInicial, 45, 362, 7.5, false);
    print(pag2, d.cidPrincipal, 345, 362, 8.5, true);

    // 24 e 25 - Procedimento e Código
    print(pag2, d.procedimento, 45, 326, 7, false);
    print(pag2, d.codProcedimento, 435, 326, 8, true);

    // 26, 27, 29, 30 e 31 - Dados do Solicitante
    print(pag2, "CLINICA MÉDICA", 45, 295, 7.5, false);
    print(pag2, "02", 185, 295, 7.5, false);
    print(pag2, d.cpfMed, 380, 295, 7.5, false);
    print(pag2, d.medico, 45, 268, 7.5, true);
    print(pag2, d.dataSolicitacao, 350, 268, 7.5, false);


    /* =========================================================
       📄 FOLHA 3: PRONTUÁRIO DE INTERNAÇÃO (JOTFORM)
       ========================================================= */
    print(pag3, d.nome, 105, 742, 8, true);
    print(pag3, d.prontuario, 480, 742, 8.5, true);

    print(pag3, d.endereco, 80, 722, 7.5, false);
    print(pag3, d.municipio, 270, 722, 7.5, false);
    print(pag3, "RN", 450, 722, 7.5, false);

    print(pag3, d.dataNasc, 110, 702, 7.5, false);
    print(pag3, d.municipio, 270, 702, 7.5, false);
    print(pag3, d.racaCor, 450, 702, 7.5, false);

    print(pag3, d.sexo, 55, 682, 7.5, false);
    print(pag3, d.profissao, 270, 682, 7.5, false);

    print(pag3, d.rg, 55, 662, 7.5, false);
    print(pag3, "59890", 270, 662, 7.5, false);
    print(pag3, "111111112", 450, 662, 7.5, false);

    print(pag3, d.nomePai, 80, 622, 7.5, false);
    print(pag3, d.nomeMae, 80, 604, 7.5, false);

    print(pag3, "CLINICA MEDICA", 70, 584, 7.5, false);
    print(pag3, "M", 340, 584, 7.5, false);
    print(pag3, "1", 450, 584, 7.5, false);

    print(pag3, d.dataInternacao, 110, 560, 7.5, false);
    print(pag3, "X", 32, 542, 8, true); // [X] Alta
    print(pag3, d.dataSaida, 55, 542, 7.5, false);
    print(pag3, "05 DIAS", 130, 524, 7.5, false);

    print(pag3, d.diagInicial, 110, 502, 7.5, true);
    print(pag3, d.diagInicial, 110, 482, 7.5, true);

    // Sumário de História Clínica
    print(pag3, `${d.sinais} ${d.justificativa}`, 45, 420, 7.5, false);

    /* Finalização */
    pdfBytesGerado = await pdfDoc.save();
    const blob = new Blob([pdfBytesGerado], { type: 'application/pdf' });
    if (pdfBlobUrl) URL.revokeObjectURL(pdfBlobUrl);
    pdfBlobUrl = URL.createObjectURL(blob);

    document.getElementById('pdfFrame').src = pdfBlobUrl;
    document.getElementById('modalVisualizacao').style.display = 'flex';

    const btnDown = document.getElementById('btnDownload');
    btnDown.onclick = () => {
      const a = document.createElement('a');
      a.href = pdfBlobUrl;
      a.download = `AIH_${d.prontuario}_${d.nome.replace(/\s+/g, '_')}.pdf`;
      a.click();
    };
  }

  function fecharModal() {
    document.getElementById('modalVisualizacao').style.display = 'none';
  }

  function imprimirPdf() {
    const frame = document.getElementById('pdfFrame');
    if (frame && frame.contentWindow) {
      frame.contentWindow.focus();
      frame.contentWindow.print();
    }
  }
</script>
</body>
</html>
