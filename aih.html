<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISTEMA HM - AIH Form Oficial</title>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f1f5f9; margin: 0; padding: 12px; color: #1e293b; }
    .container { max-width: 950px; margin: 0 auto; background: #fff; padding: 18px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #0369a1; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
    .btn-reload { background: #64748b; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    fieldset { border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa; }
    legend { font-weight: 700; color: #0284c7; padding: 0 6px; font-size: 13px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
    .form-group { margin-bottom: 6px; }
    label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 3px; color: #475569; }
    input, select, textarea { width: 100%; padding: 7px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 12px; background: #fff; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #0284c7; }
    .btn-template { background: #e2e8f0; border: 1px solid #cbd5e1; padding: 4px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; font-weight: 600; margin-right: 4px; }
    .btn-submit { background: #0284c7; color: #fff; border: none; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 7px; cursor: pointer; width: 100%; margin-top: 8px; }
    .btn-submit:hover { background: #0369a1; }
    #msgStatus { margin-top: 10px; font-weight: bold; text-align: center; font-size: 13px; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.75); z-index: 9999; justify-content: center; align-items: center; padding: 8px; }
    .modal-content { background: #fff; width: 100%; max-width: 950px; height: 95vh; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { background: #0284c7; color: #fff; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { margin: 0; font-size: 15px; }
    .modal-body { flex: 1; background: #525659; }
    .modal-body iframe { width: 100%; height: 100%; border: none; }
    .modal-footer { padding: 8px 14px; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 8px; }
    .btn-modal { padding: 7px 14px; border-radius: 5px; font-weight: 600; font-size: 12px; cursor: pointer; border: none; }
    .btn-close { background: #e2e8f0; color: #334155; }
    .btn-print { background: #16a34a; color: #fff; }
    .btn-download { background: #0284c7; color: #fff; }
  </style>
</head>
<body>

<div class="container">
  <h2>
    <span>Emissão AIH Oficial (Campos Adobe)</span>
    <button type="button" class="btn-reload" onclick="location.reload(true)">↻ Recarregar</button>
  </h2>

  <form id="formAih">
    <fieldset>
      <legend>Identificação do Paciente</legend>
      <div class="grid-3">
        <div class="form-group">
          <label>Nº Prontuário:</label>
          <input type="text" id="prontuario" value="5555" required>
        </div>
        <div class="form-group">
          <label>Nome Completo:</label>
          <input type="text" id="nomePaciente" value="JOSÉ DA SILVA" required>
        </div>
        <div class="form-group">
          <label>Cartão SUS (CNS):</label>
          <input type="text" id="cns" value="704006647751551">
        </div>
      </div>
      <div class="grid-4">
        <div class="form-group">
          <label>Data de Nascimento:</label>
          <input type="text" id="dataNasc" value="10/12/1956">
        </div>
        <div class="form-group">
          <label>Sexo:</label>
          <select id="sexo">
            <option value="M" selected>M - Masculino</option>
            <option value="F">F - Feminino</option>
          </select>
        </div>
        <div class="form-group">
          <label>Raça / Cor:</label>
          <input type="text" id="racaCor" value="B">
        </div>
        <div class="form-group">
          <label>Telefone:</label>
          <input type="text" id="telefone" value="84 99999-0000">
        </div>
      </div>
      <div class="grid-3">
        <div class="form-group">
          <label>Nome da Mãe:</label>
          <input type="text" id="nomeMae" value="MARIA">
        </div>
        <div class="form-group">
          <label>Nome do Pai:</label>
          <input type="text" id="nomePai" value="JOSÉ AMARO">
        </div>
        <div class="form-group">
          <label>Profissão:</label>
          <input type="text" id="profissao" value="AGRICULTOR">
        </div>
      </div>
      <div class="grid-4">
        <div class="form-group">
          <label>Endereço / Logradouro:</label>
          <input type="text" id="endereco" value="CENTRO">
        </div>
        <div class="form-group">
          <label>Nº:</label>
          <input type="text" id="numEndereco" value="SN">
        </div>
        <div class="form-group">
          <label>Bairro:</label>
          <input type="text" id="bairro" value="CENTRO">
        </div>
        <div class="form-group">
          <label>Município:</label>
          <input type="text" id="municipio" value="F GOMES">
        </div>
      </div>
      <div class="grid-4">
        <div class="form-group">
          <label>Estado / UF:</label>
          <input type="text" id="estado" value="RN">
        </div>
        <div class="form-group">
          <label>CEP:</label>
          <input type="text" id="cep" value="59890">
        </div>
        <div class="form-group">
          <label>RG:</label>
          <input type="text" id="rg" value="5555">
        </div>
        <div class="form-group">
          <label>CPF do Paciente:</label>
          <input type="text" id="cpfPac" value="111.111.111-22">
        </div>
      </div>
      <div class="grid-4">
        <div class="form-group">
          <label>Data Internação:</label>
          <input type="text" id="dataInternacao" value="19/03/2026">
        </div>
        <div class="form-group">
          <label>Data Saída (Alta):</label>
          <input type="text" id="dataSaida" value="02/04/2026">
        </div>
        <div class="form-group">
          <label>Diagnóstico Inicial:</label>
          <input type="text" id="diagInicial" value="CRISE HIPERTENSIVA">
        </div>
        <div class="form-group">
          <label>CID-10 Principal:</label>
          <input type="text" id="cidPrincipal" value="I10">
        </div>
      </div>
      <div class="grid-3">
        <div class="form-group">
          <label>Procedimento Solicitado:</label>
          <input type="text" id="procedimento" value="TRATAMENTO DA CRISE HIPERTENSIVA">
        </div>
        <div class="form-group">
          <label>Código SIGTAP:</label>
          <input type="text" id="codProcedimento" value="0303060107">
        </div>
        <div class="form-group">
          <label>Especialidade / Clínica:</label>
          <input type="text" id="especialidade" value="CLINICA MEDICA">
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Identificação do Médico e Hospital</legend>
      <div class="grid-3">
        <div class="form-group">
          <label>Médico Solicitante:</label>
          <input type="text" id="medicoSolicitante" value="DR LUCIDIO">
        </div>
        <div class="form-group">
          <label>CPF do Solicitante:</label>
          <input type="text" id="cpfSolicitante" value="175.499.574-87">
        </div>
        <div class="form-group">
          <label>Data Solicitação:</label>
          <input type="text" id="dataSolicitacao" value="19/03/2026">
        </div>
      </div>
    </fieldset>

    <button type="submit" class="btn-submit">Gerar AIH Preenchida</button>
    <div id="msgStatus"></div>
  </form>
</div>

<div id="modalVisualizacao" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Visualização da AIH Gerada</h3>
      <button class="btn-modal btn-close" onclick="fecharModal()">✕</button>
    </div>
    <div class="modal-body">
      <iframe id="pdfFrame"></iframe>
    </div>
    <div class="modal-footer">
      <button class="btn-modal btn-close" onclick="fecharModal()">Fechar</button>
      <button class="btn-modal btn-print" onclick="imprimirPdf()">Imprimir</button>
      <button class="btn-modal btn-download" id="btnDownload">Baixar PDF</button>
    </div>
  </div>
</div>

<script>
  // Nome do PDF salvo no Adobe interativo
  const URL_PDF_BASE = 'AIH_FORM.pdf?v=' + Date.now();

  let pdfBytesGerado = null;
  let pdfBlobUrl = null;

  document.getElementById('formAih').addEventListener('submit', async function(e) {
    e.preventDefault();
    const msg = document.getElementById('msgStatus');
    msg.style.color = '#0284c7';
    msg.innerText = 'Preenchendo formulário interativo do Adobe...';

    try {
      await gerarAihFormPdf();
      msg.innerText = '';
    } catch (err) {
      console.error(err);
      msg.style.color = '#dc2626';
      msg.innerText = 'Erro ao preencher PDF: ' + err.message;
    }
  });

  async function gerarAihFormPdf() {
    const { PDFDocument } = PDFLib;

    const res = await fetch(URL_PDF_BASE);
    if (!res.ok) throw new Error('Não foi possível carregar o arquivo AIH_FORM.pdf. Verifique se ele foi salvo no GitHub.');
    const buffer = await res.arrayBuffer();

    const pdfDoc = await PDFDocument.load(buffer);
    const form = pdfDoc.getForm();

    // Captura os dados do formulário web
    const d = {
      prontuario: document.getElementById('prontuario').value || '',
      nome: document.getElementById('nomePaciente').value || '',
      cns: document.getElementById('cns').value || '',
      nasc: document.getElementById('dataNasc').value || '',
      sexo: document.getElementById('sexo').value || 'M',
      raca: document.getElementById('racaCor').value || 'B',
      tel: document.getElementById('telefone').value || '',
      mae: document.getElementById('nomeMae').value || '',
      pai: document.getElementById('nomePai').value || '',
      profissao: document.getElementById('profissao').value || 'AGRICULTOR',
      endereco: document.getElementById('endereco').value || '',
      num: document.getElementById('numEndereco').value || 'SN',
      bairro: document.getElementById('bairro').value || 'CENTRO',
      municipio: document.getElementById('municipio').value || 'F GOMES',
      estado: document.getElementById('estado').value || 'RN',
      cep: document.getElementById('cep').value || '59890',
      rg: document.getElementById('rg').value || '5555',
      cpfPac: document.getElementById('cpfPac').value || '',
      dtInternacao: document.getElementById('dataInternacao').value || '',
      dtSaida: document.getElementById('dataSaida').value || '',
      diag: document.getElementById('diagInicial').value || '',
      cid: document.getElementById('cidPrincipal').value || '',
      procedimento: document.getElementById('procedimento').value || '',
      codProced: document.getElementById('codProcedimento').value || '',
      especialidade: document.getElementById('especialidade').value || 'CLINICA MEDICA',
      medico: document.getElementById('medicoSolicitante').value || 'DR LUCIDIO',
      cpfMed: document.getElementById('cpfSolicitante').value || '175.499.574-87',
      dtSol: document.getElementById('dataSolicitacao').value || ''
    };

    // Helper seguro: preenche campo de texto apenas se ele existir no PDF
    const setSafe = (name, value) => {
      try {
        const field = form.getTextField(name);
        if (field) field.setText(String(value).toUpperCase());
      } catch (err) {
        // Ignora se o campo não estiver no PDF
      }
    };

    // Helper seguro para CheckBox
    const checkSafe = (name) => {
      try {
        const cb = form.getCheckBox(name);
        if (cb) cb.check();
      } catch (err) {}
    };

    /* =========================================================
       1. FOLHA 1 - AUTORIZAÇÃO (Nomes capturados do Adobe)
       ========================================================= */
    setSafe('Prontuario#0', d.prontuario);
    setSafe('DT INTERN#0', d.dtInternacao);
    setSafe('DT SAIDA', d.dtSaida);
    setSafe('NOME#0', d.nome);
    setSafe('DN#0', d.nasc);
    setSafe('SEXO#0', d.sexo);
    setSafe('COR#0', d.raca);
    setSafe('SUS#0', d.cns);
    setSafe('MAE#0', d.mae);
    setSafe('ENDEREÇO#0', d.endereco);
    setSafe('N°#0', d.num);
    setSafe('BAIRRO', d.bairro);
    setSafe('MUNICIPIO#0', d.municipio);
    setSafe('ESTADO', d.estado);
    setSafe('CEP#0', d.cep);
    setSafe('TELEFONE#0', d.tel);
    setSafe('N° DOC', d.rg);
    setSafe('PROCED SOLIC#0', d.codProced);
    setSafe('PROCED REALIZ', d.codProced);
    setSafe('MUD PROC', 'N');
    setSafe('ESPECIALIDADE#0', d.especialidade);
    setSafe('CID PRINC#0', d.cid);
    setSafe('CID SEC#0', '');
    setSafe('ENFERM#0', 'M');
    setSafe('LEITO#0', '1');
    setSafe('MOT SAIDA', 'ALTA');
    setSafe('CPF SOL#0', d.cpfMed);
    setSafe('DATA AUTZ', d.dtInternacao);
    setSafe('PROCED SOLIC#1', d.codProced); // Linha 1 da grade

    // Checkboxes da Folha 1
    checkSafe('Check Box3'); // Tipo Continuidade
    checkSafe('RG');         // Tipo Documento RG

    /* =========================================================
       2. FOLHA 2 - LAUDO MÉDICO SUS
       ========================================================= */
    setSafe('NOME MED', d.medico);
    setSafe('CPF MED SOL', d.cpfMed);
    setSafe('DT INTERN#1', d.dtSol);

    /* =========================================================
       3. FOLHA 3 - PRONTUÁRIO DE INTERNAÇÃO
       ========================================================= */
    setSafe('NOME#2', d.nome);
    setSafe('ENDEREÇO#1', d.endereco);
    setSafe('MUNICIPIO#2', d.municipio);
    setSafe('DN#2', d.nasc);
    setSafe('NATURALIDADE', d.municipio);
    setSafe('COR#2', d.raca);
    setSafe('SEXO#2', d.sexo);
    setSafe('PROFISSAO', d.profissao);
    setSafe('Prontuario#2', d.prontuario);
    setSafe('N°#1', d.num);
    setSafe('DT EXPED', d.dtInternacao);
    setSafe('CPF PAC', d.cpfPac);
    setSafe('MAE#2', d.mae);
    setSafe('PAI', d.pai);
    setSafe('ESPECIALIDADE#2', d.especialidade);

    /* =========================================================
       4. FOLHAS 4 E 5 - ANESTESIA E BOLETIM CIRÚRGICO
       ========================================================= */
    setSafe('NOME#4', d.nome);
    setSafe('Prontuario#4', d.prontuario);
    setSafe('DIAGN PRE OPERAT', d.diag);
    setSafe('DT CIR', d.dtInternacao);

    // Opcional: form.flatten(); // Descomente se quiser travar o PDF para impressão sem edição

    /* Geração do Blob e Visualização no Modal */
    pdfBytesGerado = await pdfDoc.save();
    const blob = new Blob([pdfBytesGerado], { type: 'application/pdf' });
    if (pdfBlobUrl) URL.revokeObjectURL(pdfBlobUrl);
    pdfBlobUrl = URL.createObjectURL(blob);

    document.getElementById('pdfFrame').src = pdfBlobUrl;
    document.getElementById('modalVisualizacao').style.display = 'flex';

    const btnDown = document.getElementById('btnDownload');
    btnDown.onclick = () => {
      const a = document.createElement('a');
      a.href = pdfBlobUrl;
      a.download = `AIH_${d.prontuario}_${d.nome.replace(/\s+/g, '_')}.pdf`;
      a.click();
    };
  }

  function fecharModal() {
    document.getElementById('modalVisualizacao').style.display = 'none';
  }

  function imprimirPdf() {
    const frame = document.getElementById('pdfFrame');
    if (frame && frame.contentWindow) {
      frame.contentWindow.focus();
      frame.contentWindow.print();
    }
  }
</script>
</body>
</html>
