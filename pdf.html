<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Tools Pro</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- PDF-Lib (Manipulação, Merge, Split) -->
  <script src="https://unpkg.com/pdf-lib@1.17.9/dist/pdf-lib.min.js"></script>

  <!-- PDF.js (Motor da Mozilla com suporte pleno a AES-128/256 e extração) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--tg-theme-bg-color, #f4f6f9);
      color: var(--tg-theme-text-color, #1e293b);
      margin: 0; padding: 16px;
      display: flex; justify-content: center;
    }
    .container {
      width: 100%; max-width: 520px;
      background: var(--tg-theme-secondary-bg-color, #ffffff);
      padding: 24px; border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }
    h2 { margin-top: 0; font-size: 1.3rem; text-align: center; }
    .tabs { display: flex; gap: 6px; margin-bottom: 18px; overflow-x: auto; }
    .tab-btn {
      flex: 1; padding: 10px 8px; font-size: 0.85rem; font-weight: 600;
      border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 8px;
      cursor: pointer; white-space: nowrap;
    }
    .tab-btn.active {
      background: var(--tg-theme-button-color, #0284c7);
      color: var(--tg-theme-button-text-color, #ffffff);
      border-color: transparent;
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    input[type="file"], input[type="text"], input[type="password"], select {
      width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem;
      background: #fff;
    }
    button.action-btn {
      width: 100%; padding: 12px; margin-top: 6px;
      background: var(--tg-theme-button-color, #0284c7);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none; border-radius: 8px; font-weight: 600; cursor: pointer;
    }
    button.action-btn:hover { opacity: 0.9; }
    #status {
      margin-top: 14px; padding: 10px; border-radius: 6px; font-size: 0.85rem; display: none; word-break: break-word;
    }
    .ok { background: #dcfce7; color: #166534; }
    .err { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

<div class="container">
  <h2>🛠️ PDF Tools Hub</h2>

  <!-- Barra de Abas -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('tab-unlock')">Unlock/Lock</button>
    <button class="tab-btn" onclick="switchTab('tab-merge')">Merge</button>
    <button class="tab-btn" onclick="switchTab('tab-split')">Split</button>
    <button class="tab-btn" onclick="switchTab('tab-convert')">Converter</button>
  </div>

  <!-- Painel 1: Unlock / Lock -->
  <div id="tab-unlock" class="panel active">
    <div class="field">
      <label>Ficheiro PDF Protegido:</label>
      <input type="file" id="crypto-file" accept="application/pdf">
    </div>
    <div class="field">
      <label>Senha do Ficheiro:</label>
      <input type="password" id="crypto-pass" placeholder="Insira a senha do PDF...">
    </div>
    <button class="action-btn" onclick="handleUnlock()">🔓 Desbloquear PDF (Remover Senha Definitivamente)</button>
    <button class="action-btn" style="background: #475569; margin-top: 8px;" onclick="handleLock()">🔒 Proteger Ficheiro com Senha</button>
  </div>

  <!-- Painel 2: Merge (Unir) -->
  <div id="tab-merge" class="panel">
    <div class="field">
      <label>Selecione 2 ou mais ficheiros PDF:</label>
      <input type="file" id="merge-files" accept="application/pdf" multiple>
    </div>
    <button class="action-btn" onclick="handleMerge()">📑 Unir Todos os PDFs</button>
  </div>

  <!-- Painel 3: Split (Dividir) -->
  <div id="tab-split" class="panel">
    <div class="field">
      <label>Ficheiro PDF:</label>
      <input type="file" id="split-file" accept="application/pdf">
    </div>
    <div class="field">
      <label>Páginas pretendidas (ex: 1-3 ou 1, 4, 5):</label>
      <input type="text" id="split-range" placeholder="ex: 1-3 ou 2,4">
    </div>
    <button class="action-btn" onclick="handleSplit()">✂️ Extrair Páginas</button>
  </div>

  <!-- Painel 4: Conversores -->
  <div id="tab-convert" class="panel">
    <div class="field">
      <label>Ficheiro PDF para conversão:</label>
      <input type="file" id="convert-file" accept="application/pdf">
    </div>
    <div class="field">
      <label>Converter para:</label>
      <select id="convert-format">
        <option value="jpg">Imagens JPG (Página por página)</option>
        <option value="png">Imagens PNG (Alta qualidade)</option>
        <option value="txt">Documento de Texto (.txt)</option>
      </select>
    </div>
    <button class="action-btn" onclick="handleConvert()">🔄 Iniciar Conversão</button>
  </div>

  <div id="status"></div>
</div>

<script>
  // Inicialização Telegram WebApp
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.expand();
    tg.ready();
  }

  // Worker oficial do PDF.js
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  function switchTab(id) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    event.target.classList.add('active');
  }

  function notify(msg, success = true) {
    const el = document.getElementById("status");
    el.style.display = "block";
    el.className = success ? "ok" : "err";
    el.innerText = msg;
    if (tg?.HapticFeedback) {
      tg.HapticFeedback.notificationOccurred(success ? "success" : "error");
    }
  }

  function download(blob, filename) {
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.style.display = "none";
    a.href = url;
    a.download = filename;

    document.body.appendChild(a);
    a.click();

    setTimeout(() => {
      document.body.removeChild(a);
      window.URL.revokeObjectURL(url);
    }, 1500);
  }

  // --- DESBLOQUEIO DE PDF COM SUPORTE A AES-128/256 ---
  async function handleUnlock() {
    const fileInput = document.getElementById("crypto-file");
    const passInput = document.getElementById("crypto-pass").value;

    if (!fileInput.files.length) return notify("Selecione um ficheiro PDF primeiro.", false);

    try {
      notify("A processar e a descriptografar o PDF...");
      const fileBytes = await fileInput.files[0].arrayBuffer();

      // Utiliza o motor PDF.js com suporte a senhas avançadas
      const loadingTask = pdfjsLib.getDocument({
        data: fileBytes,
        password: passInput
      });

      const pdf = await loadingTask.promise;
      const newPdf = await PDFLib.PDFDocument.create();

      // Reconstrói as páginas num PDF limpo e totalmente sem senha
      for (let i = 1; i <= pdf.numPages; i++) {
        notify(`A recriar página ${i} de ${pdf.numPages}...`);
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 2.0 });

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({ canvasContext: ctx, viewport }).promise;

        const imgDataUrl = canvas.toDataURL("image/jpeg", 0.95);
        const imgBytes = await fetch(imgDataUrl).then(res => res.arrayBuffer());
        const embeddedImg = await newPdf.embedJpg(imgBytes);

        const newPage = newPdf.addPage([viewport.width / 2.0, viewport.height / 2.0]);
        newPage.drawImage(embeddedImg, {
          x: 0,
          y: 0,
          width: viewport.width / 2.0,
          height: viewport.height / 2.0
        });
      }

      const unlockedBytes = await newPdf.save();
      const originalName = fileInput.files[0].name.replace(/\.pdf$/i, "");
      const blob = new Blob([unlockedBytes], { type: "application/pdf" });

      download(blob, `desbloqueado_${originalName}.pdf`);
      notify("PDF desbloqueado e descarregado com sucesso!");
    } catch (err) {
      console.error(err);
      if (err.name === "PasswordException") {
        notify("Senha incorreta. Verifique a senha digitada.", false);
      } else {
        notify("Erro ao processar ficheiro: " + (err.message || "Erro desconhecido"), false);
      }
    }
  }

  // --- PROTEGER COM SENHA ---
  async function handleLock() {
    const fileInput = document.getElementById("crypto-file");
    const passInput = document.getElementById("crypto-pass").value;

    if (!fileInput.files.length || !passInput) {
      return notify("O ficheiro e a senha são obrigatórios.", false);
    }

    try {
      notify("A proteger ficheiro...");
      const fileBytes = await fileInput.files[0].arrayBuffer();
      const pdfDoc = await PDFLib.PDFDocument.load(fileBytes);

      await pdfDoc.encrypt({
        userPassword: passInput,
        ownerPassword: passInput
      });

      const protectedBytes = await pdfDoc.save();
      const originalName = fileInput.files[0].name.replace(/\.pdf$/i, "");
      const blob = new Blob([protectedBytes], { type: "application/pdf" });

      download(blob, `protegido_${originalName}.pdf`);
      notify("Ficheiro protegido com sucesso!");
    } catch (err) {
      notify("Erro ao proteger: " + err.message, false);
    }
  }

  // --- UNIR PDFS (MERGE) ---
  async function handleMerge() {
    const files = document.getElementById("merge-files").files;
    if (files.length < 2) return notify("Selecione pelo menos 2 ficheiros PDF.", false);

    try {
      notify("A unir ficheiros...");
      const mergedPdf = await PDFLib.PDFDocument.create();

      for (let file of files) {
        const fileBytes = await file.arrayBuffer();
        const srcPdf = await PDFLib.PDFDocument.load(fileBytes);
        const copiedPages = await mergedPdf.copyPages(srcPdf, srcPdf.getPageIndices());
        copiedPages.forEach(p => mergedPdf.addPage(p));
      }

      const mergedBytes = await mergedPdf.save();
      const blob = new Blob([mergedBytes], { type: "application/pdf" });

      download(blob, "documentos_unidos.pdf");
      notify("Ficheiros unidos com sucesso!");
    } catch (err) {
      notify("Erro ao unir ficheiros: " + err.message, false);
    }
  }

  // --- DIVIDIR PDFS (SPLIT) ---
  async function handleSplit() {
    const fileInput = document.getElementById("split-file");
    const rangeText = document.getElementById("split-range").value.trim();

    if (!fileInput.files.length || !rangeText) {
      return notify("Selecione o ficheiro e defina as páginas.", false);
    }

    try {
      notify("A extrair páginas...");
      const fileBytes = await fileInput.files[0].arrayBuffer();
      const srcPdf = await PDFLib.PDFDocument.load(fileBytes);
      const totalPages = srcPdf.getPageCount();
      const pageIndices = new Set();

      rangeText.split(',').forEach(part => {
        if (part.includes('-')) {
          const [start, end] = part.split('-').map(n => parseInt(n.trim(), 10));
          for (let i = start; i <= end; i++) {
            if (i >= 1 && i <= totalPages) pageIndices.add(i - 1);
          }
        } else {
          const p = parseInt(part.trim(), 10);
          if (p >= 1 && p <= totalPages) pageIndices.add(p - 1);
        }
      });

      if (pageIndices.size === 0) return notify("Nenhuma página válida encontrada.", false);

      const splitPdf = await PDFLib.PDFDocument.create();
      const pagesToCopy = Array.from(pageIndices).sort((a, b) => a - b);
      const copiedPages = await splitPdf.copyPages(srcPdf, pagesToCopy);
      copiedPages.forEach(p => splitPdf.addPage(p));

      const splitBytes = await splitPdf.save();
      const originalName = fileInput.files[0].name.replace(/\.pdf$/i, "");
      const blob = new Blob([splitBytes], { type: "application/pdf" });

      download(blob, `extraido_${originalName}.pdf`);
      notify("Páginas extraídas com sucesso!");
    } catch (err) {
      notify("Erro ao extrair: " + err.message, false);
    }
  }

  // --- CONVERSÕES (JPG, PNG, TXT) ---
  async function handleConvert() {
    const fileInput = document.getElementById("convert-file");
    const format = document.getElementById("convert-format").value;

    if (!fileInput.files.length) return notify("Selecione um ficheiro PDF.", false);

    try {
      notify("A processar conversão...");
      const fileBytes = await fileInput.files[0].arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: fileBytes }).promise;
      const baseName = fileInput.files[0].name.replace(/\.pdf$/i, "");

      if (format === "txt") {
        let fullText = "";
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          const pageStr = textContent.items.map(item => item.str).join(" ");
          fullText += `--- Página ${i} ---\n` + pageStr + "\n\n";
        }
        const blob = new Blob([fullText], { type: "text/plain;charset=utf-8" });
        download(blob, `${baseName}.txt`);
        notify("Texto extraído e descarregado com sucesso!");
        return;
      }

      // Conversão para Imagens (JPG ou PNG)
      const mime = format === "png" ? "image/png" : "image/jpeg";
      for (let i = 1; i <= pdf.numPages; i++) {
        notify(`A exportar página ${i} de ${pdf.numPages}...`);
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 2.0 });

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({ canvasContext: ctx, viewport }).promise;

        canvas.toBlob((blob) => {
          download(blob, `${baseName}_pagina_${i}.${format}`);
        }, mime, 0.95);
      }

      notify(`Conversão concluída! ${pdf.numPages} ficheiro(s) exportado(s).`);
    } catch (err) {
      console.error(err);
      notify("Erro na conversão: " + err.message, false);
    }
  }
</script>

</body>
</html>
