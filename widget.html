<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sticky Notes Razr</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background: #ffffff; 
            color: #1a1a1a; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            padding: 12px;
        }

        /* CABEÇALHO ESTILO STICKY NOTES */
        .widget-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding-bottom: 8px; 
            border-bottom: 1.5px solid #f0f0f0;
        }
        .widget-title { 
            font-size: 1.25rem; 
            font-weight: 700; 
            color: #2c3e50; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        .dot { 
            width: 10px; 
            height: 10px; 
            background: #5c6274; 
            border-radius: 50%; 
            display: inline-block; 
        }
        .status-sync { 
            font-size: 1.1rem; 
            color: #888; 
            cursor: pointer;
            padding: 4px;
        }

        /* FORMULÁRIO DE ADIÇÃO DIRETO */
        .add-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 8px;
            border-radius: 8px;
            margin-top: 8px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .add-box input, .add-box textarea {
            width: 100%;
            padding: 10px;
            border: 1.5px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            background: #fff;
        }
        .add-box input:focus { border-color: #007bff; }
        .add-box button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        .add-box button:active { background: #0056b3; }

        /* LISTA DOS 2 ÚLTIMOS */
        .widget-content { 
            flex: 1; 
            overflow-y: auto; 
            padding: 4px 0; 
        }

        .mini-card { 
            background: #ffffff; 
            border-left: 4px solid #007bff; 
            padding: 10px 12px; 
            margin-bottom: 8px; 
            border-radius: 6px; 
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            border-top: 1px solid #f1f5f9;
            border-right: 1px solid #f1f5f9;
            border-bottom: 1px solid #f1f5f9;
        }
        .mini-card.tarefa { border-left-color: #28a745; }
        .mini-card.gasto { border-left-color: #ff9800; }

        .item-text { 
            white-space: pre-wrap; 
            word-break: break-word; 
            line-height: 1.4; 
            font-size: 1rem; 
            color: #334155;
        }
        .item-link { 
            display: inline-block; 
            margin-top: 5px; 
            color: #007bff; 
            font-size: 0.9rem; 
            text-decoration: none; 
            font-weight: 600;
        }

        /* RODAPÉ COM ÍCONES GRANDES */
        .widget-footer { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding-top: 8px; 
            border-top: 1.5px solid #f0f0f0; 
        }
        .nav-group { display: flex; gap: 12px; }
        .icon-btn { 
            background: none; 
            border: none; 
            cursor: pointer; 
            font-size: 1.6rem; 
            color: #475569; 
            padding: 6px 10px; 
            border-radius: 8px; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn.active { 
            background: #e0f2fe; 
            transform: scale(1.08);
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <div class="widget-header">
        <div class="widget-title">
            <span class="dot"></span>
            <span id="aba-nome">Notas</span>
        </div>
        <span id="sync-indicador" class="status-sync" onclick="carregarDados()" title="Atualizar">🔄</span>
    </div>

    <!-- CAIXA DE ADIÇÃO RÁPIDA -->
    <div id="box-formulario" class="add-box"></div>

    <!-- LISTAGEM -->
    <div class="widget-content" id="conteudo-lista">
        <div style="text-align: center; color: #94a3b8; margin-top: 20px; font-size: 1rem;">Carregando...</div>
    </div>

    <!-- NAVEGAÇÃO INFERIOR -->
    <div class="widget-footer">
        <div class="nav-group">
            <button id="btn-notas" class="icon-btn active" onclick="trocarAba('notas')" title="Notas">📝</button>
            <button id="btn-tarefas" class="icon-btn" onclick="trocarAba('tarefas')" title="Tarefas">📋</button>
            <button id="btn-despesas" class="icon-btn" onclick="trocarAba('despesas')" title="Gastos">💰</button>
        </div>

        <div class="nav-group">
            <button class="icon-btn" onclick="window.location.href='index.html'" title="Abrir Painel Completo">↗️</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwNU1UIq_W8m3CVCQqKXSDLGg1A4vVk_3hk4g8q02MLhmY-5jirQz6VIiSy74KsP3YN/exec';

        let despesas = [];
        let tarefas = [];
        let notas = [];
        let abaAtual = 'notas';

        function carregarDados() {
            document.getElementById('sync-indicador').innerText = '🔄';
            const script = document.createElement('script');
            script.src = `${SCRIPT_URL}?callback=receberDados&t=${Date.now()}`;
            document.body.appendChild(script);
        }

        function receberDados(data) {
            if (data) {
                despesas = data.despesas || [];
                tarefas = data.tarefas || [];
                notas = data.notas || [];
                document.getElementById('sync-indicador').innerText = '●';
                renderWidget();
            }
        }

        function enviarDados() {
            document.getElementById('sync-indicador').innerText = '📤';
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ despesas, tarefas, notas })
            }).then(() => {
                document.getElementById('sync-indicador').innerText = '●';
            });
        }

        function trocarAba(aba) {
            abaAtual = aba;
            document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${aba}`).classList.add('active');
            
            const nomes = { notas: 'Notas', tarefas: 'Tarefas', despesas: 'Gastos' };
            document.getElementById('aba-nome').innerText = nomes[aba];
            renderWidget();
        }

        function renderFormulario() {
            const formBox = document.getElementById('box-formulario');
            if (abaAtual === 'notas') {
                formBox.innerHTML = `
                    <input type="text" id="mini-nota-txt" placeholder="Digite uma nota rápida...">
                    <button type="button" onclick="salvarMiniNota()">+ Salvar Nota</button>
                `;
            } else if (abaAtual === 'tarefas') {
                formBox.innerHTML = `
                    <input type="text" id="mini-tarefa-txt" placeholder="Nova tarefa...">
                    <button type="button" onclick="salvarMiniTarefa()">+ Salvar Tarefa</button>
                `;
            } else if (abaAtual === 'despesas') {
                formBox.innerHTML = `
                    <input type="text" id="mini-gasto-nome" placeholder="Descrição do gasto...">
                    <input type="number" id="mini-gasto-val" placeholder="Valor R$">
                    <button type="button" onclick="salvarMiniGasto()">+ Salvar Gasto</button>
                `;
            }
        }

        function salvarMiniNota() {
            const el = document.getElementById('mini-nota-txt');
            if (!el) return;
            const txt = el.value.trim();
            if (!txt) return;
            
            notas.push({ id: Date.now(), texto: txt, link: '' });
            el.value = '';
            renderWidget();
            enviarDados();
        }

        function salvarMiniTarefa() {
            const el = document.getElementById('mini-tarefa-txt');
            if (!el) return;
            const nome = el.value.trim();
            if (!nome) return;
            
            tarefas.push({ id: Date.now(), nome: nome, data: '', prioridade: 'baixa', anexo: '' });
            el.value = '';
            renderWidget();
            enviarDados();
        }

        function salvarMiniGasto() {
            const elNome = document.getElementById('mini-gasto-nome');
            const elVal = document.getElementById('mini-gasto-val');
            if (!elNome || !elVal) return;
            
            const nome = elNome.value.trim();
            const val = parseFloat(elVal.value) || 0;
            if (!nome) return;

            despesas.push({ id: Date.now(), nome: nome, valor: val, anexo: '' });
            elNome.value = '';
            elVal.value = '';
            renderWidget();
            enviarDados();
        }

        function renderWidget() {
            renderFormulario();
            const container = document.getElementById('conteudo-lista');
            container.innerHTML = '';

            if (abaAtual === 'notas') {
                if (!notas.length) return container.innerHTML = '<div style="color:#94a3b8;text-align:center;margin-top:15px;font-size:0.95rem;">Sem notas salvas.</div>';
                const ultimasNotas = notas.slice(-2).reverse();
                ultimasNotas.forEach(n => {
                    const txt = n.texto || n.titulo || (typeof n === 'string' ? n : '');
                    const lnk = n.link || '';
                    container.innerHTML += `
                        <div class="mini-card">
                            <div class="item-text">${txt}</div>
                            ${lnk ? `<a href="${lnk}" target="_blank" class="item-link">🔗 Ver Anexo</a>` : ''}
                        </div>
                    `;
                });
            } else if (abaAtual === 'tarefas') {
                if (!tarefas.length) return container.innerHTML = '<div style="color:#94a3b8;text-align:center;margin-top:15px;font-size:0.95rem;">Sem tarefas.</div>';
                const ultimasTarefas = tarefas.slice(-2).reverse();
                ultimasTarefas.forEach(t => {
                    const nome = t.nome || t.texto || '';
                    container.innerHTML += `
                        <div class="mini-card tarefa">
                            <div class="item-text">☑️ ${nome}</div>
                        </div>
                    `;
                });
            } else if (abaAtual === 'despesas') {
                if (!despesas.length) return container.innerHTML = '<div style="color:#94a3b8;text-align:center;margin-top:15px;font-size:0.95rem;">Sem gastos.</div>';
                const ultimasDespesas = despesas.slice(-2).reverse();
                ultimasDespesas.forEach(d => {
                    const nome = d.nome || d.desc || '';
                    const valor = parseFloat(d.valor) || 0;
                    container.innerHTML += `
                        <div class="mini-card gasto" style="display:flex; justify-content:space-between; align-items:center;">
                            <span class="item-text">${nome}</span>
                            <strong style="font-size:1rem; color:#d97706;">R$ ${valor.toFixed(2)}</strong>
                        </div>
                    `;
                });
            }
        }

        carregarDados();
    </script>
</body>
</html>
