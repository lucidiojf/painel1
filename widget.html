
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Widget Razr</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background: #ffffff; 
            color: #1a1a1a; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            padding: 8px;
        }

        .widget-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding-bottom: 5px; 
            border-bottom: 1px solid #f0f0f0;
        }
        .widget-title { 
            font-size: 1rem; 
            font-weight: 700; 
            color: #333; 
            display: flex; 
            align-items: center; 
            gap: 5px; 
        }
        .dot { 
            width: 8px; 
            height: 8px; 
            background: #007bff; 
            border-radius: 50%; 
            display: inline-block; 
        }
        .status-sync { 
            font-size: 0.75rem; 
            color: #888; 
            cursor: pointer;
        }

        .widget-content { 
            flex: 1; 
            overflow-y: auto; 
            padding: 6px 0; 
        }

        .mini-card { 
            background: #fdfdfd; 
            border-left: 3px solid #007bff; 
            padding: 6px 8px; 
            margin-bottom: 6px; 
            border-radius: 4px; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .mini-card.tarefa { border-left-color: #28a745; }
        .mini-card.gasto { border-left-color: #ff9800; }

        .item-text { 
            white-space: pre-wrap; 
            word-break: break-word; 
            line-height: 1.3; 
            font-size: 0.82rem; 
        }
        .item-link { 
            display: inline-block; 
            margin-top: 3px; 
            color: #007bff; 
            font-size: 0.75rem; 
            text-decoration: none; 
            font-weight: 600;
        }

        .widget-footer { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding-top: 4px; 
            border-top: 1px solid #f0f0f0; 
        }
        .nav-group { display: flex; gap: 8px; }
        .icon-btn { 
            background: none; 
            border: none; 
            cursor: pointer; 
            font-size: 1.15rem; 
            color: #444; 
            padding: 3px 5px; 
            border-radius: 4px; 
        }
        .icon-btn.active { 
            background: #eef4ff; 
            color: #007bff; 
        }
    </style>
</head>
<body>

    <div class="widget-header">
        <div class="widget-title">
            <span class="dot"></span>
            <span id="aba-nome">Notas (Últimas 2)</span>
        </div>
        <span id="sync-indicador" class="status-sync" onclick="carregarDados()">🔄</span>
    </div>

    <div class="widget-content" id="conteudo-lista">
        <div style="text-align: center; color: #999; margin-top: 15px; font-size: 0.8rem;">Carregando...</div>
    </div>

    <div class="widget-footer">
        <div class="nav-group">
            <button id="btn-notas" class="icon-btn active" onclick="trocarAba('notas')" title="Notas">📝</button>
            <button id="btn-tarefas" class="icon-btn" onclick="trocarAba('tarefas')" title="Tarefas">📋</button>
            <button id="btn-despesas" class="icon-btn" onclick="trocarAba('despesas')" title="Gastos">💰</button>
        </div>

        <div class="nav-group">
            <button class="icon-btn" onclick="window.location.href='index.html'" title="Abrir Painel Completo">↗️</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwNU1UIq_W8m3CVCQqKXSDLGg1A4vVk_3hk4g8q02MLhmY-5jirQz6VIiSy74KsP3YN/exec';

        let despesas = [];
        let tarefas = [];
        let notas = [];
        let abaAtual = 'notas';

        function carregarDados() {
            document.getElementById('sync-indicador').innerText = '🔄';
            const script = document.createElement('script');
            script.src = `${SCRIPT_URL}?callback=receberDados&t=${Date.now()}`;
            document.body.appendChild(script);
        }

        function receberDados(data) {
            if (data) {
                despesas = data.despesas || [];
                tarefas = data.tarefas || [];
                notas = data.notas || [];
                document.getElementById('sync-indicador').innerText = '●';
                renderWidget();
            }
        }

        function trocarAba(aba) {
            abaAtual = aba;
            document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${aba}`).classList.add('active');
            
            const nomes = { notas: 'Notas (Últimas 2)', tarefas: 'Tarefas (Últimas 2)', despesas: 'Gastos (Últimos 2)' };
            document.getElementById('aba-nome').innerText = nomes[aba];
            renderWidget();
        }

        function renderWidget() {
            const container = document.getElementById('conteudo-lista');
            container.innerHTML = '';

            if (abaAtual === 'notas') {
                if (!notas.length) return container.innerHTML = '<div style="color:#aaa;text-align:center;margin-top:15px;font-size:0.8rem;">Sem notas.</div>';
                
                // Pega estritamente os 2 últimos itens
                const ultimasNotas = notas.slice(-2).reverse();
                
                ultimasNotas.forEach(n => {
                    const txt = n.texto || n.titulo || (typeof n === 'string' ? n : '');
                    const lnk = n.link || '';
                    container.innerHTML += `
                        <div class="mini-card">
                            <div class="item-text">${txt}</div>
                            ${lnk ? `<a href="${lnk}" target="_blank" class="item-link">🔗 Anexo</a>` : ''}
                        </div>
                    `;
                });
            } else if (abaAtual === 'tarefas') {
                if (!tarefas.length) return container.innerHTML = '<div style="color:#aaa;text-align:center;margin-top:15px;font-size:0.8rem;">Sem tarefas.</div>';
                
                const ultimasTarefas = tarefas.slice(-2).reverse();
                
                ultimasTarefas.forEach(t => {
                    const nome = t.nome || t.texto || '';
                    container.innerHTML += `
                        <div class="mini-card tarefa">
                            <div class="item-text">☑️ ${nome}</div>
                        </div>
                    `;
                });
            } else if (abaAtual === 'despesas') {
                if (!despesas.length) return container.innerHTML = '<div style="color:#aaa;text-align:center;margin-top:15px;font-size:0.8rem;">Sem gastos.</div>';
                
                const ultimasDespesas = despesas.slice(-2).reverse();
                
                ultimasDespesas.forEach(d => {
                    const nome = d.nome || d.desc || '';
                    const valor = parseFloat(d.valor) || 0;
                    container.innerHTML += `
                        <div class="mini-card gasto" style="display:flex; justify-content:space-between; align-items:center;">
                            <span class="item-text">${nome}</span>
                            <strong style="font-size:0.85rem;">R$ ${valor.toFixed(2)}</strong>
                        </div>
                    `;
                });
            }
        }

        carregarDados();
    </script>
</body>
</html>
