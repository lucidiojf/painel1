<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sticky Notes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body {
            background: #ffffff;
            color: #111827;
            padding: 4px 8px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* CABEÇALHO (MANTÉM OS BOTÕES DE SALVAR SEMPRE VISÍVEIS) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 2px;
            border-bottom: 1px solid #e5e7eb;
            flex-shrink: 0; /* Não encolhe */
        }
        .app-title { font-size: 14px; font-weight: 700; color: #374151; }
        .top-actions { display: flex; gap: 10px; align-items: center; }
        .btn-action { background: none; border: none; font-size: 18px; padding: 2px 4px; color: #374151; }
        .btn-confirm { font-size: 24px; font-weight: 900; color: #2563eb; }

        /* ÁREA DE TEXTO (OCUPA O ESPAÇO QUE SOBRA) */
        .sticky-editor {
            flex: 1;
            width: 100%;
            border: none;
            outline: none;
            font-size: 20px;
            line-height: 1.3;
            color: #111827;
            resize: none;
            background: transparent;
            padding: 6px 0;
        }

        /* RODAPÉ (ESCONDE QUANDO O TECLADO ABRE) */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 4px;
            border-top: 1px solid #e5e7eb;
            background: #ffffff;
            flex-shrink: 0;
        }
        .bottom-bar.hidden { display: none; }
        
        .tab-btn { background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; padding: 2px 8px; font-size: 14px; cursor: pointer; }
        .tab-btn.active { background: #dbeafe; border-color: #2563eb; }
        .status-pill { font-size: 11px; color: #6b7280; font-weight: 600; }
    </style>
</head>
<body>

    <div class="top-bar">
        <span class="app-title" id="aba-titulo">📝 Nota</span>
        <div class="top-actions">
            <button class="btn-action" onclick="limparTexto()">🗑️</button>
            <button class="btn-action" onclick="copiarTexto()">📄</button>
            <button class="btn-action btn-confirm" onclick="salvarNota()">✓</button>
        </div>
    </div>

    <textarea id="texto-principal" class="sticky-editor" placeholder="Digite aqui..."></textarea>

    <div class="bottom-bar" id="rodape">
        <div style="display: flex; gap: 4px;">
            <button id="btn-notas" class="tab-btn active" onclick="mudarAba('notas')">📝</button>
            <button id="btn-tarefas" class="tab-btn" onclick="mudarAba('tarefas')">📋</button>
            <button id="btn-despesas" class="tab-btn" onclick="mudarAba('despesas')">💰</button>
        </div>
        <span id="status-envio" class="status-pill">Sincronizado</span>
        <button class="btn-action" onclick="window.location.href='index.html'" style="font-size: 16px;">↗️</button>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwNU1UIq_W8m3CVCQqKXSDLGg1A4vVk_3hk4g8q02MLhmY-5jirQz6VIiSy74KsP3YN/exec';
        let despesas=[], tarefas=[], notas=[], abaAtiva = 'notas';

        // LÓGICA DO TECLADO: Esconde o rodapé ao focar na caixa de texto
        const textarea = document.getElementById('texto-principal');
        const rodape = document.getElementById('rodape');
        textarea.addEventListener('focus', () => rodape.classList.add('hidden'));
        textarea.addEventListener('blur', () => rodape.classList.remove('hidden'));

        // ... (resto das suas funções permanecem iguais)
        function carregarCacheLocal() {
            try {
                const salvo = localStorage.getItem('lista_painel_dados');
                if (salvo) {
                    const obj = JSON.parse(salvo);
                    despesas = obj.despesas || []; tarefas = obj.tarefas || []; notas = obj.notas || [];
                }
            } catch(e) {}
            mostrarTextoAba();
        }

        function sincronizarNuvem() {
            const script = document.createElement('script');
            script.src = `${SCRIPT_URL}?callback=receberDadosNuvem&t=${Date.now()}`;
            document.body.appendChild(script);
        }

        function receberDadosNuvem(data) {
            if (data) {
                despesas = data.despesas || []; tarefas = data.tarefas || []; notas = data.notas || [];
                salvarNoLocalStorage(); mostrarTextoAba();
                document.getElementById('status-envio').innerText = 'Sincronizado';
            }
        }

        function salvarNoLocalStorage() {
            try { localStorage.setItem('lista_painel_dados', JSON.stringify({ despesas, tarefas, notas })); } catch(e) {}
        }

        function mostrarTextoAba() {
            if (abaAtiva === 'notas') {
                if (notas.length > 0) {
                    const ult = notas[notas.length - 1];
                    textarea.value = (typeof ult === 'string') ? ult : (ult.texto || ult.titulo || '');
                } else { textarea.value = ''; }
            } else if (abaAtiva === 'tarefas') {
                if (tarefas.length > 0) {
                    const ult = tarefas[tarefas.length - 1];
                    textarea.value = ult.nome || ult.texto || '';
                } else { textarea.value = ''; }
            } else if (abaAtiva === 'despesas') {
                if (despesas.length > 0) {
                    const ult = despesas[despesas.length - 1];
                    textarea.value = `${ult.nome || ult.desc || ''} - R$ ${parseFloat(ult.valor || 0).toFixed(2)}`;
                } else { textarea.value = ''; }
            }
        }

        function mudarAba(aba) {
            abaAtiva = aba;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${aba}`).classList.add('active');
            const titulos = { notas: '📝 Nota', tarefas: '📋 Tarefa', despesas: '💰 Gasto' };
            document.getElementById('aba-titulo').innerText = titulos[aba];
            mostrarTextoAba();
        }

        function salvarNota() {
            const txt = textarea.value.trim();
            if (!txt) return;
            document.getElementById('status-envio').innerText = 'Salvando...';
            if (abaAtiva === 'notas') {
                if (notas.length > 0 && typeof notas[notas.length - 1] === 'object') { notas[notas.length - 1].texto = txt; }
                else { notas.push({ id: Date.now(), texto: txt, link: '' }); }
            } else if (abaAtiva === 'tarefas') {
                if (tarefas.length > 0) { tarefas[tarefas.length - 1].nome = txt; }
                else { tarefas.push({ id: Date.now(), nome: txt, data: '', prioridade: 'baixa', anexo: '' }); }
            } else if (abaAtiva === 'despesas') {
                if (despesas.length > 0) { despesas[despesas.length - 1].nome = txt; }
                else { despesas.push({ id: Date.now(), nome: txt, valor: 0, anexo: '' }); }
            }
            salvarNoLocalStorage();
            fetch(SCRIPT_URL, {
                method: 'POST', mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ despesas, tarefas, notas })
            }).then(() => {
                document.getElementById('status-envio').innerText = 'Salvo ✓';
                setTimeout(() => { document.getElementById('status-envio').innerText = 'Sincronizado'; }, 2000);
            });
        }

        function limparTexto() {
            textarea.value = '';
            if (abaAtiva === 'notas' && notas.length) notas.pop();
            if (abaAtiva === 'tarefas' && tarefas.length) tarefas.pop();
            if (abaAtiva === 'despesas' && despesas.length) despesas.pop();
            salvarNoLocalStorage(); salvarNota();
        }

        function copiarTexto() {
            if (navigator.clipboard && textarea.value) {
                navigator.clipboard.writeText(textarea.value);
                document.getElementById('status-envio').innerText = 'Copiado!';
                setTimeout(() => { document.getElementById('status-envio').innerText = 'Sincronizado'; }, 1500);
            }
        }

        carregarCacheLocal(); sincronizarNuvem();
    </script>
</body>
</html>
