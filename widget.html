<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sticky Notes Razr</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background: #ffffff; 
            color: #1a1a1a; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            padding: 10px;
        }

        /* TOPO */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 6px;
            border-bottom: 1px solid #f1f5f9;
        }
        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dot { width: 9px; height: 9px; background: #64748b; border-radius: 50%; display: inline-block; }

        /* LISTA DOS STICKY CARDS */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sticky-card {
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            transition: background 0.15s;
        }
        .sticky-card:active { background: #f8fafc; }
        .sticky-text {
            font-size: 1.25rem;
            line-height: 1.35;
            color: #1e293b;
            white-space: pre-wrap;
            word-break: break-word;
            font-weight: 500;
        }

        /* RODAPÉ DO WIDGET */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 6px;
            border-top: 1px solid #f1f5f9;
        }
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.4rem;
            padding: 4px 8px;
            color: #475569;
            border-radius: 6px;
        }
        .icon-btn.active { background: #e0f2fe; }

        /* TELA EXTRA CHEIA (ESTILO STICKY EDIT) */
        #modal-editor {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            z-index: 9999;
            flex-direction: column;
            padding: 12px;
        }
        #modal-editor.open { display: flex; }

        .editor-textarea {
            flex: 1;
            width: 100%;
            border: none;
            outline: none;
            font-size: 1.4rem;
            line-height: 1.4;
            color: #0f172a;
            resize: none;
            background: transparent;
            font-weight: 500;
        }

        /* BARRA DE FERRAMENTAS DO STICKY (Lixeira, Copiar, Confirmar) */
        .editor-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
            border-top: 1px solid #f1f5f9;
        }
        .toolbar-group { display: flex; gap: 20px; align-items: center; }
        .tool-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tool-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <div class="header">
        <div class="header-title">
            <span class="dot"></span>
            <span id="titulo-aba">Sticky Notes</span>
        </div>
        <button class="icon-btn" onclick="abrirNovoSticky()" title="Nova Nota" style="font-size: 1.5rem; font-weight: bold; color: #007bff;">➕</button>
    </div>

    <!-- LISTAGEM -->
    <div class="content" id="lista-cards">
        <div style="text-align: center; color: #94a3b8; margin-top: 20px; font-size: 1.1rem;">Carregando...</div>
    </div>

    <!-- RODAPÉ -->
    <div class="footer">
        <div style="display: flex; gap: 8px;">
            <button id="tab-notas" class="icon-btn active" onclick="trocarAba('notas')">📝</button>
            <button id="tab-tarefas" class="icon-btn" onclick="trocarAba('tarefas')">📋</button>
            <button id="tab-despesas" class="icon-btn" onclick="trocarAba('despesas')">💰</button>
        </div>
        <button class="icon-btn" onclick="window.location.href='index.html'" title="Painel Completo">↗️</button>
    </div>

    <!-- TELA EXTRA EXPANDIDA / MODAL DE EDIÇÃO -->
    <div id="modal-editor">
        <textarea id="editor-texto" class="editor-textarea" placeholder="Digite aqui..."></textarea>
        
        <div class="editor-toolbar">
            <button class="tool-btn" onclick="fecharEditor()" title="Configurações / Voltar">⚙️</button>
            <div class="toolbar-group">
                <button class="tool-btn" onclick="excluirStickyAtual()" title="Excluir">🗑️</button>
                <button class="tool-btn" onclick="copiarStickyAtual()" title="Copiar">📄</button>
                <button class="tool-btn" onclick="salvarStickyAtual()" style="font-size: 1.7rem; color: #0f172a; font-weight: bold;" title="Confirmar">✓</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwNU1UIq_W8m3CVCQqKXSDLGg1A4vVk_3hk4g8q02MLhmY-5jirQz6VIiSy74KsP3YN/exec';

        let despesas = [];
        let tarefas = [];
        let notas = [];
        let abaAtual = 'notas';
        let indiceEditando = -1; // -1 = novo item

        function carregarDados() {
            const script = document.createElement('script');
            script.src = `${SCRIPT_URL}?callback=receberDados&t=${Date.now()}`;
            document.body.appendChild(script);
        }

        function receberDados(data) {
            if (data) {
                despesas = data.despesas || [];
                tarefas = data.tarefas || [];
                notas = data.notas || [];
                renderWidget();
            }
        }

        function enviarDados() {
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ despesas, tarefas, notas })
            });
        }

        function trocarAba(aba) {
            abaAtual = aba;
            document.querySelectorAll('.footer .icon-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${aba}`).classList.add('active');
            
            const titulos = { notas: 'Sticky Notes', tarefas: 'Sticky Tarefas', despesas: 'Sticky Gastos' };
            document.getElementById('titulo-aba').innerText = titulos[aba];
            renderWidget();
        }

        function renderWidget() {
            const container = document.getElementById('lista-cards');
            container.innerHTML = '';

            if (abaAtual === 'notas') {
                if (!notas.length) return container.innerHTML = '<div style="color:#94a3b8;text-align:center;margin-top:20px;font-size:1.1rem;">Sem notas. Toque em ➕</div>';
                
                // Exibe as 2 últimas notas
                const ultimas = notas.slice(-2).reverse();
                ultimas.forEach((n, idx) => {
                    const originalIndex = notas.length - 1 - idx;
                    const txt = n.texto || n.titulo || (typeof n === 'string' ? n : '');
                    container.innerHTML += `
                        <div class="sticky-card" onclick="abrirEditor(${originalIndex})">
                            <div class="sticky-text">${txt}</div>
                        </div>
                    `;
                });
            } else if (abaAtual === 'tarefas') {
                if (!tarefas.length) return container.innerHTML = '<div style="color:#94a3b8;text-align:center;margin-top:20px;font-size:1.1rem;">Sem tarefas. Toque em ➕</div>';
                const ultimas = tarefas.slice(-2).reverse();
                ultimas.forEach((t, idx) => {
                    const originalIndex = tarefas.length - 1 - idx;
                    const nome = t.nome || t.texto || '';
                    container.innerHTML += `
                        <div class="sticky-card" onclick="abrirEditor(${originalIndex})" style="border-left: 5px solid #28a745;">
                            <div class="sticky-text">☑️ ${nome}</div>
                        </div>
                    `;
                });
            } else if (abaAtual === 'despesas') {
                if (!despesas.length) return container.innerHTML = '<div style="color:#94a3b8;text-align:center;margin-top:20px;font-size:1.1rem;">Sem gastos. Toque em ➕</div>';
                const ultimas = despesas.slice(-2).reverse();
                ultimas.forEach((d, idx) => {
                    const originalIndex = despesas.length - 1 - idx;
                    const nome = d.nome || d.desc || '';
                    const val = parseFloat(d.valor) || 0;
                    container.innerHTML += `
                        <div class="sticky-card" onclick="abrirEditor(${originalIndex})" style="border-left: 5px solid #ff9800; display:flex; justify-content:space-between; align-items:center;">
                            <div class="sticky-text">${nome}</div>
                            <strong style="font-size:1.1rem; color:#d97706;">R$ ${val.toFixed(2)}</strong>
                        </div>
                    `;
                });
            }
        }

        // --- CONTROLE DA TELA EXTRA DE EDIÇÃO ---
        function abrirEditor(index) {
            indiceEditando = index;
            const modal = document.getElementById('modal-editor');
            const textarea = document.getElementById('editor-texto');
            
            let conteudo = '';
            if (abaAtual === 'notas') {
                const item = notas[index];
                conteudo = item.texto || item.titulo || (typeof item === 'string' ? item : '');
            } else if (abaAtual === 'tarefas') {
                conteudo = tarefas[index].nome || tarefas[index].texto || '';
            } else if (abaAtual === 'despesas') {
                conteudo = (despesas[index].nome || despesas[index].desc || '') + ' ' + (despesas[index].valor || '');
            }

            textarea.value = conteudo;
            modal.classList.add('open');
            textarea.focus();
        }

        function abrirNovoSticky() {
            indiceEditando = -1;
            const modal = document.getElementById('modal-editor');
            const textarea = document.getElementById('editor-texto');
            textarea.value = '';
            modal.classList.add('open');
            textarea.focus();
        }

        function fecharEditor() {
            document.getElementById('modal-editor').classList.remove('open');
        }

        function salvarStickyAtual() {
            const val = document.getElementById('editor-texto').value.trim();
            if (!val) { fecharEditor(); return; }

            if (abaAtual === 'notas') {
                if (indiceEditando >= 0) {
                    notas[indiceEditando].texto = val;
                } else {
                    notas.push({ id: Date.now(), texto: val, link: '' });
                }
            } else if (abaAtual === 'tarefas') {
                if (indiceEditando >= 0) {
                    tarefas[indiceEditando].nome = val;
                } else {
                    tarefas.push({ id: Date.now(), nome: val, data: '', prioridade: 'baixa', anexo: '' });
                }
            } else if (abaAtual === 'despesas') {
                if (indiceEditando >= 0) {
                    despesas[indiceEditando].nome = val;
                } else {
                    despesas.push({ id: Date.now(), nome: val, valor: 0, anexo: '' });
                }
            }

            renderWidget();
            enviarDados();
            fecharEditor();
        }

        function excluirStickyAtual() {
            if (indiceEditando >= 0) {
                if (abaAtual === 'notas') notas.splice(indiceEditando, 1);
                if (abaAtual === 'tarefas') tarefas.splice(indiceEditando, 1);
                if (abaAtual === 'despesas') despesas.splice(indiceEditando, 1);
                renderWidget();
                enviarDados();
            }
            fecharEditor();
        }

        function copiarStickyAtual() {
            const val = document.getElementById('editor-texto').value;
            navigator.clipboard.writeText(val);
            alert("Copiado!");
        }

        carregarDados();
    </script>
</body>
</html>
