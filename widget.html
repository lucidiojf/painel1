<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Adicionamos viewport-fit=cover para o Razr -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sticky Notes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        
        /* O "dvh" garante que a tela ocupe 100% da área útil do Razr sem quebrar */
        body { height: 100dvh; display: flex; flex-direction: column; background: #f8f9fa; overflow: hidden; }

        #main-view { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; }

        /* Estilo Sticky Note: Cards Brancos com bordas suaves */
        .content { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .sticky-card { 
            background: #ffffff; border-radius: 16px; padding: 20px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            font-size: 22px; /* Fonte Grande */
            line-height: 1.4;
            color: #333;
        }

        /* Barra de Ícones Fixa */
        .footer { 
            height: 70px; /* Altura fixa para não sumir */
            background: #ffffff; 
            border-top: 1px solid #e2e8f0; 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            padding: 0 10px;
        }
        .tool-btn { background: none; border: none; font-size: 28px; cursor: pointer; padding: 10px; }

        /* TELA DE EDIÇÃO */
        #editor-view { display: none; flex-direction: column; height: 100dvh; background: #fff; padding: 15px; }
        .editor-textarea { flex: 1; width: 100%; border: none; font-size: 24px; resize: none; outline: none; }
    </style>
</head>
<body>

    <div id="main-view">
        <div class="content" id="lista-cards">
            <!-- Suas notas renderizadas aqui -->
        </div>
        <div class="footer">
            <button class="tool-btn" onclick="abrirNovoSticky()">➕</button>
            <button class="tool-btn" onclick="trocarAba('notas')">📝</button>
            <button class="tool-btn" onclick="trocarAba('despesas')">💰</button>
        </div>
    </div>

    <!-- Tela de edição simplificada -->
    <div id="editor-view">
        <textarea id="editor-texto" class="editor-textarea" placeholder="Digite..."></textarea>
        <div class="footer">
            <button class="tool-btn" onclick="fecharEditor()">⚙️</button>
            <button class="tool-btn" onclick="excluir()">🗑️</button>
            <button class="tool-btn" onclick="salvar()" style="color: blue; font-weight: bold;">✔️</button>
        </div>
    </div>

    <script>
        // ... (Seu código JS de carregar/salvar continua igual)
    </script>
</body>
</html>
