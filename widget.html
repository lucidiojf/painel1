<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sticky Notes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body {
            background: #ffffff;
            color: #111827;
            padding: 12px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* BARRA SUPERIOR */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 2px solid #e5e7eb;
        }
        .app-title {
            font-size: 20px;
            font-weight: 700;
            color: #1f2937;
        }
        .top-actions {
            display: flex;
            gap: 14px;
            align-items: center;
        }
        .btn-action {
            background: none;
            border: none;
            font-size: 26px;
            cursor: pointer;
            padding: 4px;
            color: #374151;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-confirm {
            font-size: 32px;
            font-weight: 900;
            color: #2563eb;
        }

        /* ÁREA DE TEXTO ESTILO STICKY NOTES */
        .sticky-editor {
            flex: 1;
            width: 100%;
            border: none;
            outline: none;
            font-size: 24px;
            line-height: 1.4;
            color: #111827;
            resize: none;
            background: transparent;
            padding: 12px 0;
            font-weight: 500;
        }

        /* NAVEGAÇÃO DE ABAS / HISTÓRICO NO RODAPÉ */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 8px;
            border-top: 2px solid #e5e7eb;
            background: #ffffff;
        }
        .tab-btn {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 18px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #dbeafe;
            border-color: #2563eb;
        }
        .status-pill {
            font-size: 14px;
            color: #6b7280;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- BARRA COM AS FERRAMENTAS EXATAS DO SEU PRINT DO STICKY -->
    <div class="top-bar">
        <span class="app-title" id="aba-titulo">📝 Nota</span>
        <div class="top-actions">
            <button class="btn-action" onclick="limparTexto()" title="Excluir">🗑️</button>
            <button class="btn-action" onclick="copiarTexto()" title="Copiar">📄</button>
            <button class="btn-action btn-confirm" onclick="salvarNota()" title="Confirmar">✓</button>
        </div>
    </div>

    <!-- ÁREA DE ESCRITA DIRETA (GRANDE E LIMPA) -->
    <textarea id="texto-principal" class="sticky-editor" placeholder="Digite aqui..."></textarea>

    <!-- BARRA INFERIOR DE TROCA RÁPIDA -->
    <div class="bottom-bar">
        <div style="display: flex; gap: 8px;">
            <button id="btn-notas" class="tab-btn active" onclick="mudarAba('notas')">📝</button>
            <button id="btn-tarefas" class="tab-btn" onclick="mudarAba('tarefas')">📋</button>
            <button id="btn-despesas" class="tab-btn" onclick="mudarAba('despesas')">💰</button>
        </div>
        <span id="status-envio" class="status-pill">Sincronizado</span>
        <button class="btn-action" onclick="window.location.href='index.html'" title="Painel Completo" style="font-size: 22px;">↗️</button>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwNU1UIq_W8m3CVCQqKXSDLGg1A4vVk_3hk4g8q02MLhmY-5jirQz6VIiSy74KsP3YN/exec';

        let despesas = [];
        let tarefas = [];
        let notas = [];
        let abaAtiva = 'notas';

        // 1. Carrega do cache local instantaneamente (nunca fica tela branca)
        function carregarCacheLocal() {
            try {
                const salvo = localStorage.getItem('lista_painel_dados');
                if (salvo) {
                    const obj = JSON.parse(salvo);
                    despesas = obj.despesas || [];
                    tarefas = obj.tarefas || [];
                    notas = obj.notas || [];
                }
            } catch(e) {}
            mostrarTextoAba();
        }

        // 2. Busca na nuvem (Google Sheets)
        function sincronizarNuvem() {
            document.getElementById('status-envio').innerText = 'Carregando...';
            const script = document.createElement('script');
            script.src = `${SCRIPT_URL}?callback=receberDadosNuvem&t=${Date.now()}`;
            document.body.appendChild(script);
        }

        function receberDadosNuvem(data) {
            if (data) {
                despesas = data.despesas || [];
                tarefas = data.tarefas || [];
                notas = data.notas || [];
                salvarNoLocalStorage();
                mostrarTextoAba();
                document.getElementById('status-envio').innerText = 'Sincronizado';
            }
        }

        function salvarNoLocalStorage() {
            try {
                localStorage.setItem('lista_painel_dados', JSON.stringify({ despesas, tarefas, notas }));
            } catch(e) {}
        }

        function mostrarTextoAba() {
            const textarea = document.getElementById('texto-principal');
            if (abaAtiva === 'notas') {
                if (notas.length > 0) {
                    const ult = notas[notas.length - 1];
                    textarea.value = (typeof ult === 'string') ? ult : (ult.texto || ult.titulo || '');
                } else {
                    textarea.value = '';
                }
            } else if (abaAtiva === 'tarefas') {
                if (tarefas.length > 0) {
                    const ult = tarefas[tarefas.length - 1];
                    textarea.value = ult.nome || ult.texto || '';
                } else {
                    textarea.value = '';
                }
            } else if (abaAtiva === 'despesas') {
                if (despesas.length > 0) {
                    const ult = despesas[despesas.length - 1];
                    textarea.value = `${ult.nome || ult.desc || ''} - R$ ${parseFloat(ult.valor || 0).toFixed(2)}`;
                } else {
                    textarea.value = '';
                }
            }
        }

        function mudarAba(aba) {
            abaAtiva = aba;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${aba}`).classList.add('active');

            const titulos = { notas: '📝 Nota', tarefas: '📋 Tarefa', despesas: '💰 Gasto' };
            document.getElementById('aba-titulo').innerText = titulos[aba];
            mostrarTextoAba();
        }

        function salvarNota() {
            const txt = document.getElementById('texto-principal').value.trim();
            if (!txt) return;

            document.getElementById('status-envio').innerText = 'Salvando...';

            if (abaAtiva === 'notas') {
                if (notas.length > 0 && typeof notas[notas.length - 1] === 'object') {
                    notas[notas.length - 1].texto = txt;
                } else {
                    notas.push({ id: Date.now(), texto: txt, link: '' });
                }
            } else if (abaAtiva === 'tarefas') {
                if (tarefas.length > 0) {
                    tarefas[tarefas.length - 1].nome = txt;
                } else {
                    tarefas.push({ id: Date.now(), nome: txt, data: '', prioridade: 'baixa', anexo: '' });
                }
            } else if (abaAtiva === 'despesas') {
                if (despesas.length > 0) {
                    despesas[despesas.length - 1].nome = txt;
                } else {
                    despesas.push({ id: Date.now(), nome: txt, valor: 0, anexo: '' });
                }
            }

            salvarNoLocalStorage();

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ despesas, tarefas, notas })
            }).then(() => {
                document.getElementById('status-envio').innerText = 'Salvo ✓';
                setTimeout(() => {
                    document.getElementById('status-envio').innerText = 'Sincronizado';
                }, 2000);
            });
        }

        function limparTexto() {
            document.getElementById('texto-principal').value = '';
            if (abaAtiva === 'notas' && notas.length) notas.pop();
            if (abaAtiva === 'tarefas' && tarefas.length) tarefas.pop();
            if (abaAtiva === 'despesas' && despesas.length) despesas.pop();
            salvarNoLocalStorage();
            salvarNota();
        }

        function copiarTexto() {
            const txt = document.getElementById('texto-principal').value;
            if (navigator.clipboard && txt) {
                navigator.clipboard.writeText(txt);
                document.getElementById('status-envio').innerText = 'Copiado!';
                setTimeout(() => {
                    document.getElementById('status-envio').innerText = 'Sincronizado';
                }, 1500);
            }
        }

        // Inicialização
        carregarCacheLocal();
        sincronizarNuvem();
    </script>
</body>
</html>
