<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISTEMA HM - Emissão e Registro de AIH</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f1f5f9; margin: 0; padding: 20px; color: #1e293b; }
    .container { max-width: 950px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #0369a1; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; font-size: 22px; }
    fieldset { border: 1px solid #cbd5e1; border-radius: 8px; padding: 16px; margin-bottom: 20px; background: #fafafa; }
    legend { font-weight: 700; color: #0284c7; padding: 0 8px; font-size: 15px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .form-group { margin-bottom: 8px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #475569; }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; background: #fff; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #0284c7; ring: 2px solid #bae6fd; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 5px; }
    th { background: #e0f2fe; text-align: left; padding: 8px; border: 1px solid #cbd5e1; color: #0369a1; }
    td { padding: 4px; border: 1px solid #cbd5e1; }
    .btn-template { background: #e2e8f0; border: 1px solid #cbd5e1; padding: 4px 10px; font-size: 12px; border-radius: 4px; cursor: pointer; font-weight: 600; margin-right: 5px; }
    .btn-template:hover { background: #cbd5e1; }
    .btn-submit { background: #0284c7; color: #fff; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }
    .btn-submit:hover { background: #0369a1; }
    #msgStatus { margin-top: 15px; font-weight: bold; text-align: center; font-size: 14px; }
  </style>
</head>
<body>

<div class="container">
  <h2>Autorização de Internação Hospitalar (AIH) - Registro</h2>

  <form id="formAih">
    <!-- BLOCO: DADOS DO PACIENTE -->
    <fieldset>
      <legend>Identificação do Paciente e Admissão</legend>
      <div class="grid-3">
        <div class="form-group">
          <label>Nº Prontuário:</label>
          <input type="text" id="prontuario" required>
        </div>
        <div class="form-group">
          <label>Nome Completo:</label>
          <input type="text" id="nomePaciente" required>
        </div>
        <div class="form-group">
          <label>Cartão SUS (CNS):</label>
          <input type="text" id="cns">
        </div>
      </div>
      <div class="grid-4">
        <div class="form-group">
          <label>Data de Nascimento:</label>
          <input type="text" id="dataNasc" placeholder="DD/MM/AAAA">
        </div>
        <div class="form-group">
          <label>Sexo:</label>
          <select id="sexo">
            <option value="M">Masculino</option>
            <option value="F">Feminino</option>
          </select>
        </div>
        <div class="form-group">
          <label>Diagnóstico Inicial:</label>
          <input type="text" id="diagInicial" placeholder="Ex: Erisipela">
        </div>
        <div class="form-group">
          <label>CID-10 Principal:</label>
          <input type="text" id="cidPrincipal" placeholder="Ex: A46">
        </div>
      </div>
    </fieldset>

    <!-- BLOCO 1: PROCEDIMENTOS REALIZADOS (PRODUÇÃO SUS) -->
    <fieldset>
      <legend>Procedimentos Realizados</legend>
      <table>
        <thead>
          <tr>
            <th style="width: 40px;">Linha</th>
            <th>Procedimento (SIGTAP)</th>
            <th style="width: 50px;">Qtd</th>
            <th>CPF Executante</th>
            <th style="width: 70px;">CBO</th>
            <th style="width: 80px;">CNES</th>
            <th style="width: 130px;">CNPJ</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><input type="text" id="procLinha1" value="1" style="text-align:center;"></td>
            <td><input type="text" id="procCod1" placeholder="0303080078"></td>
            <td><input type="number" id="procQtd1" value="1"></td>
            <td><input type="text" id="procCpf1" placeholder="CPF"></td>
            <td><input type="text" id="procCbo1" placeholder="CBO"></td>
            <td><input type="text" id="procCnes1" value="2380846"></td>
            <td><input type="text" id="procCnpj1" value="08.349.052/0001-80"></td>
          </tr>
        </tbody>
      </table>
    </fieldset>

    <!-- BLOCO 2: CAUSAS EXTERNAS E AUTORIZAÇÃO -->
    <fieldset>
      <legend>Causas Externas e Autorização</legend>
      <div class="grid-3">
        <div class="form-group">
          <label>Tipo de Acidente:</label>
          <select id="tipoAcidente">
            <option value="">Não se aplica</option>
            <option value="33. Acidente de Transito">33. Acidente de Trânsito</option>
            <option value="34. Acidente Trabalho Tipico">34. Acidente de Trabalho Típico</option>
            <option value="35. Acidente Trabalho Trajeto">35. Acidente de Trabalho Trajeto</option>
          </select>
        </div>
        <div class="form-group">
          <label>Vínculo com a Previdência:</label>
          <select id="vinculoPrev">
            <option value="">Selecione...</option>
            <option value="Empregado">Empregado</option>
            <option value="Empregador">Empregador</option>
            <option value="Autonomo">Autônomo</option>
            <option value="Desempregado">Desempregado</option>
            <option value="Aposentado">Aposentado</option>
            <option value="Nao Segurado">Não Segurado</option>
          </select>
        </div>
        <div class="form-group">
          <label>Nº Autorização AIH:</label>
          <input type="text" id="numAih">
        </div>
      </div>
      <div class="grid-3">
        <div class="form-group">
          <label>Profissional Autorizador:</label>
          <input type="text" id="autorizadorNome">
        </div>
        <div class="form-group">
          <label>Documento (CNS/CPF) Autorizador:</label>
          <input type="text" id="autorizadorDoc" value="185.901.284-15">
        </div>
        <div class="form-group">
          <label>Data da Autorização:</label>
          <input type="date" id="dataAutorizacao">
        </div>
      </div>
    </fieldset>

    <!-- BLOCO 3: FICHA DE ANESTESIA -->
    <fieldset>
      <legend>Ficha de Anestesia</legend>
      <div class="grid-3">
        <div class="form-group">
          <label>Aptidão (GIH):</label>
          <select id="aptidaoAnestesia">
            <option value="Apto">Apto</option>
            <option value="Inapto">Inapto</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tipo / Técnica de Anestesia:</label>
          <input type="text" id="tipoAnestesia" placeholder="Ex: Raqui, Geral, Local">
        </div>
        <div class="form-group">
          <label>Médico Anestesista:</label>
          <input type="text" id="anestesistaNome" value="DR HIAGO - CRM: 8.830">
        </div>
      </div>
      <div class="grid-3">
        <div class="form-group">
          <label>Início da Anestesia:</label>
          <input type="time" id="inicioAnestesia">
        </div>
        <div class="form-group">
          <label>Fim da Anestesia:</label>
          <input type="time" id="fimAnestesia">
        </div>
        <div class="form-group">
          <label>Duração Total:</label>
          <input type="text" id="duracaoAnestesia" placeholder="Ex: 60 min">
        </div>
      </div>
      <div class="form-group">
        <label>Drogas Usadas:</label>
        <input type="text" id="drogasAnestesia" placeholder="Relação de drogas administradas">
      </div>
    </fieldset>

    <!-- BLOCO 4: BOLETIM OPERATÓRIO -->
    <fieldset>
      <legend>Boletim Operatório / Descrição Cirúrgica</legend>
      <div class="grid-4">
        <div class="form-group">
          <label>Cirurgião Operador:</label>
          <input type="text" id="cirurgiaoOperador" value="DR LUCIDIO">
        </div>
        <div class="form-group">
          <label>1º Auxiliar:</label>
          <input type="text" id="cirurgiao1Aux" value="DR HALLYSON">
        </div>
        <div class="form-group">
          <label>Início da Cirurgia:</label>
          <input type="time" id="inicioCirurgia">
        </div>
        <div class="form-group">
          <label>Fim da Cirurgia:</label>
          <input type="time" id="fimCirurgia">
        </div>
      </div>

      <div style="margin: 10px 0 6px 0;">
        <span style="font-size: 13px; font-weight: bold; margin-right: 8px;">Modelos Rápidos de Relatório:</span>
        <button type="button" class="btn-template" onclick="inserirModelo('cesariana')">Cesariana</button>
        <button type="button" class="btn-template" onclick="inserirModelo('colecistectomia')">Colecistectomia</button>
      </div>

      <div class="form-group">
        <label>Relatório de Internação / Descrição do Ato:</label>
        <textarea id="relatorioCirurgico" rows="6"></textarea>
      </div>
    </fieldset>

    <button type="submit" class="btn-submit" id="btnSalvar">Salvar Registro na Planilha</button>
    <div id="msgStatus"></div>
  </form>
</div>

<script>
  // ATENÇÃO: Cole aqui a URL gerada na Implantação (Deploy) do seu Apps Script
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzReK2XpvU3AgoGojdjB0vQqxl8hZEO9xVyHzaUC3juON_W0elUkTSSpgWRrWEbuI1s/exec";

  const MODELOS = {
    cesariana: `Incisão Pfannenstiel transversa, ligeiramente semicircular, atingindo pele, subcutâneo e aponeurose, músculos são afastados, peritônio aberto no sentido vertical. Aberta a cavidade, colocar válvula de Doyen no ângulo inferior da incisão. Exposto o segmento inferior do útero, incisão transversa do peritônio visceral, pequena secção transversa no miométrio, afastando e abrindo o miométrio com ajuda de pinça kocher e com os dedos, completando a abertura. Retirada do feto, deslocar e extrair a placenta. Limpeza da cavidade uterina usando compressas, observar se o canal cervical está permeável. Fechamento do miométrio com CG Cromado "1" contínuo ancorado, não incluindo a mucosa. Fechamento do peritônio visceral com CG Simples "2-0" continuo ancorado. Limpeza da cavidade abbominal com compressas, reposição do útero à cavidade. Fechamento do peritônio parietal com CG Simples "2-0" contínuo. Aproximar músculos com CG Simples "2-0" pontos separados. Sutura da aponeurose com CG Cromado "1" contínua ancorada. Fechamento do subcutâneo com CG Simples "2-0" separados e da pele com mononylon "4-0" contínuo. Curativo Simples.`,
    colecistectomia: `Incisão paramediana supraumbilical desde o rebordo costal direito a cerca de 2 cm da linha mediana até a altura da cicatriz umbilical. Incisão do subcutâneo com hemostasia e da aponeurose a cerca de 1 cm da linha mediana. Afastar músculo reto abdominal, abertura da aponeurose e peritônio. Inventário da cavidade, isolamento do campo com compressas. Ligadura e secção do ducto cístico e artéria cística com fio inabsorvível. Descolamento retrógrado da vesícula biliar do leito hepático. Hemostasia cuidadosa do leito. Retirada da peça cirúrgica. Revisão da hemostasia. Fechamento por planos anatômicos. Curativo estéril.`
  };

  function inserirModelo(tipo) {
    if (MODELOS[tipo]) {
      document.getElementById('relatorioCirurgico').value = MODELOS[tipo];
    }
  }

  document.getElementById('formAih').addEventListener('submit', async function(e) {
    e.preventDefault();
    const status = document.getElementById('msgStatus');
    const btn = document.getElementById('btnSalvar');

    status.style.color = '#0284c7';
    status.innerText = 'Enviando registro para o Google Sheets...';
    btn.disabled = true;

    const payload = {
      prontuario: document.getElementById('prontuario').value,
      nomePaciente: document.getElementById('nomePaciente').value,
      cns: document.getElementById('cns').value,
      dataNasc: document.getElementById('dataNasc').value,
      sexo: document.getElementById('sexo').value,
      diagInicial: document.getElementById('diagInicial').value,
      cidPrincipal: document.getElementById('cidPrincipal').value,
      
      // Produção SUS
      procCod: document.getElementById('procCod1').value,
      procQtd: document.getElementById('procQtd1').value,
      procCpf: document.getElementById('procCpf1').value,
      procCbo: document.getElementById('procCbo1').value,
      procCnes: document.getElementById('procCnes1').value,
      procCnpj: document.getElementById('procCnpj1').value,
      
      // Causas Externas e Autorização
      tipoAcidente: document.getElementById('tipoAcidente').value,
      vinculoPrev: document.getElementById('vinculoPrev').value,
      numAih: document.getElementById('numAih').value,
      autorizadorNome: document.getElementById('autorizadorNome').value,
      autorizadorDoc: document.getElementById('autorizadorDoc').value,
      dataAutorizacao: document.getElementById('dataAutorizacao').value,
      
      // Anestesia
      aptidaoAnestesia: document.getElementById('aptidaoAnestesia').value,
      tipoAnestesia: document.getElementById('tipoAnestesia').value,
      anestesistaNome: document.getElementById('anestesistaNome').value,
      inicioAnestesia: document.getElementById('inicioAnestesia').value,
      fimAnestesia: document.getElementById('fimAnestesia').value,
      duracaoAnestesia: document.getElementById('duracaoAnestesia').value,
      drogasAnestesia: document.getElementById('drogasAnestesia').value,
      
      // Cirurgia
      cirurgiaoOperador: document.getElementById('cirurgiaoOperador').value,
      cirurgiao1Aux: document.getElementById('cirurgiao1Aux').value,
      inicioCirurgia: document.getElementById('inicioCirurgia').value,
      fimCirurgia: document.getElementById('fimCirurgia').value,
      relatorioCirurgico: document.getElementById('relatorioCirurgico').value
    };

    try {
      // Uso de text/plain para evitar bloqueio por pre-flight CORS no Google Apps Script
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      if (data.status === 'success') {
        status.style.color = '#16a34a';
        status.innerText = `Paciente salvo com sucesso na linha ${data.row}!`;
      } else {
        throw new Error(data.message || 'Erro desconhecido');
      }
    } catch (err) {
      status.style.color = '#dc2626';
      status.innerText = 'Falha ao salvar: ' + err.message;
    } finally {
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
