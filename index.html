<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Geral</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; }
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #e0e0e0; cursor: pointer; border-radius: 6px; font-weight: bold; }
        .tab-btn.active { background: #007bff; color: white; }
        .tab-content { display: none; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 0.9rem; font-weight: 500; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button.btn-primary { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .card-item { background: #f8f9fa; border-left: 4px solid #007bff; padding: 10px; margin-top: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        
        /* Preserva as quebras de linha e formatação do texto */
        .nota-conteudo { white-space: pre-wrap; word-break: break-word; line-height: 1.4; }
        
        .generator-box { background: #eef6ff; border: 1px dashed #007bff; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('despesas')">💰 Gastos</button>
        <button class="tab-btn" onclick="switchTab('tarefas')">📋 Tarefas</button>
        <button class="tab-btn" onclick="switchTab('notas')">📝 Notas</button>
    </div>

    <!-- ABA DESPESAS -->
    <div id="tab-despesas" class="tab-content active">
        <div class="form-group">
            <label>Descrição</label>
            <input type="text" id="gasto-desc">
        </div>
        <div class="form-group">
            <label>Valor (R$)</label>
            <input type="number" step="0.01" id="gasto-valor">
        </div>
        <button class="btn-primary" onclick="addGasto()">Adicionar Gasto</button>
        <div id="lista-despesas"></div>
    </div>

    <!-- ABA TAREFAS -->
    <div id="tab-tarefas" class="tab-content">
        <div class="form-group">
            <label>Tarefa</label>
            <input type="text" id="tarefa-texto">
        </div>
        <button class="btn-primary" onclick="addTarefa()">Adicionar Tarefa</button>
        <div id="lista-tarefas"></div>
    </div>

    <!-- ABA NOTAS -->
    <div id="tab-notas" class="tab-content">
        <div class="generator-box">
            <label style="font-size: 0.85rem; font-weight: bold;">📎 Gerador de Link Fixo (GitHub):</label>
            <input type="text" id="nome-foto-gh" placeholder="Ex: recibo1.jpg" style="margin-top: 5px;" oninput="gerarLinkGitHub()">
        </div>

        <div class="form-group">
            <label>Título / Manchete</label>
            <input type="text" id="nota-titulo">
        </div>
        <div class="form-group">
            <label>Texto / Conteúdo</label>
            <textarea id="nota-texto" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label>Link / Anexo</label>
            <input type="text" id="nota-link">
        </div>
        <button class="btn-primary" onclick="addNota()">Fixar Nota</button>
        <div id="lista-notas"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwNU1UIq_W8m3CVCQqKXSDLGg1A4vVk_3hk4g8q02MLhmY-5jirQz6VIiSy74KsP3YN/exec';
    
    let despesas = [];
    let tarefas = [];
    let notas = [];

    function carregarDadosNuvem() {
        const script = document.createElement('script');
        script.src = `${SCRIPT_URL}?callback=receberDadosNuvem&t=${Date.now()}`;
        document.body.appendChild(script);
    }

    function receberDadosNuvem(data) {
        if (data) {
            despesas = data.despesas || [];
            tarefas = data.tarefas || [];
            notas = data.notas || [];
            renderAll();
        }
    }

    function enviarDadosNuvem() {
        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ despesas, tarefas, notas })
        });
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        event.target.classList.add('active');
        document.getElementById(`tab-${tab}`).classList.add('active');
    }

    function gerarLinkGitHub() {
        const arq = document.getElementById('nome-foto-gh').value.trim();
        if (arq) {
            document.getElementById('nota-link').value = `https://lucidiojf.github.io/painel1/${arq}`;
        }
    }

    function renderAll() {
        renderDespesas();
        renderTarefas();
        renderNotas();
    }

    function renderDespesas() {
        const container = document.getElementById('lista-despesas');
        if (!container) return;
        container.innerHTML = '';
        despesas.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'card-item';
            div.innerHTML = `
                <div><strong>${item.desc}</strong> - R$ ${parseFloat(item.valor).toFixed(2)}</div>
                <button onclick="removerGasto(${index})" style="background:none;border:none;cursor:pointer;">🗑️</button>
            `;
            container.appendChild(div);
        });
    }

    function renderTarefas() {
        const container = document.getElementById('lista-tarefas');
        if (!container) return;
        container.innerHTML = '';
        tarefas.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'card-item';
            div.innerHTML = `
                <div>${item.texto}</div>
                <button onclick="removerTarefa(${index})" style="background:none;border:none;cursor:pointer;">🗑️</button>
            `;
            container.appendChild(div);
        });
    }

    function renderNotas() {
        const container = document.getElementById('lista-notas');
        if (!container) return;
        container.innerHTML = '';
        notas.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'card-item';
            
            let htmlConteudo = '';

            // Suporte para notas antigas (salvas apenas como string simples)
            if (typeof item === 'string') {
                if (item.startsWith('http://') || item.startsWith('https://')) {
                    htmlConteudo = `<a href="${item}" target="_blank" style="word-break: break-all; color: #007bff;">${item}</a>`;
                } else {
                    htmlConteudo = `<div class="nota-conteudo">${item}</div>`;
                }
            } else {
                // Suporte para notas novas (com objeto titulo, texto, link)
                const tituloStr = item.titulo ? `<strong>${item.titulo}</strong><br>` : '';
                const textoStr = item.texto ? `<div class="nota-conteudo">${item.texto}</div>` : '';
                const linkStr = item.link ? `<a href="${item.link}" target="_blank" style="word-break: break-all; color: #007bff;">${item.link}</a>` : '';
                
                // Se for uma nota antiga em objeto que salvou tudo no texto/título ou link puro
                if (!item.titulo && !item.texto && item.link) {
                    htmlConteudo = `<a href="${item.link}" target="_blank" style="word-break: break-all; color: #007bff;">${item.link}</a>`;
                } else {
                    htmlConteudo = `${tituloStr}${textoStr}${linkStr}`;
                }
            }

            div.innerHTML = `
                <div style="flex: 1; margin-right: 10px;">
                    ${htmlConteudo}
                </div>
                <div style="display: flex; gap: 8px; align-items: center; flex-shrink: 0;">
                    <button onclick="editarNota(${index})" style="background: none; border: none; cursor: pointer; font-size: 1.1rem;" title="Editar">✏️</button>
                    <button onclick="removerNota(${index})" style="background: none; border: none; cursor: pointer; font-size: 1.1rem;" title="Excluir">🗑️</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function addGasto() {
        const desc = document.getElementById('gasto-desc').value.trim();
        const valor = document.getElementById('gasto-valor').value.trim();
        if(!desc || !valor) return;
        despesas.push({ id: Date.now(), desc, valor });
        document.getElementById('gasto-desc').value = '';
        document.getElementById('gasto-valor').value = '';
        renderAll();
        enviarDadosNuvem();
    }

    function removerGasto(index) {
        despesas.splice(index, 1);
        renderAll();
        enviarDadosNuvem();
    }

    function addTarefa() {
        const texto = document.getElementById('tarefa-texto').value.trim();
        if(!texto) return;
        tarefas.push({ id: Date.now(), texto });
        document.getElementById('tarefa-texto').value = '';
        renderAll();
        enviarDadosNuvem();
    }

    function removerTarefa(index) {
        tarefas.splice(index, 1);
        renderAll();
        enviarDadosNuvem();
    }

    function addNota() {
        const titulo = document.getElementById('nota-titulo').value.trim();
        const texto = document.getElementById('nota-texto').value.trim();
        const link = document.getElementById('nota-link').value.trim();
        if(!texto && !link && !titulo) return;

        notas.push({ id: Date.now(), titulo, texto, link });
        document.getElementById('nota-titulo').value = '';
        document.getElementById('nota-texto').value = '';
        document.getElementById('nota-link').value = '';
        document.getElementById('nome-foto-gh').value = '';
        renderAll();
        enviarDadosNuvem();
    }

    function editarNota(index) {
        const item = notas[index];
        if (!item) return;

        if (typeof item === 'string') {
            if (item.startsWith('http://') || item.startsWith('https://')) {
                document.getElementById('nota-link').value = item;
            } else {
                document.getElementById('nota-texto').value = item;
            }
        } else {
            document.getElementById('nota-titulo').value = item.titulo || '';
            document.getElementById('nota-texto').value = item.texto || '';
            document.getElementById('nota-link').value = item.link || '';
        }

        notas.splice(index, 1);
        renderAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function removerNota(index) {
        notas.splice(index, 1);
        renderAll();
        enviarDadosNuvem();
    }

    carregarDadosNuvem();
</script>

</body>
</html>
