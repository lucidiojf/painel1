<!-- INTERFACE: ESCOLHA DA PASTA E ARQUIVO -->
<div style="margin: 10px 0; display: flex; flex-direction: column; gap: 8px;">
    <label style="font-size: 14px; font-weight: bold; color: #374151;">Pasta no Dropbox:</label>
    <select id="dropbox-pasta" style="padding: 8px; border-radius: 6px; border: 1px solid #d1d5db; font-size: 16px;">
        <option value="/notas">📁 /notas</option>
        <option value="/gastos">📁 /gastos</option>
        <option value="/documentos">📁 /documentos</option>
        <option value="/exames">📁 /exames</option>
    </select>

    <label style="font-size: 14px; font-weight: bold; color: #374151;">Anexo:</label>
    <input type="file" id="arquivo-anexo" style="font-size: 14px;">

    <button type="button" onclick="executarUploadDropbox()" style="background: #0061fe; color: #fff; border: none; padding: 10px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;">
        📤 Enviar para Dropbox
    </button>
    
    <span id="status-upload" style="font-size: 13px; color: #6b7280;"></span>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwNU1UIq_W8m3CVCQqKXSDLGg1A4vVk_3hk4g8q02MLhmY-5jirQz6VIiSy74KsP3YN/exec';

// Função para converter o arquivo selecionado em Base64
function converterArquivoBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => {
            // Remove o prefixo (ex: "data:image/png;base64,") para enviar só o binário codificado
            const base64Limpo = reader.result.split(',')[1];
            resolve(base64Limpo);
        };
        reader.onerror = error => reject(error);
    });
}

// Função principal de envio
async function executarUploadDropbox() {
    const inputArquivo = document.getElementById('arquivo-anexo');
    const pastaDestino = document.getElementById('dropbox-pasta').value;
    const statusTxt = document.getElementById('status-upload');

    if (!inputArquivo.files.length) {
        alert('Selecione um arquivo primeiro!');
        return;
    }

    const file = inputArquivo.files[0];
    statusTxt.innerText = 'Enviando arquivo ao Dropbox... ⏳';

    try {
        const base64Data = await converterArquivoBase64(file);

        // Envia para o Google Apps Script
        const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({
                acao: 'upload_dropbox',
                base64: base64Data,
                nomeArquivo: file.name,
                pasta: pastaDestino
            })
        });

        const resultado = await response.json();

        if (resultado.status === 'sucesso') {
            statusTxt.innerText = '✓ Anexo enviado com sucesso!';
            console.log('Link gerado:', resultado.link);
            
            // Exemplo: se você quiser colocar o link direto na caixa de texto da nota atual:
            const txtArea = document.getElementById('texto-principal');
            if (txtArea) {
                txtArea.value += `\n📎 Anexo: ${resultado.link}`;
            }

            alert('Arquivo salvo na pasta ' + pastaDestino + '!\nLink: ' + resultado.link);
        } else {
            statusTxt.innerText = 'Erro no envio.';
            alert('Erro: ' + resultado.mensagem);
        }
    } catch (erro) {
        console.error(erro);
        statusTxt.innerText = 'Falha de conexão.';
        alert('Erro ao processar o upload.');
    }
}
</script>
